version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Mon Patrimoine CI — Stack complète avec Ollama IA local
#
#  Lancement :
#    docker compose up -d --build
#
#  Avec GPU NVIDIA (génération 3-5× plus rapide) :
#    docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
#  Premier lancement : télécharge llama3 automatiquement (~4.7 Go)
#  Modèles stockés dans le volume ollama_data (persistent entre restarts)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Flask (backend + frontend) ───────────────────────────────────────────
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Flask parle à Ollama via le réseau interne Docker (jamais localhost)
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Ollama (LLM local) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    # ports:
    #   - "11434:11434"     # décommenter si tu veux accès direct depuis la machine hôte
    volumes:
      - ollama_data:/root/.ollama   # modèles persistants
    restart: unless-stopped
    environment:
      # Autorise les requêtes venant du service web et du navigateur
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ── One-shot : pull des modèles au 1er démarrage ─────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        echo '⏳ Attente du service Ollama...' &&
        until curl -sf http://ollama:11434/api/tags > /dev/null; do
          sleep 3
        done &&
        echo '✅ Ollama prêt. Vérification des modèles...' &&
        ollama list | grep -q 'llama3' || (echo '📥 Téléchargement llama3...' && ollama pull llama3) &&
        echo '✅ llama3 disponible.'
      "
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data:
    driver: local

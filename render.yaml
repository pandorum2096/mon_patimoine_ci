services:
  - type: web
    name: mon-patrimoine-ci
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: patrimoine-db
          property: connectionString

databases:
  - name: patrimoine-db
    plan: free
    databaseName: patrimoine
    user: patrimoine_user

          <div style={{ padding: "3px 10px", borderRadius: 20, background: "rgba(201,168,76,0.15)", border: "1px solid rgba(201,168,76,0.3)", fontSize: 11, color: "var(--gold)", fontWeight: 700, textTransform: "capitalize" }}>{profilRisque}</div>
          <div style={{ fontSize: 11, color: "var(--muted)" }}>· {placementsFiltrés.length} placements</div>
        </div>

        {placementsFiltrés.map((p, idx) => {
          const isExp = expandedPlacement === p.id;
          const rColor = RISK_COLORS[Math.min(p.risk - 1, 4)];
          return (
            <div key={p.id} style={{ borderRadius: 10, border: `1px solid ${isExp ? rColor : "var(--border)"}`, overflow: "hidden", marginBottom: 8, transition: "border-color 0.2s" }}>
              {/* Header cliquable */}
              <div onClick={() => setExpandedPlacement(isExp ? null : p.id)}
                style={{ padding: "12px 14px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", background: isExp ? `${rColor}10` : "transparent" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: `${rColor}20`, border: `1px solid ${rColor}40`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>
                    {p.icon}
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, color: "var(--text)", fontSize: 13 }}>{p.label}</div>
                    <div style={{ fontSize: 11, color: "var(--muted)" }}>{p.produit}</div>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ color: "var(--green)", fontWeight: 700, fontSize: 13 }}>{p.rendement}</div>
                    <div style={{ display: "flex", gap: 2, justifyContent: "flex-end", marginTop: 2 }}>
                      {[1,2,3,4,5].map(i => (
                        <div key={i} style={{ width: 6, height: 6, borderRadius: 2, background: i <= p.risk ? rColor : "var(--surface)" }} />
                      ))}
                    </div>
                  </div>
                  <span style={{ color: "var(--muted)", fontSize: 12 }}>{isExp ? "▲" : "▼"}</span>
                </div>
              </div>
              {/* Corps */}
              {isExp && (
                <div style={{ padding: "12px 14px", borderTop: `1px solid ${rColor}25`, background: `${rColor}06` }}>
                  <p style={{ fontSize: 12, color: "var(--muted)", margin: "0 0 12px", lineHeight: 1.6 }}>{p.description}</p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
                    <div style={{ textAlign: "center", padding: 8, borderRadius: 8, background: "var(--surface)" }}>
                      <div style={{ fontSize: 9, color: "var(--muted)", marginBottom: 3 }}>RENDEMENT</div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: "var(--green)" }}>{p.rendement}</div>
                    </div>
                    <div style={{ textAlign: "center", padding: 8, borderRadius: 8, background: "var(--surface)" }}>
                      <div style={{ fontSize: 9, color: "var(--muted)", marginBottom: 3 }}>RISQUE</div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: rColor }}>{p.risk}/5</div>
                    </div>
                    <div style={{ textAlign: "center", padding: 8, borderRadius: 8, background: "var(--surface)" }}>
                      <div style={{ fontSize: 9, color: "var(--muted)", marginBottom: 3 }}>GAIN EST.</div>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "var(--gold)" }}>+{fmt(Math.round(solde * (parseFloat(p.rendement) / 100)))}</div>
                    </div>
                  </div>
                  {/* Bouton Simuler ce placement */}
                  <button onClick={e => { e.stopPropagation(); const tStr = p.rendement.replace(/[^0-9.]/g,"").split("-")[0]; setTaux(tStr); setActivePresetTaux(null); setExpandedPlacement(null); }}
                    style={{ ...G.btnSm(rColor), width: "100%", padding: "8px 12px", fontSize: 12, color: "#ffffff", fontWeight: 700 }}>
                    ⚙️ Simuler avec ce taux ({p.rendement})
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ── Stratégie recommandée ── */}
      <div style={G.card}>
        <SectionHeader title="🗺️ Stratégie recommandée" color="var(--accent)" />
        <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 14 }}>
          Répartition de <strong style={{ color: "var(--gold)" }}>{fmt(solde)} FCFA</strong> selon votre profil <strong style={{ color: "var(--accent)", textTransform: "capitalize" }}>{profilRisque}</strong>
        </div>

        {/* Barre empilée */}
        <div style={{ height: 16, borderRadius: 8, overflow: "hidden", display: "flex", marginBottom: 14 }}>
          {strategie.map(s => (
            <div key={s.label} title={`${s.label} — ${s.pct}%`}
              style={{ width: `${s.pct}%`, height: "100%", background: s.color, transition: "width 0.4s ease" }} />
          ))}
        </div>

        {/* Légende détaillée */}
        {strategie.map(s => (
          <div key={s.label} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid var(--border)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flexShrink: 0 }} />
              <span style={{ fontSize: 13 }}>{s.icon} {s.label}</span>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: s.color }}>{s.pct}%</div>
              <div style={{ fontSize: 11, color: "var(--muted)" }}>{fmt(Math.round(solde * s.pct / 100))} FCFA</div>
            </div>
          </div>
        ))}
      </div>

      {/* IA Ollama — Conseil personnalisé */}
      <OllamaConseil data={data} mois={mois} />
    </div>
  );
}

function OllamaConseil({ data, mois }) {
  const [iaModel, setIaModel] = useState("llama3");
  const [iaModels, setIaModels] = useState([]);
  const [iaLoading, setIaLoading] = useState(false);
  const [iaResponse, setIaResponse] = useState("");
  const [iaError, setIaError] = useState("");
  const [dots, setDots] = useState("");

  const OLLAMA_DIRECT = "http://localhost:11434";

  // Charge les modèles à chaque montage du composant (cache: "no-store" pour éviter les vieux modèles)
  useEffect(() => {
    const token = getToken();
    const viaFlask = token
      ? fetch("/api/ollama-models", { headers: { Authorization: "Bearer " + token }, cache: "no-store" })
          .then(r => r.json()).then(d => d.ok && d.models.length ? d.models : null).catch(() => null)
      : Promise.resolve(null);

    viaFlask.then(models => {
      if (models) {
        setIaModels(models);
        setIaModel(models[0]); // toujours sélectionner le premier modèle actif
        return;
      }
      // Fallback : appel direct à Ollama
      fetch(OLLAMA_DIRECT + "/api/tags", { cache: "no-store" })
        .then(r => r.json())
        .then(d => { const ms = (d.models||[]).map(m=>m.name); if (ms.length) { setIaModels(ms); setIaModel(ms[0]); } })
        .catch(() => {});
    });
  }, []);

  useEffect(() => {
    if (!iaLoading) { setDots(""); return; }
    const iv = setInterval(() => setDots(p => p.length >= 3 ? "" : p + "."), 400);
    return () => clearInterval(iv);
  }, [iaLoading]);

  // Construit le prompt français côté frontend (utilisé pour l'appel direct)
  const buildPrompt = (revenus, depenses, solde, epargne, patrimoine, objectifs, actifs) => {
    const nom = data.profil.nom || "l'utilisateur";
    const revenuM = data.profil.revenuMensuel || 0;
    const profilR = data.profil.profilRisque || "équilibré";
    const tauxEp = revenus > 0 ? Math.round(epargne / revenus * 100) : 0;
    const objTxt = objectifs.length
      ? objectifs.slice(0,4).map(o=>`${o.nom} (${o.epargne.toLocaleString()}/${o.cible.toLocaleString()} FCFA)`).join(", ")
      : "Aucun objectif défini";
    const actifTxt = actifs.length
      ? actifs.slice(0,5).map(a=>`${a.nom} (${a.valeur.toLocaleString()} FCFA)`).join(", ")
      : "Aucun actif enregistré";
    return `Tu es un conseiller financier expert spécialisé en finances personnelles en Côte d'Ivoire (zone UEMOA, devise FCFA). Réponds en français.

PROFIL :
- Nom : ${nom}
- Revenu mensuel : ${revenuM.toLocaleString()} FCFA
- Profil de risque : ${profilR}

SITUATION DU MOIS (${mois}) :
- Revenus : ${revenus.toLocaleString()} FCFA
- Dépenses : ${depenses.toLocaleString()} FCFA
- Épargne/investissements : ${epargne.toLocaleString()} FCFA  (taux : ${tauxEp}%)
- Solde disponible : ${solde.toLocaleString()} FCFA
- Patrimoine net : ${patrimoine.toLocaleString()} FCFA

ACTIFS : ${actifTxt}
OBJECTIFS : ${objTxt}

MISSION : Donne 4 à 5 conseils financiers personnalisés, précis et actionnables.
- Inclus des montants FCFA concrets
- Mentionne des produits CI si pertinent (Djamo Invest, NSIA AM, BRVM, Orange Money Épargne…)
- Structure avec des titres courts (ex: "💡 Optimise ton épargne") et des points clairs
- Maximum 500 mots. Réponds uniquement en français.`;
  };

  const analyser = useCallback(() => {
    setIaLoading(true); setIaError(""); setIaResponse("");
    const p = getPeriode(data, mois);
    const revenus   = p.revenus.reduce((a,r)=>a+r.montant,0);
    const depenses  = p.depenses.reduce((a,d)=>a+d.montant,0);
    const solde     = getSolde(data, mois);
    const epargne   = data.transactions.filter(t=>t.mois===mois&&(t.type==="objectif"||t.type==="investissement")).reduce((a,t)=>a+t.montant,0);
    const patrimoine= data.patrimoine.reduce((a,pt)=>a+pt.valeurActuelle,0);
    const actifs    = data.patrimoine.map(pt=>({ nom:pt.nom, type:pt.type, valeur:pt.valeurActuelle }));
    const objectifs = data.objectifs.map(o=>({ nom:o.nom, cible:o.cible, epargne:o.epargne }));

    const token = getToken();

    if (!token) {
      setIaLoading(false);
      setIaError("Non authentifié — reconnectez-vous.");
      return;
    }

    // Appel Flask — si Flask répond (même avec erreur), on affiche le vrai message
    // Si Flask est totalement injoignable (réseau), on tente Ollama direct en fallback
    fetch("/api/conseil-ia", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ profile:data.profil, revenus, depenses, solde, epargne, patrimoine, objectifs, actifs, mois, model:iaModel })
    })
    .then(r => r.json())
    .then(d => {
      setIaLoading(false);
      if (d.ok) setIaResponse(d.conseil);
      else setIaError(d.error || "Erreur inconnue du serveur.");
    })
    .catch(() => {
      // Flask totalement injoignable → fallback Ollama direct (dev local sans Flask)
      const prompt = buildPrompt(revenus, depenses, solde, epargne, patrimoine, objectifs, actifs);
      fetch(OLLAMA_DIRECT + "/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: iaModel, prompt, stream: false, options: { temperature: 0.7, num_predict: 700 } })
      })
      .then(r => r.json())
      .then(d => { setIaLoading(false); setIaResponse(d.response || "Réponse vide."); })
      .catch(() => {
        setIaLoading(false);
        setIaError("Serveur inaccessible. Vérifiez que Flask tourne (python app.py) ou qu'Ollama est démarré.");
      });
    });
  }, [data, mois, iaModel]);

  return (
    <div style={{ ...G.card, border: "1px solid rgba(139,92,246,0.35)", background: "rgba(139,92,246,0.05)" }}>
      <SectionHeader title="🤖 Conseil IA personnalisé" color="var(--purple)" />
      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 14 }}>
        Analyse approfondie de votre situation financière par intelligence artificielle (Ollama local).
      </div>

      {/* Model selector + button */}
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flex: 1, minWidth: 180 }}>
          <span style={{ fontSize: 11, color: "var(--muted)", whiteSpace: "nowrap" }}>Modèle IA :</span>
          <select
            value={iaModel}
            onChange={e => setIaModel(e.target.value)}
            style={{ flex: 1, padding: "6px 10px", borderRadius: 6, border: "1px solid rgba(139,92,246,0.4)", background: "rgba(15,20,35,0.8)", color: "var(--text)", fontSize: 12, fontFamily: "Space Mono,monospace" }}
          >
            {iaModels.length > 0
              ? iaModels.map(m => <option key={m} value={m}>{m}</option>)
              : ["llama3","llama3:8b","mistral","gemma2","phi3","qwen2"].map(m => <option key={m} value={m}>{m}</option>)
            }
          </select>
        </div>
        <button
          onClick={analyser}
          disabled={iaLoading}
          style={{ padding: "8px 18px", borderRadius: 8, border: "none", background: iaLoading ? "rgba(139,92,246,0.3)" : "linear-gradient(135deg,#8B5CF6,#6D28D9)", color: "#fff", fontWeight: 700, fontSize: 13, cursor: iaLoading ? "default" : "pointer", transition: "all 0.2s", display: "flex", alignItems: "center", gap: 6 }}
        >
          {iaLoading ? <>⏳ Analyse{dots}</> : "🤖 Analyser mon profil"}
        </button>
      </div>

      {/* Loading */}
      {iaLoading && (
        <div style={{ padding: "18px 0", textAlign: "center" }}>
          <div style={{ display: "inline-block", width: 36, height: 36, border: "3px solid rgba(139,92,246,0.2)", borderTopColor: "var(--purple)", borderRadius: "50%", animation: "spin 0.8s linear infinite", marginBottom: 10 }} />
          <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "Space Mono,monospace" }}>Génération du conseil en cours{dots}</div>
        </div>
      )}

      {/* Error */}
      {iaError && !iaLoading && (
        <div style={{ padding: 12, borderRadius: 8, background: "rgba(239,68,68,0.1)", border: "1px solid rgba(239,68,68,0.3)", color: "var(--red)", fontSize: 12, marginTop: 6 }}>
          ⚠️ {iaError}
          {iaError.includes("Ollama") && (
            <div style={{ marginTop: 6, fontSize: 11, color: "var(--muted)" }}>
              Vérifiez que le conteneur Ollama tourne : <code style={{ background: "rgba(0,0,0,0.3)", padding: "1px 6px", borderRadius: 3 }}>docker compose up ollama -d</code>
            </div>
          )}
        </div>
      )}

      {/* AI Response */}
      {iaResponse && !iaLoading && (
        <div style={{ marginTop: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <div style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--green)", boxShadow: "0 0 8px var(--green)" }} />
            <span style={{ fontSize: 11, color: "var(--green)", fontWeight: 600 }}>Analyse générée par {iaModel}</span>
          </div>
          <div style={{ background: "rgba(15,20,35,0.6)", border: "1px solid rgba(139,92,246,0.2)", borderRadius: 10, padding: "16px 18px", lineHeight: 1.7 }}>
            {iaResponse.split("\n").filter(l => l.trim()).map((line, i) => {
              const isTitre = line.startsWith("##") || line.startsWith("**") || /^[🎯💡📊🏦⚡🔑✅⚠️]/.test(line);
              return (
                <div key={i} style={{
                  fontSize: isTitre ? 13 : 12,
                  color: isTitre ? "var(--text)" : "var(--muted)",
                  fontWeight: isTitre ? 700 : 400,
                  marginBottom: isTitre ? 8 : 4,
                  marginTop: isTitre && i > 0 ? 12 : 0,
                  paddingLeft: !isTitre && line.startsWith("-") ? 8 : 0,
                }}>
                  {line.replace(/^\*\*|\*\*$/g, "").replace(/^##\s?/, "")}
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 10, color: "var(--muted)", marginTop: 8, textAlign: "right", opacity: 0.6 }}>
            IA locale · Aucune donnée envoyée en ligne · {new Date().toLocaleDateString("fr-FR")}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ONGLET PATRIMOINE ───────────────────────────────────────────────────────────
function TabPatrimoine({ data, setData, mois }) {
  const isMobile = useMobile();
  const [showForm, setShowForm] = useState(false);
  const [aType, setAType] = useState("urgence");
  const [aNom, setANom] = useState("");
  const [aValAchat, setAValAchat] = useState("");
  const [aValActuelle, setAValActuelle] = useState("");
  const [updateId, setUpdateId] = useState(null);
  const [updateVal, setUpdateVal] = useState("");
  const [hovKpi, setHovKpi] = React.useState(null);
  const [hovBar, setHovBar] = React.useState(null);
  const [hovActif, setHovActif] = React.useState(null);
  const [mounted, setMounted] = React.useState(false);
  React.useEffect(() => { const t = setTimeout(() => setMounted(true), 80); return () => clearTimeout(t); }, []);

  const solde = getSolde(data, mois);
  const totalActifs = data.patrimoine.reduce((a,p)=>a+p.valeurActuelle,0);
  const totalInitial = data.patrimoine.reduce((a,p)=>a+p.valeurInitiale,0);
  const plusValue = totalActifs - totalInitial;
  const plusValueColor = plusValue >= 0 ? "var(--green)" : "var(--red)";
  const epargneObj = data.objectifs.reduce((a,o)=>a+o.epargne,0);
  const patrimoineNet = totalActifs + epargneObj + solde;

  // Score santé
  const fondsUrgence = data.patrimoine.filter(p=>p.type==="urgence").reduce((a,p)=>a+p.valeurActuelle,0);
  const depMois = getPeriode(data,mois).depenses.reduce((a,d)=>a+d.montant,0);
  const urgenceOk = fondsUrgence >= depMois * 3;
  const types3 = new Set(data.patrimoine.map(p=>p.type)).size >= 3;
  const liquid = data.patrimoine.filter(p=>ASSET_TYPES.find(t=>t.id===p.type)?.liquid).reduce((a,p)=>a+p.valeurActuelle,0);
  const liquidRatio = totalActifs > 0 ? (liquid/totalActifs)*100 : 0;
  const liquidOk = liquidRatio >= 30 && liquidRatio <= 80;
  const plusOk = plusValue >= 0;
  const score = [urgenceOk, types3, liquidOk, plusOk].filter(Boolean).length * 25;

  const criteres = [
    { label: "Urgence ≥ 3 mois de dépenses", ok: urgenceOk },
    { label: "3+ types d'actifs différents", ok: types3 },
    { label: "Liquidité 30-80%", ok: liquidOk },
    { label: "Plus-value positive", ok: plusOk },
  ];

  // PieChart répartition
  const COLORS = ["#C9A84C","#3B82F6","#10B981","#8B5CF6","#EF4444","#F59E0B","#06B6D4","#EC4899","#84CC16","#F97316"];
  const pieData = ASSET_TYPES.map((t,i) => ({
    name: `${t.icon} ${t.label}`,
    value: data.patrimoine.filter(p=>p.type===t.id).reduce((a,p)=>a+p.valeurActuelle,0),
    color: COLORS[i],
  })).filter(d=>d.value>0);

  const ajouterActif = () => {
    const vAchat = parseFloat(aValAchat) || 0;
    const vActuelle = parseFloat(aValActuelle);
    if (!aNom.trim() || isNaN(vActuelle) || vActuelle < 0) return;
    const actif = {
      id: genId(), type: aType, nom: aNom.trim(),
      valeurInitiale: vAchat || vActuelle, valeurActuelle: vActuelle,
      dateAchat: new Date().toISOString().split("T")[0], source: "manuel",
    };
    setData({ ...data, patrimoine: [...data.patrimoine, actif] });
    setANom(""); setAValAchat(""); setAValActuelle(""); setShowForm(false);
  };

  const mettreAJour = (id) => {
    const v = parseFloat(updateVal);
    if (isNaN(v) || v < 0) return;
    setData({ ...data, patrimoine: data.patrimoine.map(p => p.id === id ? { ...p, valeurActuelle: v } : p) });
    setUpdateId(null); setUpdateVal("");
  };

  const supprimerActif = (actif) => {
    if (actif.source === "manuel") {
      setData({ ...data, patrimoine: data.patrimoine.filter(p => p.id !== actif.id) });
    } else {
      const txs = data.transactions.filter(t => t.patrimoineId === actif.id);
      let periodes = { ...data.periodes };
      txs.forEach(tx => {
        if (!periodes[tx.mois]) periodes[tx.mois] = DEFAULT_PERIODE();
        periodes[tx.mois] = { ...periodes[tx.mois], allocations: Math.max(0, (periodes[tx.mois].allocations||0) - tx.montant) };
      });
      setData({
        ...data,
        patrimoine: data.patrimoine.filter(p => p.id !== actif.id),
        transactions: data.transactions.filter(t => t.patrimoineId !== actif.id),
        periodes,
      });
    }
  };

  // Jauge SVG score
  const r = 54, circ = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  const scoreColor = score >= 75 ? "var(--green)" : score >= 50 ? "var(--gold)" : "var(--red)";

  const kpis = [
    { id:"actifs",   icon:"💎", label:"Actifs",     value: totalActifs, color:"#C9A84C", sub:"total des actifs" },
    { id:"obj",      icon:"🎯", label:"Objectifs",  value: epargneObj,  color:"#3B82F6", sub:"épargne allouée" },
    { id:"pv",       icon: plusValue>=0?"📈":"📉", label:"Plus-value", value: plusValue, color: plusValue>=0?"#10B981":"#EF4444", sub: plusValue>=0?"gain latent":"perte latente" },
    { id:"solde",    icon:"💰", label:"Solde dispo", value: solde,       color:"#C9A84C", sub:"disponible ce mois" },
  ];

  return (
    <div>
      {/* Net total — hero animé */}
      <div style={{
        ...G.card, borderColor:"rgba(201,168,76,0.4)", textAlign:"center",
        background:"linear-gradient(135deg,rgba(201,168,76,0.06) 0%,rgba(11,22,40,0.9) 100%)",
        position:"relative", overflow:"hidden", marginBottom: isMobile ? 14 : 20,
        boxShadow:"0 0 40px rgba(201,168,76,0.12), inset 0 1px 0 rgba(201,168,76,0.15)",
        transform: mounted ? "translateY(0)" : "translateY(8px)",
        opacity: mounted ? 1 : 0,
        transition:"transform 0.5s ease, opacity 0.5s ease",
      }}>
        {/* Shimmer bg */}
        <div style={{ position:"absolute", inset:0, background:"radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.08) 0%,transparent 65%)", pointerEvents:"none" }} />
        <div style={{ position:"relative" }}>
          <div style={{ color:"var(--muted)", fontSize:11, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:6 }}>Patrimoine Net Total</div>
          <div style={{ color:"var(--gold)", fontSize: isMobile ? 26 : 34, fontWeight:900, lineHeight:1, letterSpacing:"-0.02em", textShadow:"0 0 30px rgba(201,168,76,0.5)" }}>
            {fmt(patrimoineNet)} <span style={{ fontSize:"0.45em", fontWeight:600, opacity:0.7 }}>FCFA</span>
          </div>
          <div style={{ display:"flex", justifyContent:"center", gap:16, marginTop:10, paddingTop:10, borderTop:"1px solid rgba(201,168,76,0.12)" }}>
            {[{l:"Actifs",v:totalActifs,c:"#C9A84C"},{l:"Épargne",v:epargneObj,c:"#3B82F6"},{l:"Plus-value",v:plusValue,c:plusValue>=0?"#10B981":"#EF4444"},{l:"Solde",v:solde,c:"var(--gold)"}].map(s=>(
              <div key={s.l} style={{ textAlign:"center" }}>
                <div style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.08em" }}>{s.l}</div>
                <div style={{ fontSize:12, fontWeight:700, color:s.c, fontFamily:"Space Mono,monospace" }}>{fmt(s.v)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* 4 KPI cards interactives */}
      <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4,1fr)", gap: isMobile ? 10 : 14, marginBottom:16, marginTop: isMobile ? 14 : 20 }}>
        {kpis.map((k,i) => {
          const isH = hovKpi === k.id;
          return (
            <div key={k.id}
              onMouseEnter={()=>setHovKpi(k.id)}
              onMouseLeave={()=>setHovKpi(null)}
              style={{
                borderRadius:12, padding:"14px 12px",
                background: isH ? `rgba(11,22,40,0.95)` : "var(--card)",
                border: `1px solid ${isH ? k.color+"66" : "var(--border)"}`,
                boxShadow: isH ? `0 4px 24px ${k.color}22, 0 0 0 1px ${k.color}33` : "none",
                transform: mounted ? (isH ? "translateY(-3px)" : "translateY(0)") : "translateY(12px)",
                opacity: mounted ? 1 : 0,
                transition:`transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, opacity 0.4s ease ${i*0.07}s`,
                cursor:"default",
              }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 }}>
                <span style={{ fontSize:18 }}>{k.icon}</span>
                <div style={{ width:28, height:28, borderRadius:8, background:`${k.color}18`, border:`1px solid ${k.color}33`, display:"flex", alignItems:"center", justifyContent:"center" }}>

                  <div style={{ height:"100%", width:"100%", background:`linear-gradient(90deg,${k.color},${k.color}88)`, borderRadius:99 }} />

              )}
            </div>
          );

      </div>

      {/* Score santé — interactif */}
      {(() => {
        const scoreLabel = score >= 75 ? "Excellent" : score >= 50 ? "Solide" : score >= 25 ? "Fragile" : "Critique";
        const scoreSub   = score >= 75 ? "Votre patrimoine est bien structuré 🎉" : score >= 50 ? "Quelques points à améliorer" : score >= 25 ? "Attention, des risques existent" : "Votre patrimoine est vulnérable";

        const critereDetails = [
          {
            label: "Urgence ≥ 3 mois de dépenses", ok: urgenceOk,
            icon: "🛡️",
            valActuelle: `${fmt(fondsUrgence)} FCFA constitués`,
            valCible:    `Objectif : ${fmt(depMois * 3)} FCFA (3 × dépenses mensuelles)`,
            conseil:     urgenceOk
              ? "Fonds d'urgence atteint — vous êtes protégé en cas d'imprévu."
              : `Il vous manque ${fmt(Math.max(0, depMois*3 - fondsUrgence))} FCFA. Alimentez le compte Épargne urgence en priorité.`,
          },
          {
            label: "3+ types d'actifs différents", ok: types3,
            icon: "🎲",
            valActuelle: `${new Set(data.patrimoine.map(p=>p.type)).size} type(s) détecté(s)`,
            valCible:    "Objectif : 3 types ou plus (ex: épargne + BRVM + terrain)",
            conseil:     types3
              ? "Bonne diversification — le risque est réparti entre plusieurs actifs."
              : "Diversifiez : ajoutez un FCP, des actions BRVM ou un terrain pour atteindre 3 types.",
          },
          {
            label: "Liquidité entre 30% et 80%", ok: liquidOk,
            icon: "💧",
            valActuelle: `${liquidRatio.toFixed(0)}% liquide (${fmt(liquid)} FCFA)`,
            valCible:    "Zone idéale : 30% à 80% d'actifs liquides",
            conseil:     liquidOk
              ? "Bonne balance liquide/illiquide — vous pouvez répondre aux urgences sans tout vendre."
              : liquidRatio < 30
                ? "Trop d'actifs immobilisés. Renforcez épargne urgence ou FCP pour améliorer l'accès rapide."
                : "Trop de liquidités. Investissez le surplus en BRVM, terrain ou FCP pour faire travailler votre argent.",
          },
          {
            label: "Plus-value positive", ok: plusOk,
            icon: "📈",
            valActuelle: `${plusValue >= 0 ? "+" : ""}${fmt(plusValue)} FCFA de plus-value`,
            valCible:    "Objectif : valeur actuelle > valeur d'achat",
            conseil:     plusOk
              ? "Vos actifs s'apprécient — continuez à réévaluer régulièrement leurs valeurs actuelles."
              : "Certains actifs ont perdu de la valeur. Mettez à jour les valorisations ou arbitrez les moins performants.",
          },
        ];

        return (
          <ScoreSante
            score={score} scoreColor={scoreColor} scoreLabel={scoreLabel} scoreSub={scoreSub}
            criteres={critereDetails} circ={circ} offset={offset} r={r} isMobile={isMobile}

      {/* Répartition des actifs — Liquide vs Illiquide */}
      {pieData.length > 0 && (
        <div style={G.card}>
          <SectionHeader title="Répartition des actifs" color="var(--gold)" />
          {(() => {
            const illiquid = totalActifs - liquid;
            const liqPct  = totalActifs > 0 ? Math.round((liquid  / totalActifs) * 100) : 0;
            const illPct  = totalActifs > 0 ? Math.round((illiquid / totalActifs) * 100) : 0;

            const liqTypes  = ASSET_TYPES.filter(t => t.liquid);
            const illTypes  = ASSET_TYPES.filter(t => !t.liquid);

            const typeVal = (id) => data.patrimoine.filter(p=>p.type===id).reduce((a,p)=>a+p.valeurActuelle,0);

            const ColItem = ({ t, total, color }) => {
              const v = typeVal(t.id);
              if (!v) return null;
              const pct = total > 0 ? Math.round((v/total)*100) : 0;
              return (
                <div style={{ marginBottom: 8 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:3 }}>
                    <span style={{ fontSize: isMobile?10:11, color:"var(--text)", display:"flex", alignItems:"center", gap:4 }}>
                      <span>{t.icon}</span>
                      <span>{t.label}</span>
                    </span>
                    <span className="mono" style={{ fontSize: isMobile?9:10, color, fontWeight:700 }}>{pct}%</span>
                  </div>
                  <div style={{ height:3, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                    <div className="pb-fill" style={{ height:"100%", width:pct+"%", background:color, borderRadius:99 }} />
                  </div>
                  <div style={{ fontSize: isMobile?9:10, color:"var(--muted)", marginTop:1, fontFamily:"Space Mono,monospace" }}>{fmt(v)}</div>
                </div>
              );
            };

            return (
              <>
                {/* Barre de répartition globale */}
                <div style={{ marginBottom:16 }}>
                  <div style={{ display:"flex", height: isMobile?10:12, borderRadius:99, overflow:"hidden", marginBottom:6 }}>
                    <div style={{ width:liqPct+"%", background:"#06B6D4", transition:"width 1s ease" }} />
                    <div style={{ width:illPct+"%", background:"#8B5CF6", transition:"width 1s ease" }} />
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between" }}>
                    <span style={{ fontSize:11, color:"#06B6D4", fontWeight:600, fontFamily:"Space Mono,monospace" }}>💧 {liqPct}% liquide</span>
                    <span style={{ fontSize:11, color:"#8B5CF6", fontWeight:600, fontFamily:"Space Mono,monospace" }}>{illPct}% illiquide 🏔️</span>
                  </div>
                </div>

                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap: isMobile?12:20 }}>

                      <span className="mono" style={{ fontSize: isMobile?11:13, color:"#06B6D4", fontWeight:800 }}>{fmt(liquid)}</span>
                    </div>
                    {liqTypes.map(t => <ColItem key={t.id} t={t} total={liquid} color="#06B6D4" />)}

                  </div>

                  {/* Colonne illiquide */}
                  <div>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10, paddingBottom:6, borderBottom:"1px solid rgba(139,92,246,0.2)" }}>
                      <span style={{ fontSize:11, color:"#8B5CF6", fontWeight:700, letterSpacing:"0.06em", textTransform:"uppercase" }}>🏔️ Illiquide</span>
                      <span className="mono" style={{ fontSize: isMobile?11:13, color:"#8B5CF6", fontWeight:800 }}>{fmt(illiquid)}</span>
                    </div>
                    {illTypes.map(t => <ColItem key={t.id} t={t} total={illiquid} color="#8B5CF6" />)}

                      ? "⚠️ Liquidité trop faible — moins de 30% d'actifs accessibles rapidement."

                  </div>
                )}
              </>
            );
          })()}
        </div>

          const pct = totalActifs > 0 ? (val/totalActifs)*100 : 0;
          const isH = hovBar === t.id;
          return (
            <div key={t.id}
              onMouseEnter={()=>setHovBar(t.id)}
              onMouseLeave={()=>setHovBar(null)}
              style={{ marginBottom:10, padding:"8px 10px", borderRadius:8, transition:"background 0.2s",
                background: isH ? `${COLORS[i]}0d` : "transparent",
                border: `1px solid ${isH ? COLORS[i]+"33" : "transparent"}`,
                cursor:"default" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
                <span style={{ fontSize:12, color:"var(--text)", fontWeight: isH ? 700 : 500, transition:"font-weight 0.15s" }}>{t.icon} {t.label}</span>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:10, color:COLORS[i], fontWeight:700, fontFamily:"Space Mono,monospace", opacity: isH ? 1 : 0.7, transition:"opacity 0.2s" }}>{pct.toFixed(1)}%</span>
                  <span style={{ fontSize:11, color:"var(--muted)", fontFamily:"Space Mono,monospace" }}>{fmt(val)}</span>
                </div>
              </div>
              <div style={{ height: isH ? 6 : 4, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden", transition:"height 0.2s" }}>
                <div className="pb-fill" style={{ height:"100%", width:`${pct}%`, background: isH ? `linear-gradient(90deg,${COLORS[i]},${COLORS[i]}cc)` : COLORS[i], borderRadius:99, boxShadow: isH ? `0 0 8px ${COLORS[i]}88` : "none", transition:"box-shadow 0.2s" }} />
              </div>
            </div>
          );
        })}
      </div>

      {/* ── ACTIFS : formulaire + liste interactive ── */}
      {(() => {
        const [expandedActif, setExpandedActif] = React.useState(null);
        const [confirmSuppr, setConfirmSuppr]   = React.useState(null);

        // Grouper par type
        const grouped = ASSET_TYPES.map(t => ({
          type: t,
          actifs: data.patrimoine.filter(p => p.type === t.id),
        })).filter(g => g.actifs.length > 0);

        return (
          <>
            {/* Bouton ajouter */}
            <button
              onClick={() => setShowForm(!showForm)}
              style={{
                width:"100%", marginTop:16, borderRadius:10, padding:"13px 16px",
                border:`1px solid ${showForm ? "rgba(239,68,68,0.4)" : "rgba(123,95,255,0.4)"}`,
                background: showForm ? "rgba(239,68,68,0.08)" : "rgba(123,95,255,0.08)",
                color: showForm ? "#EF4444" : "var(--accent)",
                fontWeight:700, fontSize:13, cursor:"pointer", letterSpacing:"0.06em",
                fontFamily:"'Space Grotesk',sans-serif", transition:"all 0.25s ease",
                boxShadow: showForm ? "0 0 16px rgba(239,68,68,0.15)" : "0 0 16px rgba(123,95,255,0.12)",
              }}>
              {showForm ? "✕ Fermer le formulaire" : "+ Enregistrer un actif manuel"}
            </button>

            {/* Formulaire */}
            {showForm && (
              <div style={{ ...G.card, marginTop:10, border:"1px solid rgba(123,95,255,0.3)" }}>
                <SectionHeader title="Enregistrer un actif" color="var(--accent)" />
                <label style={G.label}>Type d'actif</label>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12 }}>
                  {ASSET_TYPES.map(t => (
                    <button key={t.id} onClick={() => setAType(t.id)} style={{
                      background: aType===t.id ? "rgba(123,95,255,0.2)" : "var(--surface)",
                      border: `1px solid ${aType===t.id ? "var(--accent)" : "var(--border)"}`,
                      borderRadius:6, padding:"6px 10px", cursor:"pointer",
                      color: aType===t.id ? "var(--accent)" : "var(--text)", fontSize:12,
                      fontFamily:"'Space Grotesk',sans-serif", fontWeight: aType===t.id ? 700 : 400,
                    }}>{t.icon} {t.label}</button>
                  ))}
                </div>
                <label style={G.label}>Nom</label>
                <input style={{ ...G.input, marginBottom:10 }} value={aNom} onChange={e=>setANom(e.target.value)} placeholder="Ex: Terrain Bingerville, BTC…" />
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }}>
                  <div>
                    <label style={G.label}>Valeur d'achat (optionnel)</label>
                    <input style={G.input} type="number" value={aValAchat} onChange={e=>setAValAchat(e.target.value)} placeholder="Laissez vide si inconnue" />
                  </div>
                  <div>
                    <label style={G.label}>Valeur actuelle (FCFA)</label>
                    <input style={G.input} type="number" value={aValActuelle} onChange={e=>setAValActuelle(e.target.value)} placeholder="Ex: 5 000 000" />
                  </div>
                </div>
                <div style={{ display:"flex", gap:10 }}>
                  <button style={{ ...G.btn("var(--surface)"), flex:1 }} onClick={()=>setShowForm(false)}>Annuler</button>
                  <button style={{ ...G.btn(), flex:2 }} onClick={ajouterActif}>Enregistrer ✓</button>
                </div>
              </div>
            )}

            {/* Liste groupée */}
            <div style={{ marginTop:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                <span style={{ fontSize:13, fontWeight:700, color:"var(--gold)", letterSpacing:"0.04em", textTransform:"uppercase" }}>
                  Actifs ({data.patrimoine.length})
                </span>
                <span className="mono" style={{ fontSize:12, color:"var(--cyan)" }}>{fmt(totalActifs)} FCFA</span>
              </div>

              {data.patrimoine.length === 0 && (
                <div style={{ ...G.card, textAlign:"center", padding:32 }}>
                  <div style={{ fontSize:32, marginBottom:8 }}>💎</div>
                  <div style={{ fontSize:13, color:"var(--muted)" }}>Aucun actif enregistré.</div>
                  <div style={{ fontSize:11, color:"var(--muted)", marginTop:4 }}>Investissez depuis l'onglet Investir ou ajoutez un actif manuel ci-dessus.</div>

              {grouped.map(({ type: t, actifs }) => {
                const groupTotal = actifs.reduce((a,p)=>a+p.valeurActuelle,0);
                const groupPct   = totalActifs > 0 ? Math.round((groupTotal/totalActifs)*100) : 0;
                return (
                  <div key={t.id} style={{ marginBottom:16, animation:"fadeIn 0.35s ease both" }}>
                    {/* En-tête groupe */}
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, paddingBottom:8, borderBottom:"1px solid rgba(0,200,255,0.1)" }}>
                      <div style={{ width:30, height:30, borderRadius:8, background:`rgba(201,168,76,0.1)`, border:"1px solid rgba(201,168,76,0.2)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15 }}>{t.icon}</div>
                      <span style={{ fontSize:12, fontWeight:700, color:"var(--text)", flex:1, textTransform:"uppercase", letterSpacing:"0.06em" }}>{t.label}</span>
                      <div style={{ textAlign:"right" }}>
                        <div style={{ fontSize:9, color:"var(--muted)", fontFamily:"Space Mono,monospace" }}>{groupPct}%</div>
                        <div style={{ fontSize:12, color:"var(--gold)", fontWeight:800, fontFamily:"Space Mono,monospace" }}>{fmt(groupTotal)}</div>
                      </div>
                    </div>

                    {/* Actifs du groupe */}
                    {actifs.map(actif => {
                      const pv        = actif.valeurActuelle - actif.valeurInitiale;
                      const pvPct     = actif.valeurInitiale > 0 ? ((pv/actif.valeurInitiale)*100).toFixed(1) : null;
                      const pvColor   = pv >= 0 ? "var(--green)" : "var(--red)";
                      const pvIcon    = pv >= 0 ? "▲" : "▼";
                      const isOpen    = expandedActif === actif.id;
                      const isConfirm = confirmSuppr === actif.id;
                      const pctPortefeuille = totalActifs > 0 ? Math.round((actif.valeurActuelle/totalActifs)*100) : 0;

                      const isHov = hovActif === actif.id;
                      const pvGlow = pv>0?"#10B981":pv<0?"#EF4444":"#06B6D4";
                      return (
                        <div key={actif.id}
                          onMouseEnter={()=>setHovActif(actif.id)}
                          onMouseLeave={()=>setHovActif(null)}
                          style={{
                          borderRadius:10, marginBottom:8, overflow:"hidden",
                          border:`1px solid ${isOpen ? "rgba(0,200,255,0.3)" : isHov ? "rgba(0,200,255,0.18)" : "rgba(0,200,255,0.07)"}`,
                          background: isOpen ? "rgba(11,22,40,0.95)" : isHov ? "rgba(11,22,40,0.75)" : "rgba(11,22,40,0.45)",
                          boxShadow: isHov && !isOpen ? `0 4px 20px ${pvGlow}18` : isOpen ? `0 6px 28px rgba(0,200,255,0.1)` : "none",
                          transform: isHov ? "translateX(3px)" : "translateX(0)",
                          transition:"border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.2s",
                        }}>
                          {/* Ligne principale — cliquable */}
                          <div onClick={()=>setExpandedActif(isOpen ? null : actif.id)}
                            style={{ padding:"12px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:12 }}>
                            {/* Indicateur plus-value — glow au hover */}
                            <div style={{ width:4, alignSelf:"stretch", borderRadius:2, background: pv>=0 ? "var(--green)" : pv===0 ? "var(--muted)" : "var(--red)", flexShrink:0, boxShadow: isHov ? `0 0 8px ${pvGlow}` : "none", transition:"box-shadow 0.25s" }} />
                            <div style={{ flex:1, minWidth:0 }}>
                              <div style={{ fontWeight:700, color:"var(--text)", fontSize:isMobile?13:14, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                                {actif.nom}
                              </div>
                              <div style={{ fontSize:10, color:"var(--muted)", marginTop:2, display:"flex", alignItems:"center", gap:6 }}>
                                <span style={{ background: actif.source==="app" ? "rgba(0,200,255,0.12)" : "rgba(123,95,255,0.12)", color: actif.source==="app" ? "var(--cyan)" : "var(--accent)", padding:"1px 6px", borderRadius:3, fontSize:9, fontWeight:700 }}>
                                  {actif.source==="app" ? "APP" : "MANUEL"}
                                </span>
                                <span>{actif.dateAchat}</span>
                              </div>
                            </div>
                            <div style={{ textAlign:"right", flexShrink:0 }}>
                              <div className="mono" style={{ fontWeight:700, color:"var(--gold)", fontSize:isMobile?12:14 }}>{fmt(actif.valeurActuelle)}</div>
                              {pvPct !== null && (
                                <div style={{ fontSize:10, color:pvColor, fontWeight:600 }}>
                                  {pvIcon} {pvPct}%
                                </div>
                              )}
                            </div>
                            <span style={{ color:"var(--muted)", fontSize:10, flexShrink:0 }}>{isOpen?"▲":"▼"}</span>
                          </div>

                          {/* Détail expandable */}
                          {isOpen && (
                            <div style={{ padding:"0 14px 14px", borderTop:"1px solid rgba(0,200,255,0.08)" }}
                              onClick={e=>e.stopPropagation()}>

                              {/* Stats grid */}
                              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, margin:"12px 0" }}>
                                <div style={{ background:"rgba(0,200,255,0.04)", borderRadius:6, padding:"8px 10px", textAlign:"center" }}>
                                  <div style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:3 }}>Achat</div>
                                  <div className="mono" style={{ fontSize:11, color:"var(--text)", fontWeight:600 }}>
                                    {actif.valeurInitiale > 0 ? fmt(actif.valeurInitiale) : "—"}
                                  </div>
                                </div>
                                <div style={{ background:"rgba(0,200,255,0.04)", borderRadius:6, padding:"8px 10px", textAlign:"center" }}>
                                  <div style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:3 }}>Plus-value</div>
                                  <div className="mono" style={{ fontSize:11, color:pvColor, fontWeight:700 }}>
                                    {pv>=0?"+":""}{fmt(pv)}
                                  </div>
                                </div>
                                <div style={{ background:"rgba(0,200,255,0.04)", borderRadius:6, padding:"8px 10px", textAlign:"center" }}>
                                  <div style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:3 }}>Portefeuille</div>
                                  <div className="mono" style={{ fontSize:11, color:"var(--cyan)", fontWeight:700 }}>{pctPortefeuille}%</div>
                                </div>
                              </div>

                              {/* Barre de progression valeur */}
                              {actif.valeurInitiale > 0 && (
                                <div style={{ marginBottom:12 }}>
                                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--muted)", marginBottom:3 }}>
                                    <span>Valeur initiale</span>
                                    <span>Valeur actuelle</span>
                                  </div>
                                  <div style={{ height:4, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                                    <div className="pb-fill" style={{
                                      height:"100%",
                                      width: Math.min(100, (actif.valeurActuelle / Math.max(actif.valeurActuelle, actif.valeurInitiale)) * 100)+"%",
                                      background: pv>=0 ? "var(--green)" : "var(--red)",
                                      borderRadius:99,
                                    }}/>
                                  </div>
                                </div>
                              )}

                              {/* Mise à jour inline */}
                              {updateId === actif.id ? (
                                <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                                  <input style={{ ...G.input, flex:1, padding:"8px 12px", fontSize:13 }}
                                    type="number" value={updateVal} onChange={e=>setUpdateVal(e.target.value)}
                                    placeholder="Nouvelle valeur actuelle" autoFocus />
                                  <button onClick={()=>mettreAJour(actif.id)} style={{ ...G.btn("var(--green)"), padding:"8px 14px" }}>✓</button>
                                  <button onClick={()=>setUpdateId(null)} style={{ ...G.btn("var(--surface)"), padding:"8px 12px" }}>✗</button>
                                </div>
                              ) : (
                                <button onClick={()=>{ setUpdateId(actif.id); setUpdateVal(String(actif.valeurActuelle)); }}
                                  style={{ ...G.btn("var(--surface)"), width:"100%", marginBottom:8, fontSize:12 }}>
                                  ✏️ Mettre à jour la valeur
                                </button>
                              )}

                              {/* Suppression avec confirmation inline */}
                              {isConfirm ? (
                                <div style={{ background:"rgba(255,59,107,0.08)", border:"1px solid rgba(255,59,107,0.25)", borderRadius:6, padding:"10px 12px" }}>
                                  <div style={{ fontSize:12, color:"var(--text)", marginBottom:8 }}>
                                    {actif.source==="app"
                                      ? "⚠️ Cela annulera tous les investissements liés et restaurera le solde."
                                      : "Supprimer cet actif définitivement ?"}
                                  </div>
                                  <div style={{ display:"flex", gap:8 }}>
                                    <button onClick={()=>setConfirmSuppr(null)} style={{ ...G.btnSm("var(--surface)"), flex:1 }}>Annuler</button>
                                    <button onClick={()=>{ supprimerActif(actif); setConfirmSuppr(null); setExpandedActif(null); }}
                                      style={{ ...G.btnSm("var(--red)"), flex:1 }}>Oui, supprimer</button>
                                  </div>
                                </div>
                              ) : (
                                <button onClick={()=>setConfirmSuppr(actif.id)}
                                  style={{ ...G.btn("var(--red)"), width:"100%", fontSize:12, padding:"8px" }}>
                                  🗑 Supprimer l'actif
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </>
        );
      })()}
    </div>
  );
}

}
// ─── MODAL CHANGEMENT DE MOIS ────────────────────────────────────────────────────
function ModalNouveauMois({ moisPrecedent, moisCible, data, onChoix, onAnnuler }) {
  const prevPeriode = getPeriode(data, moisPrecedent);
  const soldePrev = getSolde(data, moisPrecedent);
  const hasRecurrents = prevPeriode.revenus.some(r => r.recurrent) || prevPeriode.depenses.some(d => d.recurrent);

  return (
    <Modal title={`Nouveau mois : ${moisLabel(moisCible)}`} onClose={onAnnuler}>
      <p style={{ color: "var(--muted)", fontSize: 13, marginBottom: 20 }}>
        Ce mois n'a pas encore de données. Comment souhaitez-vous commencer ?
      </p>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <button
          onClick={() => onChoix("recurrents")}
          style={{ ...G.btn("var(--surface)"), textAlign: "left", padding: 14 }}
          disabled={!hasRecurrents}
        >
          <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: 4 }}>
            🔄 Reporter les éléments récurrents
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)" }}>
            Copie les revenus/dépenses récurrents du mois précédent.
            {!hasRecurrents && " (Aucun élément récurrent disponible)"}
          </div>
        </button>
        <button
          onClick={() => onChoix("recurrents+solde")}
          style={{ ...G.btn("var(--surface)"), textAlign: "left", padding: 14 }}
          disabled={!hasRecurrents}
        >
          <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: 4 }}>
            💰 Reporter récurrents + solde restant
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)" }}>
            Idem + ajoute un revenu "Report solde {moisLabel(moisPrecedent)}" de {fmt(soldePrev)} FCFA.
            {!hasRecurrents && " (Aucun récurrent disponible)"}
          </div>
        </button>
        <button
          onClick={() => onChoix("zero")}
          style={{ ...G.btn("var(--gold)"), textAlign: "left", padding: 14 }}
        >
          <div style={{ fontWeight: 700, color: "#ffffff", marginBottom: 4 }}>
            ✨ Repartir de zéro
          </div>
          <div style={{ fontSize: 12, color: "rgba(255,255,255,0.8)" }}>
            Nouvelle période vierge sans données précédentes.
          </div>
        </button>
      </div>
    </Modal>
  );
}

// ─── APPLICATION PRINCIPALE ──────────────────────────────────────────────────────
function App() {
  const isMobile = useIsMobile();
  const [data, setDataRaw] = useState(() => loadData());
  const [appLoaded, setAppLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState(null); // null|"saving"|"ok"|"error"

  // Brancher callback global setSaveStatus
  useEffect(() => { _setSaveStatus = setSaveStatus; }, [setSaveStatus]);

  // Auto-reset du statut après 3s
  useEffect(() => {
    if (saveStatus === "ok" || saveStatus === "error") {
      const t = setTimeout(() => setSaveStatus(null), 3000);
      return () => clearTimeout(t);
    }
  }, [saveStatus]);

  const [authUser, setAuthUser] = useState(() => {
    try {
      const t = getToken();
      if (!t) return null;
      // Décoder le nom depuis le token (payload base64)
      const payload = JSON.parse(atob(t.split(".")[1]));
      if (payload.exp * 1000 < Date.now()) { clearToken(); return null; }
      return { email: payload.email, is_admin: !!payload.is_admin };
    } catch(_) { return null; }
  });

  // Brancher callback global setAuthUser (DOIT être après le useState ci-dessus)
  useEffect(() => { _setAuthUser = setAuthUser; }, [setAuthUser]);

  // Chargement des données depuis l'API au démarrage
  useEffect(() => {
    if (!authUser) { setAppLoaded(true); return; }
    loadDataFromAPI().then(d => {
      if (d === null) {
        // Token invalide ou expiré → forcer logout proprement
        setAuthUser(null);
        setAppLoaded(true);
        return;
      }
      setDataRaw(d);
      setAppLoaded(true);
    });
  }, [authUser]); // eslint-disable-line

  const handleLogout = () => {
    clearToken();
    setAuthUser(null);
    setDataRaw({ ...DEFAULT_STATE });
    setAppLoaded(true);
  };
  const [theme, setTheme] = useState("dark");
  const [activeTab, setActiveTab] = useState("accueil");
  const [pendingMois, setPendingMois] = useState(null);

  // Appliquer le thème initial
  useEffect(() => { applyTheme(theme); }, [theme]);

  // Sauvegarder à chaque changement
  const setData = useCallback((newData) => {
    setDataRaw(newData);
    saveData(newData);
  }, []);

  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    applyTheme(next);
  };

  const mois = data.moisActif || todayMois();

  // Navigation mois
  const naviguerMois = (newMois) => {
    if (data.periodes[newMois]) {
      setData({ ...data, moisActif: newMois });
    } else {
      setPendingMois(newMois);
    }
  };

  const handleChoixMois = (choix) => {
    const prevMois = mois;
    const prevPeriode = getPeriode(data, prevMois);
    let newPeriode = DEFAULT_PERIODE();

    if (choix === "recurrents" || choix === "recurrents+solde") {
      const revenus = prevPeriode.revenus
        .filter(r => r.recurrent)
        .map(r => ({ ...r, id: genId() }));
      const depenses = prevPeriode.depenses
        .filter(d => d.recurrent)
        .map(d => ({ ...d, id: genId() }));
      newPeriode = { ...newPeriode, revenus, depenses };

      if (choix === "recurrents+solde") {
        const soldePrev = getSolde(data, prevMois);
        const reportRevenu = { id: genId(), label: `Report solde ${moisLabel(prevMois)}`, montant: soldePrev, recurrent: false };
        newPeriode = { ...newPeriode, revenus: [reportRevenu, ...newPeriode.revenus] };
      }
    }

    setData({
      ...data,
      moisActif: pendingMois,
      periodes: { ...data.periodes, [pendingMois]: newPeriode },
    });
    setPendingMois(null);
  };

  // Écran auth si non connecté
  if (!authUser) {
    return <AuthScreen onAuth={(user) => { setAuthUser(user); setAppLoaded(false); }} />;
  }

  // Écran de chargement initial
  if (!appLoaded) {
    return (
      <>

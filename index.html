    /* ══════════════════════════════════════════════════════════
       FUTURISTIC THEME — Mon Patrimoine CI
       Design language: dark space · neon cyan · glass morphism
    ══════════════════════════════════════════════════════════ */
    :root {
      --bg:      #050913;
      --card:    #0B1628;
      --surface: #0F1E38;
      --border:  #1A3050;
      --text:    #D8E8FF;
      --muted:   #7BA8C8;
      --gold:    #00C8FF;   /* primary: electric cyan */
      --red:     #FF3B6B;
      --green:   #00E87A;
      --blue:    #4080FF;
      --accent:  #7B5FFF;   /* secondary: electric purple */
      --cream:   #1A2A4A;
      --cyan:    #00C8FF;
      --purple:  #7B5FFF;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      /* Subtle grid texture */
      background-image:
        linear-gradient(rgba(0,200,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      background-attachment: fixed;
    }

    /* ─── KEYFRAMES ──────────────────────────────────────────── */
    @keyframes fadeIn    { from{opacity:0;transform:translateY(8px)}   to{opacity:1;transform:translateY(0)} }
    @keyframes slideUp   { from{opacity:0;transform:translateY(22px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes scaleIn   { from{opacity:0;transform:scale(0.93)}       to{opacity:1;transform:scale(1)} }
    @keyframes numPop    { 0%{opacity:0;transform:translateY(8px) scale(0.9)} 60%{transform:translateY(-2px) scale(1.04)} 100%{opacity:1;transform:none} }
    @keyframes tabEnter  { from{opacity:0;transform:translateY(16px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes neonGlow  { 0%,100%{text-shadow:0 0 4px var(--cyan),0 0 10px rgba(0,200,255,0.3)} 50%{text-shadow:0 0 10px var(--cyan),0 0 28px rgba(0,200,255,0.55),0 0 50px rgba(0,200,255,0.2)} }
    @keyframes heroAura  { 0%,100%{box-shadow:0 0 60px rgba(0,200,255,0.06),inset 0 0 60px rgba(0,200,255,0.02)} 50%{box-shadow:0 0 80px rgba(0,200,255,0.12),inset 0 0 80px rgba(0,200,255,0.04)} }
    @keyframes scanLine  { 0%{transform:translateY(-100%);opacity:0} 8%{opacity:0.5} 92%{opacity:0.5} 100%{transform:translateY(100%);opacity:0} }
    @keyframes borderFlow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes hologram  { 0%,100%{opacity:1} 91%{opacity:1} 92%{opacity:0.3} 93%{opacity:1} 96%{opacity:0.6} 97%{opacity:1} }
    @keyframes shimmer   { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes pulse     { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes spinIn    { from{stroke-dashoffset:339.3} }

    /* ─── GLASS MORPHISM ─────────────────────────────────────── */
    .glass {
      background: rgba(11, 22, 40, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 200, 255, 0.1);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.22s ease;
    }
    .glass:hover {
      border-color: rgba(0, 200, 255, 0.22);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,255,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
      transform: translateY(-2px);
    }

    /* ─── BUTTONS ────────────────────────────────────────────── */
    button {
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.18s cubic-bezier(.4,0,.2,1);
      position: relative; overflow: hidden;
      cursor: pointer;
    }
    button:active { transform: scale(0.96) !important; }
    .btn-cyber {
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      border-radius: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0,200,255,0.15), inset 0 0 10px rgba(0,200,255,0.04);
    }
    .btn-cyber:hover {
      background: rgba(0,200,255,0.1);
      box-shadow: 0 0 20px rgba(0,200,255,0.35), inset 0 0 20px rgba(0,200,255,0.08);
    }
    .btn-cyber-solid {
      background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);
      border: none;
      color: #050913;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 20px rgba(0,200,255,0.3);
    }
    .btn-cyber-solid:hover {
      box-shadow: 0 6px 28px rgba(0,200,255,0.5);
      transform: translateY(-1px);
    }

    /* ─── NAV ────────────────────────────────────────────────── */
    .nav-tab {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 11px 16px;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, text-shadow 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    @media (max-width: 640px) {
      .nav-tab { padding: 10px 11px; font-size: 10px; letter-spacing: 0.04em; }
    }
    .nav-tab.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
      text-shadow: 0 0 10px rgba(0,200,255,0.6);
    }
    .nav-tab:hover:not(.active) { color: var(--text); }

    /* ─── PROGRESS BAR ───────────────────────────────────────── */
    .pb-fill { transition: width 1s cubic-bezier(.4,0,.2,1); }
    .pb-glow { box-shadow: 0 0 8px currentColor; }

    /* ─── ANIMATIONS UTILITAIRES ─────────────────────────────── */
    .num-anim  { animation: numPop 0.45s cubic-bezier(.4,0,.2,1) both; }
    .neon-text { animation: neonGlow 3s ease-in-out infinite; }
    .tab-content { animation: tabEnter 0.3s cubic-bezier(.4,0,.2,1) both; }
    /* Espacement vertical automatique entre toutes les sections */
    /* Gap entre sections de chaque onglet */
    .tab-content > div > * { margin-bottom: 0; }
    .tab-content > div {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    /* Grilles KPI — override pour rester en grid */
    .tab-content > div > .stagger,
    .tab-content > div > div[style*="grid"] {
      display: grid !important;
    }
    .stagger-1 { animation-delay: 0s !important; }
    .stagger-2 { animation-delay: 0.08s !important; }
    .stagger-3 { animation-delay: 0.16s !important; }
    .stagger-4 { animation-delay: 0.24s !important; }
    circle.score-ring { transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
    .shimmer-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      background-size: 200% 100%;
      animation: shimmer 2.5s ease-in-out infinite;
    }

    /* ─── TYPOGRAPHY ─────────────────────────────────────────── */
    .mono { font-family: 'Space Mono', 'Courier New', monospace; }
    .label-cyber {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8BBAD8;
    }

    /* ─── INPUTS ─────────────────────────────────────────────── */
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--cyan) !important;
      box-shadow: 0 0 0 1px rgba(0,200,255,0.3), 0 0 12px rgba(0,200,255,0.1) !important;
    }

    /* ─── SCROLLBAR ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width:4px; height:4px }
    ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.2); border-radius:99px }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,200,255,0.4); }

    input,button,select { font-family: 'Space Grotesk', sans-serif; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none }
    a { color: var(--cyan); }
    #root { min-height:100vh }

    /* ─── CARD SPACING ──────────────────────────────────────── */
    .tab-content > div > * + * { margin-top: 0; }

    /* ─── CARD HOVER LIFT ───────────────────────────────────── */
    .card-hover {
      transition: transform 0.22s cubic-bezier(.4,0,.2,1), box-shadow 0.22s cubic-bezier(.4,0,.2,1), border-color 0.22s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,255,0.15);
      border-color: rgba(0,200,255,0.28) !important;
    }

    /* ─── STAT ROW ───────────────────────────────────────────── */
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(0,200,255,0.06);
      transition: background 0.15s;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row:hover { background: rgba(0,200,255,0.03); border-radius: 4px; padding-left: 6px; }
    .stat-label { font-size: 13px; color: #B0CCE0; font-weight: 500; }
    .stat-value { font-size: 13px; color: #E8F4FF; font-weight: 600; }

    /* ─── GLOW BADGE ─────────────────────────────────────────── */
    .badge-ok   { background:rgba(0,232,122,0.12); color:#00E87A; border:1px solid rgba(0,232,122,0.25); border-radius:4px; padding:2px 8px; font-size:10px; font-weight:600; letter-spacing:0.08em; }
    .badge-warn { background:rgba(245,166,35,0.12); color:#F5A623; border:1px solid rgba(245,166,35,0.25); border-radius:4px; padding:2px 8px; font-size:10px; font-weight:600; letter-spacing:0.08em; }
    .badge-err  { background:rgba(255,59,107,0.12); color:#FF3B6B; border:1px solid rgba(255,59,107,0.25); border-radius:4px; padding:2px 8px; font-size:10px; font-weight:600; letter-spacing:0.08em; }

    /* ─── CHART CONTAINER ───────────────────────────────────── */
    .chart-wrap { padding: 8px 0; }

    /* ─── STAGGER extra steps ───────────────────────────────── */
    .stagger-5 { animation-delay: 0.32s !important; }
    .stagger-6 { animation-delay: 0.40s !important; }

    /* ─── FLIP HOVER ON KPI ──────────────────────────────────── */
    @keyframes cardReveal { from{opacity:0;transform:translateY(14px) scale(0.97)} to{opacity:1;transform:none} }
    .kpi-reveal { animation: cardReveal 0.4s cubic-bezier(.4,0,.2,1) both; }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    input, select, textarea { font-size: 16px !important; }
    @media (max-width: 640px) {
      body { font-size: 14px; background-size: 32px 32px; }
      input, select, textarea { padding: 9px 10px !important; }
      .rw .dl { opacity: 1 !important; }
      ::-webkit-scrollbar { display: none; }
      .modal-overlay { align-items: flex-end !important; padding: 0 !important; }
      .modal-box {
        border-radius: 16px 16px 0 0 !important;
        max-height: 92vh !important;
        padding: 20px 16px !important;
        width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>

const fmt = (n) => {
  if (n === undefined || n === null || isNaN(n)) return "0";
  return new Intl.NumberFormat("fr-FR").format(Math.round(n));
};

const moisLabel = (m) => {
  const [y, mo] = m.split("-");
  const noms = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
  return noms[parseInt(mo) - 1] + " " + y;
};

  const [y, mo] = m.split("-").map(Number);
  if (mo === 1) return `${y - 1}-12`;
  return `${y}-${String(mo - 1).padStart(2, "0")}`;
};

  if (mo === 12) return `${y + 1}-01`;
  return `${y}-${String(mo + 1).padStart(2, "0")}`;
};

// ─── Auth & API ──────────────────────────────────────────────────────────────
const API_BASE = "";

const TOKEN_KEY = "patrimoine_token";
function getToken() {
  try {
    return localStorage.getItem(TOKEN_KEY)
        || sessionStorage.getItem(TOKEN_KEY)
        || (window._patrimoineToken || "");
  } catch(_) {
    return window._patrimoineToken || "";
  }
}
function setToken(t) {
  window._patrimoineToken = t; // fallback mémoire toujours disponible
  try { localStorage.setItem(TOKEN_KEY, t); } catch(_){}
  try { sessionStorage.setItem(TOKEN_KEY, t); } catch(_){}
}
function clearToken() {
  window._patrimoineToken = "";
  try { localStorage.removeItem(TOKEN_KEY); } catch(_){}
  try { sessionStorage.removeItem(TOKEN_KEY); } catch(_){}
}
function authHeaders() {
  return { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() };
}

async function apiPost(path, body) {
  const r = await fetch(API_BASE + path, {
    method: "POST", headers: authHeaders(), body: JSON.stringify(body),
  });
  return r;
}

async function loadDataFromAPI() {
  const token = getToken();
  if (!token) return { ...DEFAULT_STATE };
  try {
    const r = await fetch(API_BASE + "/api/load", { headers: authHeaders() });
    if (r.status === 401) { clearToken(); return null; }  // null = forcer logout
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    // Si les données existent et ont un profil configuré → utiliser telles quelles
    if (d && d.profil && d.profil.configured) {
      return { ...DEFAULT_STATE, ...d };
    }
    // Données partielles ou vides → fusionner avec DEFAULT_STATE
    return { ...DEFAULT_STATE, ...(d || {}) };
  } catch (e) {
    console.warn("Erreur chargement:", e.message);
  }
  return { ...DEFAULT_STATE };
}

// Callbacks globaux injectés par App
let _setSaveStatus = null;
let _setAuthUser = null;

async function saveDataAsync(data) {
  const token = getToken();
  if (!token) return;
  try {
    const r = await fetch(API_BASE + "/api/save", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify(data),
    });
    if (r.status === 401) {
      clearToken();
      if (_setAuthUser) _setAuthUser(null);
      if (_setSaveStatus) _setSaveStatus("error");
      return false;
    }
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      console.error("❌ Sauvegarde échouée:", r.status, err);
      if (_setSaveStatus) _setSaveStatus("error");
      return false;
    }
    if (_setSaveStatus) _setSaveStatus("ok");
    return true;
  } catch (e) {
    console.error("❌ Erreur réseau sauvegarde:", e.message);
    if (_setSaveStatus) _setSaveStatus("error");
    return false;
  }
}

function saveData(data) {
  if (_setSaveStatus) _setSaveStatus("saving");
  saveDataAsync(data);
}

function loadData() { return { ...DEFAULT_STATE }; }

function getPeriode(data, mois) {
  return data.periodes[mois] || DEFAULT_PERIODE();
}

function getSolde(data, mois) {
  const p = getPeriode(data, mois);
  const rev = p.revenus.reduce((a, r) => a + (r.montant || 0), 0);
  const dep = p.depenses.reduce((a, d) => a + (d.montant || 0), 0);
  return rev - dep - (p.allocations || 0);
}

function getTotalInvesti(data) {
  return data.transactions
    .filter(t => t.type === "investissement")
    .reduce((a, t) => a + t.montant, 0);
}

function getPatrimoineNet(data, moisActif) {
  const actifs = data.patrimoine.reduce((a, p) => a + (p.valeurActuelle || 0), 0);
  const epargneObj = data.objectifs.reduce((a, o) => a + (o.epargne || 0), 0);
  const solde = getSolde(data, moisActif);
  return actifs + epargneObj + solde;
}

// ─── ANIMATIONS HOOKS ────────────────────────────────────────────────────────────
function useCountUp(target, duration = 900) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!target || isNaN(target)) { setVal(target || 0); return; }
    const absTarget = Math.abs(target);
    const sign = target < 0 ? -1 : 1;
    const start = performance.now();
    let raf;
    const step = (now) => {
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setVal(sign * Math.round(eased * absTarget));
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

// Clé unique pour déclencher l'animation num à chaque changement de valeur
let _numAnimKey = 0;
function AnimatedNum({ value, style, className = "" }) {
  const [key, setKey] = useState(0);
  const animated = useCountUp(value);
  useEffect(() => { setKey(k => k + 1); }, [value]);
  return <span key={key} className={"num-anim " + className} style={style}>{fmt(animated)}</span>;
}

const MobileContext = React.createContext(false);
function useMobile() { return React.useContext(MobileContext); }
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => window.innerWidth < 640);
  useEffect(() => {
    const fn = () => setIsMobile(window.innerWidth < 640);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return isMobile;
}

function ProgressBar({ value, max, color = "var(--gold)", height = 6 }) {
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 80); return () => clearTimeout(t); }, []);
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  return (
    <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: 2, height, overflow: "hidden", position:"relative" }}>
      <div className="pb-fill" style={{
        width: ready ? `${pct}%` : "0%", height: "100%",
        background: `linear-gradient(90deg, ${color}, ${color}99)`,
        borderRadius: 2,

        method: "POST",

function TabAccueil({ data, mois }) {
  const isMobile = useMobile();
  const [hoveredKpi, setHoveredKpi] = React.useState(null);
  const [tipIdx, setTipIdx] = React.useState(() => {
    const today = new Date(); return (today.getDate() * 31 + today.getMonth()) % TIPS.length;
  });
  const [tipFade, setTipFade] = React.useState(true);
  const [tipProgress, setTipProgress] = React.useState(0);
  const [tipPaused, setTipPaused] = React.useState(false);
  const TIP_DURATION = 6000; // ms par conseil

  const changeTip = React.useCallback((dir) => {
    setTipFade(false);
    setTipProgress(0);
    setTimeout(() => {
      setTipIdx(i => (i + dir + TIPS.length) % TIPS.length);
      setTipFade(true);
    }, 280);
  }, []);

  // Auto-rotate
  React.useEffect(() => {
    if (tipPaused) return;
    const step = 50;
    const inc = (step / TIP_DURATION) * 100;
    const interval = setInterval(() => {
      setTipProgress(p => {
        if (p >= 100) { changeTip(1); return 0; }
        return p + inc;
      });
    }, step);
    return () => clearInterval(interval);
  }, [tipPaused, changeTip]);

  const periode = getPeriode(data, mois);
  const revenus = periode.revenus.reduce((a, r) => a + r.montant, 0);
  const depenses = periode.depenses.reduce((a, d) => a + d.montant, 0);
  const solde = getSolde(data, mois);
  const soldePos = solde >= 0;
  const soldeCouleur = soldePos ? "#10B981" : "#EF4444";
  const patrimoineNet = getPatrimoineNet(data, mois);

  const investiMois = data.transactions
    .filter(t => t.mois === mois && t.type === "investissement")
    .reduce((a, t) => a + t.montant, 0);

  const besoins = periode.depenses.filter(d => ["loyer","electricite","eau","gaz","transport","sante","internet","credit","assurance"].includes(d.categorie)).reduce((a,d)=>a+d.montant,0);
  const envies  = periode.depenses.filter(d => ["loisirs","famille","abonnements","shopping","education","alimentation"].includes(d.categorie)).reduce((a,d)=>a+d.montant,0);
  const epargneTotal = investiMois + data.transactions.filter(t=>t.mois===mois&&t.type==="objectif").reduce((a,t)=>a+t.montant,0);

  const pctBesoins = revenus > 0 ? (besoins / revenus) * 100 : 0;
  const pctEnvies  = revenus > 0 ? (envies  / revenus) * 100 : 0;
  const pctEpargne = revenus > 0 ? (epargneTotal / revenus) * 100 : 0;
  const pctDep     = revenus > 0 ? Math.min(100, (depenses / revenus) * 100) : 0;

  const nextTip = () => changeTip(1);
  const prevTip = () => changeTip(-1);

  const kpis = [
    { id:"rev",  label:"Revenus",    value:revenus,    icon:"💵", color:"#10B981", bg:"rgba(16,185,129,0.1)",  border:"rgba(16,185,129,0.25)",  pct: 100,           sub:"FCFA ce mois" },
    { id:"dep",  label:"Dépenses",   value:depenses,   icon:"💸", color:"#EF4444", bg:"rgba(239,68,68,0.1)",   border:"rgba(239,68,68,0.25)",   pct: pctDep,        sub:`${pctDep.toFixed(0)}% des revenus` },
    { id:"inv",  label:"Investi",    value:investiMois,icon:"📈", color:"#3B82F6", bg:"rgba(59,130,246,0.1)",  border:"rgba(59,130,246,0.25)",  pct: revenus>0?Math.min(100,(investiMois/revenus)*100):0, sub:"ce mois" },
    { id:"sol",  label:"Solde dispo",value:solde,      icon:"💰", color:soldeCouleur, bg:soldePos?"rgba(16,185,129,0.08)":"rgba(239,68,68,0.08)", border:soldePos?"rgba(16,185,129,0.25)":"rgba(239,68,68,0.25)", pct:revenus>0?Math.min(100,Math.abs(solde/revenus)*100):0, sub:"disponible" },
  ];

  const regle503020 = [
    { label:"Besoins", icon:"🏠", emoji:"🏠", pct:pctBesoins, limit:50, op:"≤", color:"#06B6D4",  ok: pctBesoins <= 50,  desc:"Loyer, transport, santé…" },
    { label:"Envies",  icon:"🎮", emoji:"🎮", pct:pctEnvies,  limit:30, op:"≤", color:"#8B5CF6",  ok: pctEnvies  <= 30,  desc:"Loisirs, shopping, famille…" },
    { label:"Épargne", icon:"💰", emoji:"💰", pct:pctEpargne, limit:20, op:"≥", color:"#10B981",  ok: pctEpargne >= 20,  desc:"Investissements, objectifs…" },
  ];

  return (
    <div>
      {/* ── HERO NET WORTH ── */}
      <div style={{
        background: "linear-gradient(135deg, #0A1628 0%, #050913 55%, #0A0520 100%)",
        borderRadius: 14, padding: isMobile ? "24px 18px 20px" : "36px 32px 28px",
        marginBottom: 16, position: "relative", overflow: "hidden",
        border: "1px solid rgba(0,200,255,0.12)",
        animation: "heroAura 5s ease-in-out infinite, scaleIn 0.4s ease both",
        boxShadow: "0 0 60px rgba(0,200,255,0.06), inset 0 1px 0 rgba(255,255,255,0.04)",
      }}>
        <div style={{ position:"absolute", inset:0, backgroundImage:"linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.04) 1px, transparent 1px)", backgroundSize:"40px 40px", pointerEvents:"none" }} />
        <div style={{ position:"absolute", right:-60, top:-60, width:240, height:240, borderRadius:"50%", background:"radial-gradient(circle, rgba(0,200,255,0.1), transparent 65%)", pointerEvents:"none" }} />
        <div style={{ position:"absolute", left:-40, bottom:-40, width:180, height:180, borderRadius:"50%", background:"radial-gradient(circle, rgba(123,95,255,0.08), transparent 65%)", pointerEvents:"none" }} />
        <div style={{ position:"absolute", left:0, right:0, height:1, background:"linear-gradient(90deg,transparent,rgba(0,200,255,0.5),transparent)", animation:"scanLine 4s linear infinite", pointerEvents:"none" }} />
        <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:"linear-gradient(90deg, transparent, var(--cyan), var(--accent), transparent)" }} />

        <div style={{ position:"relative", zIndex:1 }}>
          <div className="mono" style={{ color:"var(--muted)", fontSize:isMobile?9:10, letterSpacing:"0.18em", textTransform:"uppercase", marginBottom:14 }}>
            {"// NET WORTH · PATRIMOINE"}
          </div>
          <div className="neon-text" style={{ display:"flex", alignItems:"baseline", gap:isMobile?6:10, marginBottom:10 }}>
            <AnimatedNum value={patrimoineNet} style={{ color:"var(--cyan)", fontSize:isMobile?34:56, fontWeight:700, lineHeight:1, letterSpacing:"-2px", fontFamily:"'Space Mono',monospace" }} />
            <span className="mono" style={{ color:"var(--muted)", fontSize:isMobile?14:20, fontWeight:400 }}>FCFA</span>
          </div>
          {/* Barre répartition patrimoine */}
          {patrimoineNet > 0 && (() => {
            const actifs = data.patrimoine.reduce((a,p)=>a+p.valeurActuelle,0);
            const objEp  = data.objectifs.reduce((a,o)=>a+o.epargne,0);
            const liq    = Math.max(0, solde);
            const total  = actifs + objEp + liq || 1;
            return (
              <div style={{ marginBottom: 14 }}>
                <div style={{ height: 4, borderRadius: 3, overflow: "hidden", display: "flex", marginBottom: 8 }}>
                  <div style={{ width: `${(actifs/total)*100}%`, background: "#3B82F6", transition: "width 0.8s ease" }} />
                  <div style={{ width: `${(objEp/total)*100}%`, background: "#8B5CF6", transition: "width 0.8s ease" }} />
                  <div style={{ flex: 1, background: "#10B981" }} />
                </div>
              </div>
            );
          })()}
          <div style={{ display:"flex", gap: isMobile ? 14 : 24, flexWrap:"wrap" }}>
            {[
              { label:"ACTIFS",     val:data.patrimoine.reduce((a,p)=>a+p.valeurActuelle,0), color:"#3B82F6" },
              { label:"OBJECTIFS",  val:data.objectifs.reduce((a,o)=>a+o.epargne,0),         color:"#8B5CF6" },
              { label:"LIQUIDITÉS", val:solde, color:soldeCouleur },
            ].map(s => (
              <div key={s.label} style={{ display:"flex", alignItems:"center", gap: 6 }}>
                <div style={{ width:7, height:7, borderRadius:2, background:s.color, flexShrink:0 }} />
                <div>
                  <div className="mono" style={{ fontSize:8, color:"var(--muted)", letterSpacing:"0.12em" }}>{s.label}</div>
                  <div className="mono" style={{ fontSize:isMobile?11:13, color:s.color, fontWeight:700 }}>{fmt(s.val)}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Shimmer */}
      <div className="shimmer-line" style={{ marginBottom: 14 }} />

      {/* Alertes */}
      {solde < 0 && <Alert type="error">⚠️ Solde négatif ce mois — réduisez vos dépenses.</Alert>}
      {pctBesoins > 50 && revenus > 0 && <Alert type="warn">⚠️ Besoins à {pctBesoins.toFixed(0)}% — dépassement de la règle 50%.</Alert>}
      {pctEpargne >= 20 && revenus > 0 && <Alert type="success">🎉 Bravo ! Vous épargnez {pctEpargne.toFixed(0)}% ce mois.</Alert>}

      {/* ── 4 KPI cards premium ── */}
      <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4,1fr)", gap: isMobile ? 10 : 14, marginBottom: 16 }}>
        {kpis.map((k, i) => {
          const isH = hoveredKpi === k.id;
          return (
            <div key={k.id}
              onMouseEnter={() => setHoveredKpi(k.id)}
              onMouseLeave={() => setHoveredKpi(null)}
              style={{
                borderRadius: 12, border: `1px solid ${isH ? k.color : k.border}`,
                background: isH ? k.bg : `${k.color}06`,
                padding: isMobile ? "12px 10px" : "16px 14px",
                position: "relative", overflow: "hidden", cursor: "default",
                transform: isH ? "translateY(-2px)" : "translateY(0)",
                boxShadow: isH ? `0 6px 20px ${k.color}33` : "none",
                transition: "all 0.2s ease",
              }}>
              {/* Halo */}
              <div style={{ position:"absolute", top:-20, right:-20, width:60, height:60, borderRadius:"50%", background:k.color, opacity: isH ? 0.12 : 0.06, transition:"opacity 0.2s", pointerEvents:"none" }} />
              <div style={{ display:"flex", alignItems:"center", gap:7, marginBottom:10 }}>
                <div style={{ width:28, height:28, borderRadius:7, background:`${k.color}22`, border:`1px solid ${k.color}44`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, flexShrink:0 }}>{k.icon}</div>
                <span style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.07em" }}>{k.label}</span>
              </div>
              <div style={{ fontSize: isMobile ? 15 : 19, fontWeight:800, color:k.color, fontFamily:"'Space Grotesk',sans-serif", lineHeight:1.1, marginBottom:4 }}>
                {fmt(k.value)}
              </div>
              <div style={{ fontSize:10, color:"var(--muted)", marginBottom: 8 }}>{k.sub}</div>
              {/* Mini barre proportionnelle */}
              <div style={{ height:3, background:"rgba(255,255,255,0.06)", borderRadius:2, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${k.pct}%`, background:k.color, borderRadius:2, transition:"width 0.8s ease" }} />
              </div>
              {/* Barre déco bas */}
              <div style={{ position:"absolute", bottom:0, left:0, right:0, height:2, background:`linear-gradient(90deg, ${k.color}66, transparent)` }} />
            </div>
          );
        })}
      </div>

      {/* ── Règle 50/30/20 ── */}
      <div style={{ ...G.card, marginBottom: 16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <SectionHeader title="Règle 50 / 30 / 20" color="var(--gold)" />
          {revenus === 0 && <span style={{ fontSize:11, color:"var(--muted)" }}>Ajoutez des revenus</span>}
        </div>
        {regle503020.map(({ label, emoji, pct, limit, op, color, ok, desc }) => (
          <div key={label} style={{ marginBottom: 18 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom: 8 }}>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                  <span style={{ fontSize:16 }}>{emoji}</span>
                  <span style={{ fontSize:13, fontWeight:600, color:"var(--text)" }}>{label}</span>
                  <span style={{ fontSize:10, color:"var(--muted)", marginLeft:2 }}>— {desc}</span>
                </div>
              </div>
              <div style={{ textAlign:"right", flexShrink:0 }}>
                <div style={{ fontSize:14, fontWeight:800, color: ok ? color : "#EF4444" }}>{pct.toFixed(0)}%</div>
                <div style={{ fontSize:10, color: ok ? color : "#EF4444" }}>{ok ? "✓" : "⚠"} objectif {op} {limit}%</div>
              </div>
            </div>
            {/* Barre avec marqueur limite */}
            <div style={{ position:"relative", height:8, background:"rgba(255,255,255,0.05)", borderRadius:5, overflow:"visible" }}>
              <div style={{ height:"100%", width:`${Math.min(100, pct)}%`, background: ok ? color : "#EF4444", borderRadius:5, transition:"width 0.8s ease", position:"relative" }}>
                <div style={{ position:"absolute", right:-1, top:-2, width:4, height:12, borderRadius:2, background: ok ? color : "#EF4444", boxShadow: ok ? `0 0 6px ${color}` : "0 0 6px #EF4444" }} />
              </div>
              {/* Marqueur limite */}
              <div style={{ position:"absolute", top:-3, left:`${limit}%`, width:2, height:14, background:"rgba(255,255,255,0.3)", borderRadius:1 }} />
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--muted)", marginTop:4 }}>
              <span>0%</span>
              <span style={{ color:"rgba(255,255,255,0.3)" }}>limite {limit}%</span>
              <span>100%</span>
            </div>
          </div>
        ))}

        {/* Score global */}
        {revenus > 0 && (() => {
          const score = [pctBesoins<=50, pctEnvies<=30, pctEpargne>=20].filter(Boolean).length;
          const colors = ["#EF4444","#F59E0B","#10B981"];
          const labels = ["À améliorer","En progrès","Objectif atteint"];
          return (
            <div style={{ marginTop:4, padding:"10px 14px", borderRadius:10, background: `${colors[score-1] || "#EF4444"}12`, border:`1px solid ${colors[score-1] || "#EF4444"}30`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <span style={{ fontSize:12, color:"var(--muted)" }}>Score 50/30/20</span>
              <div style={{ display:"flex", gap:5 }}>
                {[0,1,2].map(i => (
                  <div key={i} style={{ width:24, height:24, borderRadius:6, background: i < score ? (colors[score-1]||"#EF4444") : "rgba(255,255,255,0.05)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11 }}>
                    {i < score ? "✓" : ""}
                  </div>
                ))}
                <span style={{ fontSize:12, color: colors[score-1]||"#EF4444", fontWeight:700, marginLeft:4 }}>{labels[score-1] || "Non calculé"}</span>
              </div>
            </div>
          );
        })()}
      </div>

      {/* ── Objectifs en cours ── */}
      {data.objectifs.length > 0 && (
        <div style={{ ...G.card, marginBottom: 16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
            <SectionHeader title="Objectifs en cours" color="var(--accent)" />
            <span style={{ fontSize:11, color:"var(--muted)" }}>{data.objectifs.filter(o=>o.epargne>=o.cible).length}/{data.objectifs.length} atteint{data.objectifs.filter(o=>o.epargne>=o.cible).length>1?"s":""}</span>
          </div>
          {data.objectifs.slice(0, 3).map(obj => {
            const pct = obj.cible > 0 ? Math.min(100, (obj.epargne / obj.cible) * 100) : 0;
            const done = pct >= 100;
            return (
              <div key={obj.id} style={{ marginBottom:14, padding:"12px 14px", borderRadius:10, border:`1px solid ${done?"rgba(16,185,129,0.3)":"rgba(0,200,255,0.1)"}`, background: done?"rgba(16,185,129,0.06)":"rgba(0,200,255,0.03)", position:"relative", overflow:"hidden" }}>
                {done && <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:"linear-gradient(90deg,#10B981,transparent)" }} />}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:20 }}>{obj.icon}</span>
                    <div>
                      <div style={{ fontSize:13, fontWeight:600, color:"var(--text)" }}>{obj.nom}</div>
                      <div style={{ fontSize:10, color:"var(--muted)" }}>{fmt(obj.epargne)} / {fmt(obj.cible)} FCFA</div>
                    </div>
                  </div>
                  <div style={{ fontSize:16, fontWeight:800, color: done?"#10B981":"var(--gold)", textAlign:"right" }}>
                    {pct.toFixed(0)}%
                    {done && <div style={{ fontSize:10, color:"#10B981" }}>🎉 Atteint</div>}
                  </div>
                </div>
                <div style={{ height:6, background:"rgba(255,255,255,0.05)", borderRadius:4, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${pct}%`, background: done?"#10B981":"linear-gradient(90deg,var(--accent),var(--gold))", borderRadius:4, transition:"width 0.8s ease" }} />
                </div>
                {!done && obj.cible > 0 && obj.epargne > 0 && (
                  <div style={{ fontSize:10, color:"var(--muted)", marginTop:5 }}>
                    Il reste <strong style={{ color:"var(--gold)" }}>{fmt(obj.cible - obj.epargne)} FCFA</strong> à épargner
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── Conseil du jour automatique ── */}
      <div
        onMouseEnter={() => setTipPaused(true)}
        onMouseLeave={() => setTipPaused(false)}
        style={{ borderRadius:14, border:"1px solid rgba(201,168,76,0.3)", background:"linear-gradient(135deg,rgba(201,168,76,0.07),rgba(0,0,0,0))", overflow:"hidden" }}
      >
        {/* Barre de progression temporelle */}
        <div style={{ height:3, background:"rgba(255,255,255,0.05)" }}>
          <div style={{ height:"100%", width:`${tipProgress}%`, background:"linear-gradient(90deg,var(--gold),#F59E0B)", transition: tipProgress === 0 ? "none" : "width 0.05s linear", boxShadow:"0 0 6px rgba(201,168,76,0.6)" }} />
        </div>

        <div style={{ padding:"14px 16px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <div style={{ width:28, height:28, borderRadius:8, background:"rgba(201,168,76,0.15)", border:"1px solid rgba(201,168,76,0.3)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 }}>💡</div>
              <div>
                <div style={{ fontSize:11, color:"var(--gold)", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em" }}>Conseil du jour</div>
                <div style={{ fontSize:9, color:"var(--muted)" }}>{tipPaused ? "⏸ En pause" : "▶ Défilement auto"}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <button onClick={prevTip} style={{ width:26, height:26, borderRadius:7, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.08)", color:"var(--gold)", cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" }}>‹</button>
              <span style={{ fontSize:10, color:"var(--muted)", minWidth:32, textAlign:"center" }}>{tipIdx+1} / {TIPS.length}</span>
              <button onClick={nextTip} style={{ width:26, height:26, borderRadius:7, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.08)", color:"var(--gold)", cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" }}>›</button>
            </div>
          </div>

          <div style={{ opacity: tipFade ? 1 : 0, transition:"opacity 0.28s ease", borderLeft:"2px solid var(--gold)", paddingLeft:12 }}>
            <div style={{ fontSize: 14, color:"var(--text)", lineHeight:1.7, fontStyle:"italic" }}>
              🎯 {TIPS[tipIdx]}
            </div>
          </div>

          {/* Indicateurs de position (points) */}
          <div style={{ display:"flex", justifyContent:"center", gap:4, marginTop:12 }}>
            {TIPS.map((_, i) => (
              <div key={i} onClick={() => { setTipFade(false); setTipProgress(0); setTimeout(() => { setTipIdx(i); setTipFade(true); }, 280); }}
                style={{ width: i === tipIdx ? 16 : 6, height:6, borderRadius:3, background: i === tipIdx ? "var(--gold)" : "rgba(255,255,255,0.12)", cursor:"pointer", transition:"all 0.3s ease" }} />
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ONGLET BUDGET ──────────────────────────────────────────────────────────────
function TabBudget({ data, setData, mois }) {
  const isMobile = useMobile();
  const [tab, setTab] = useState("depenses");
  const [filtreCat, setFiltreCat] = useState(null);
  const [hover, setHover] = useState(null);

  // Formulaire revenu
  const [rLib, setRLib] = useState("");
  const [rMont, setRMont] = useState("");
  const [rRec, setRRec] = useState(false);

  // Formulaire dépense
  const [dLib, setDLib] = useState("");
  const [dMont, setDMont] = useState("");
  const [dCat, setDCat] = useState("autre");
  const [dRec, setDRec] = useState(false);

  const periode = getPeriode(data, mois);

  const addRevenu = () => {
    const m = parseFloat(rMont);
    if (!rLib.trim() || isNaN(m) || m <= 0) return;
    const newR = { id: genId(), label: rLib.trim(), montant: m, recurrent: rRec };
    const newData = {
      ...data,
      periodes: {
        ...data.periodes,
        [mois]: {
          ...getPeriode(data, mois),
          revenus: [...getPeriode(data, mois).revenus, newR],
        }
      }
    };
    setData(newData);
    setRLib(""); setRMont(""); setRRec(false);
  };

  const addDepense = () => {
    const m = parseFloat(dMont);
    if (!dLib.trim() || isNaN(m) || m <= 0) return;
    const newD = { id: genId(), label: dLib.trim(), montant: m, categorie: dCat, recurrent: dRec };
    const newData = {
      ...data,
      periodes: {
        ...data.periodes,
        [mois]: {
          ...getPeriode(data, mois),
          depenses: [...getPeriode(data, mois).depenses, newD],
        }
      }
    };
    setData(newData);
    setDLib(""); setDMont(""); setDRec(false);
  };

  const delRevenu = (id) => {
    const newData = { ...data, periodes: { ...data.periodes, [mois]: { ...getPeriode(data, mois), revenus: getPeriode(data, mois).revenus.filter(r => r.id !== id) } } };
    setData(newData);
  };

  const delDepense = (id) => {
    const newData = { ...data, periodes: { ...data.periodes, [mois]: { ...getPeriode(data, mois), depenses: getPeriode(data, mois).depenses.filter(d => d.id !== id) } } };
    setData(newData);
  };

  const depFiltrees = filtreCat
    ? periode.depenses.filter(d => d.categorie === filtreCat)
    : periode.depenses;

  const fixes = depFiltrees.filter(d => {
    const cat = CATEGORIES.find(c => c.id === d.categorie);
    return cat?.type === "fixe";
  });
  const variables = depFiltrees.filter(d => {
    const cat = CATEGORIES.find(c => c.id === d.categorie);
    return cat?.type !== "fixe";
  });

  const ItemRow = ({ item, onDelete, isHovered, onMouseEnter, onMouseLeave }) => (
    <div
      className="rw"
      onMouseEnter={onMouseEnter}
      onMouseLeave={onMouseLeave}
      style={{
        ...G.row, justifyContent: "space-between", padding: "10px 0",

      {tab === "depenses" && (

            <button onClick={() => setFiltreCat(null)} style={{
              ...G.btnSm(filtreCat === null ? "var(--gold)" : "var(--surface)"),
              color: "#ffffff",
            }}>Tout</button>
            {CATEGORIES.map(cat => (
              <button key={cat.id} onClick={() => setFiltreCat(filtreCat === cat.id ? null : cat.id)} style={{
                ...G.btnSm(filtreCat === cat.id ? "var(--gold)" : "var(--surface)"),
                color: filtreCat === cat.id ? "#0A0F1A" : "var(--text)",

              }}>{cat.icon}</button>

          </div>

            { label: "Charges fixes",     icon: "🔒", color: "#EF4444", items: fixes     },

          ].map(({ label, icon, color, items }) => {

            const totalDep = periode.depenses.reduce((a,d) => a+d.montant, 0);
            const pct      = totalDep > 0 ? Math.round((total/totalDep)*100) : 0;

                        {items.length}
                      </span>
                    </div>
                    <span className="mono" style={{ fontSize:isMobile?13:15, fontWeight:800, color }}>{fmt(total)} <span style={{fontSize:10,color:"var(--muted)"}}>FCFA</span></span>
                  </div>
                  {/* Barre % du total dépenses */}
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <div style={{ flex:1, height:4, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                      <div className="pb-fill" style={{ height:"100%", width:pct+"%", background:color, borderRadius:99 }} />
                    </div>
                    <span style={{ fontSize:10, color:"var(--muted)", fontFamily:"Space Mono,monospace", flexShrink:0 }}>{pct}% du total</span>
                  </div>
                </div>

                {/* Liste des dépenses */}
                <div style={{ padding:"4px 0" }}>
                  {items.length === 0 && (
                    <div style={{ padding:"16px 18px", color:"var(--muted)", fontSize:12, textAlign:"center" }}>Aucune dépense dans cette catégorie.</div>
                  )}
                  {sorted.map((d, idx) => {
                    const cat    = CATEGORIES.find(c => c.id === d.categorie);
                    const barPct = Math.round((d.montant / maxItem) * 100);
                    const isHov  = hover === d.id;
                    return (
                      <div key={d.id}
                        className="rw"
                        onMouseEnter={() => setHover(d.id)}
                        onMouseLeave={() => setHover(null)}
                        style={{
                          padding:"10px 18px",
                          borderBottom: idx < sorted.length-1 ? "1px solid rgba(0,200,255,0.05)" : "none",
                          background: isHov ? "rgba(0,200,255,0.03)" : "transparent",
                          transition:"background 0.15s",
                          position:"relative",
                        }}
                      >
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          {/* Rang */}
                          <span style={{ fontSize:10, color:"var(--muted)", fontFamily:"Space Mono,monospace", minWidth:16, textAlign:"right", flexShrink:0 }}>#{idx+1}</span>
                          {/* Icône catégorie */}
                          <span style={{ fontSize:18, flexShrink:0 }}>{cat?.icon || "📦"}</span>
                          {/* Label + badges */}
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
                              <span style={{ fontSize:isMobile?12:13, color:"var(--text)", fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                                {d.label}
                              </span>
                              {d.recurrent && (
                                <span style={{ fontSize:9, background:"rgba(201,168,76,0.15)", color:"var(--gold)", border:"1px solid rgba(201,168,76,0.3)", borderRadius:3, padding:"1px 5px", fontWeight:700, flexShrink:0 }}>
                                  RÉC
                                </span>
                              )}
                            </div>
                            {/* Mini barre proportionnelle */}
                            <div style={{ height:2, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                              <div className="pb-fill" style={{ height:"100%", width:barPct+"%", background:color, borderRadius:99, opacity:0.7 }} />
                            </div>
                          </div>
                          {/* Montant */}
                          <span className="mono" style={{ fontSize:isMobile?12:13, fontWeight:700, color:"var(--text)", flexShrink:0 }}>
                            {fmt(d.montant)}
                          </span>
                          {/* Bouton suppression */}
                          <button
                            className="dl"
                            onClick={e => { e.stopPropagation(); delDepense(d.id); }}
                            style={{ opacity: isHov ? 1 : 0, transition:"opacity 0.15s", background:"transparent", border:"none", color:"var(--red)", fontSize:16, cursor:"pointer", padding:"0 0 0 4px", flexShrink:0 }}
                          >×</button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Pied de groupe */}
                {items.length > 0 && (
                  <div style={{ padding:"8px 18px", borderTop:"1px solid rgba(0,200,255,0.05)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <span style={{ fontSize:10, color:"var(--muted)" }}>Moyenne : <span className="mono" style={{color:"var(--text)"}}>{fmt(Math.round(total/items.length))} FCFA</span></span>
                    <span style={{ fontSize:10, color:"var(--muted)" }}>Max : <span className="mono" style={{color}}>{fmt(maxItem)} FCFA</span></span>
                  </div>
                )}
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}
// ─── ONGLET GRAPHIQUES ──────────────────────────────────────────────────────────
function TabGraphiques({ data, mois }) {
  const isMobile = useMobile();
  const periode = getPeriode(data, mois);
  const revenus = periode.revenus.reduce((a,r)=>a+r.montant,0);
  const depenses = periode.depenses.reduce((a,d)=>a+d.montant,0);
  const solde = getSolde(data, mois);
  const investi = data.transactions.filter(t=>t.mois===mois&&t.type==="investissement").reduce((a,t)=>a+t.montant,0);
  const epargneObj = data.transactions.filter(t=>t.mois===mois&&t.type==="objectif").reduce((a,t)=>a+t.montant,0);
  const totalEpargne = investi + epargneObj;

  const tauxEpargne = revenus > 0 ? (totalEpargne / revenus) * 100 : 0;
  const tauxEpargneColor = tauxEpargne >= 20 ? "var(--green)" : "var(--red)";
  const depJour = depenses / 30;
  const autonomie = depJour > 0 ? solde / depJour : 0;
  const autonomieColor = autonomie >= 30 ? "var(--green)" : "var(--red)";

  // Fonds d'urgence (actifs de type urgence)
  const fondsUrgence = data.patrimoine.filter(p=>p.type==="urgence").reduce((a,p)=>a+p.valeurActuelle,0);
  const objectifUrgence = depenses * 3;

  // PieChart dépenses par catégorie
  const catData = CATEGORIES.map(cat => ({
    name: `${cat.icon} ${cat.label}`,
    value: periode.depenses.filter(d=>d.categorie===cat.id).reduce((a,d)=>a+d.montant,0),
  })).filter(d=>d.value>0);

  // Répartition fixes/envies/épargne
  const besoinsTotal = periode.depenses.filter(d=>["loyer","electricite","eau","gaz","transport","sante","internet","credit","assurance"].includes(d.categorie)).reduce((a,d)=>a+d.montant,0);
  const enviesTotal = depenses - besoinsTotal;
  const pieData = [
    { name: "Besoins", value: besoinsTotal, color: "#3B82F6" },
    { name: "Envies", value: enviesTotal, color: "#8B5CF6" },
    { name: "Épargne", value: totalEpargne, color: "#10B981" },
  ].filter(d=>d.value>0);

  // Multi-mois
  const allMois = Object.keys(data.periodes).sort();
  const multiData = allMois.map(m => {
    const p = data.periodes[m];
    const rev = p.revenus.reduce((a,r)=>a+r.montant,0);
    const dep = p.depenses.reduce((a,d)=>a+d.montant,0);
    const sol = getSolde(data, m);
    return { mois: moisLabel(m), Revenus: rev, Dépenses: dep, Solde: sol };
  });

  // Top 5 dépenses
  const top5 = [...periode.depenses].sort((a,b)=>b.montant-a.montant).slice(0,5);
  const maxDep = top5[0]?.montant || 1;

  const COLORS = ["#C9A84C","#3B82F6","#10B981","#8B5CF6","#EF4444","#F59E0B","#06B6D4","#EC4899"];

  const [hovKpi, setHovKpi] = React.useState(null);

  const moisCouverts = depenses > 0 ? fondsUrgence / depenses : 0;
  const pctUrgence = objectifUrgence > 0 ? Math.min(100, (fondsUrgence / objectifUrgence) * 100) : 0;

  return (
    <div>
      {/* ── KPI Rangée 1 — métriques clés ── */}

        {[
          {
            id:"taux", label:"Taux d'épargne", value:`${tauxEpargne.toFixed(1)}%`, icon:"💰",
            color: tauxEpargne>=20?"#10B981":"#EF4444",
            bg: tauxEpargne>=20?"rgba(16,185,129,0.08)":"rgba(239,68,68,0.08)",
            border: tauxEpargne>=20?"rgba(16,185,129,0.25)":"rgba(239,68,68,0.25)",
            sub: tauxEpargne>=20?"✓ Objectif atteint":"⚠ Objectif : ≥ 20%",
            bar: Math.min(100, tauxEpargne), barColor: tauxEpargne>=20?"#10B981":"#EF4444",
          },
          {
            id:"jour", label:"Dépense / jour", value:`${fmt(Math.round(depJour))}`, icon:"📅",
            color:"#06B6D4", bg:"rgba(6,182,212,0.08)", border:"rgba(6,182,212,0.25)",

// ─── ONGLET OBJECTIFS ────────────────────────────────────────────────────────────
function TabObjectifs({ data, setData, mois }) {
  const isMobile = useMobile();
  const [showForm, setShowForm] = useState(false);
  const [nom, setNom] = useState("");
  const [cible, setCible] = useState("");
  const [icon, setIcon] = useState("🏠");

  const [actionObj, setActionObj] = useState(null); // { id, type: 'alimenter'|'retirer', montant }
  const [montantAction, setMontantAction] = useState("");

  const solde = getSolde(data, mois);

  const creerObjectif = () => {
    const c = parseFloat(cible);
    if (!nom.trim() || isNaN(c) || c <= 0) return;
    const obj = { id: genId(), nom: nom.trim(), cible: c, epargne: 0, icon };
    setData({ ...data, objectifs: [...data.objectifs, obj] });
    setNom(""); setCible(""); setIcon("🏠"); setShowForm(false);
  };

  const alimenter = (objId) => {
    const m = parseFloat(montantAction);
    if (isNaN(m) || m <= 0 || m > solde) return;
    const tx = { id: genId(), date: new Date().toISOString().split("T")[0], mois, type: "objectif", cible: "objectif", montant: m, objectifId: objId };
    const newData = {
      ...data,
      objectifs: data.objectifs.map(o => o.id === objId ? { ...o, epargne: o.epargne + m } : o),
      transactions: [...data.transactions, tx],
      periodes: {
        ...data.periodes,
        [mois]: { ...getPeriode(data, mois), allocations: (getPeriode(data, mois).allocations || 0) + m }
      }
    };
    setData(newData);
    setActionObj(null); setMontantAction("");
  };

  const retirer = (objId) => {
    const m = parseFloat(montantAction);
    const obj = data.objectifs.find(o => o.id === objId);
    if (!obj || isNaN(m) || m <= 0 || m > obj.epargne) return;
    const tx = { id: genId(), date: new Date().toISOString().split("T")[0], mois, type: "retrait_objectif", cible: "objectif", montant: m, objectifId: objId };
    const newData = {
      ...data,
      objectifs: data.objectifs.map(o => o.id === objId ? { ...o, epargne: Math.max(0, o.epargne - m) } : o),
      transactions: [...data.transactions, tx],
      periodes: {
        ...data.periodes,
        [mois]: { ...getPeriode(data, mois), allocations: Math.max(0, (getPeriode(data, mois).allocations || 0) - m) }
      }
    };
    setData(newData);
    setActionObj(null); setMontantAction("");
  };

  const supprimerObjectif = (objId) => {
    const txs = data.transactions.filter(t => t.objectifId === objId);
    let periodes = { ...data.periodes };
    txs.forEach(tx => {
      if (tx.type === "objectif") {
        if (!periodes[tx.mois]) periodes[tx.mois] = DEFAULT_PERIODE();
        periodes[tx.mois] = { ...periodes[tx.mois], allocations: Math.max(0, (periodes[tx.mois].allocations || 0) - tx.montant) };
      }
    });
    setData({
      ...data,
      objectifs: data.objectifs.filter(o => o.id !== objId),
      transactions: data.transactions.filter(t => t.objectifId !== objId),
      periodes,
    });
  };

  return (
    <div>
      <div style={{ ...G.row, justifyContent: "space-between", marginBottom: 16 }}>
        <div style={{ color: "var(--muted)", fontSize: 13 }}>Solde disponible : <span style={{ color: "var(--gold)", fontWeight: 700 }}>{fmt(solde)} FCFA</span></div>
        <button style={G.btnSm()} onClick={() => setShowForm(!showForm)}>+ Nouvel objectif</button>
      </div>

      {showForm && (
        <div style={G.card}>
          <SectionHeader title="Créer un objectif" color="var(--accent)" />
          <label style={G.label}>Nom de l'objectif</label>
          <input style={{ ...G.input, marginBottom: 10 }} value={nom} onChange={e => setNom(e.target.value)} placeholder="Ex: Voiture, Vacances..." />
          <label style={G.label}>Montant cible (FCFA)</label>
          <input style={{ ...G.input, marginBottom: 10 }} type="number" value={cible} onChange={e => setCible(e.target.value)} placeholder="Ex: 2000000" />
          <label style={G.label}>Icône</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
            {ICONS_OBJECTIFS.map(ic => (
              <button key={ic} onClick={() => setIcon(ic)} style={{
                background: icon === ic ? "var(--gold)" : "var(--surface)",
                border: `1px solid ${icon === ic ? "var(--gold)" : "var(--border)"}`,
                borderRadius: 8, width: 40, height: 40, fontSize: 18, cursor: "pointer",
              }}>{ic}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button style={{ ...G.btn("var(--surface)"), flex: 1 }} onClick={() => setShowForm(false)}>Annuler</button>
            <button style={{ ...G.btn(), flex: 2 }} onClick={creerObjectif}>Créer</button>
          </div>
        </div>
      )}

      {data.objectifs.length === 0 && !showForm && (
        <div style={{ ...G.card, textAlign: "center", color: "var(--muted)" }}>
          <div style={{ fontSize: 40, marginBottom: 10 }}>🎯</div>
          <div>Aucun objectif défini. Créez votre premier objectif !</div>
        </div>
      )}

      {data.objectifs.map((obj, objIdx) => {
        const pct = obj.cible > 0 ? Math.min(100, (obj.epargne / obj.cible) * 100) : 0;
        const atteint = pct >= 100;
        const isAction = actionObj?.id === obj.id;
        return (
          <div key={obj.id} style={{ ...G.card, border: atteint ? "1px solid var(--green)" : "1px solid var(--border)" }}>
            <div style={{ ...G.row, justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ ...G.row }}>
                <span style={{ fontSize: 28 }}>{obj.icon}</span>
                <div>
                  <div style={{ fontWeight: 700, color: "var(--text)", fontSize: 15 }}>{obj.nom}</div>
                  <div style={{ fontSize: 12, color: "var(--muted)" }}>
                    {fmt(obj.epargne)} / {fmt(obj.cible)} FCFA ({pct.toFixed(0)}%)
                  </div>
                </div>
              </div>
              <button onClick={e => { e.stopPropagation(); supprimerObjectif(obj.id); }}
                style={{ background: "none", border: "none", color: "var(--red)", fontSize: 18, cursor: "pointer" }}>×</button>
            </div>
            <ProgressBar value={obj.epargne} max={obj.cible} color={atteint ? "var(--green)" : "var(--gold)"} height={10} />
            {atteint && <div style={{ textAlign: "center", marginTop: 8, fontSize: 14 }}>🎉 Objectif atteint !</div>}
            <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>
              Reste : {fmt(Math.max(0, obj.cible - obj.epargne))} FCFA
            </div>

            {!atteint && (
              <div style={{ ...G.row, marginTop: 10, gap: 8 }}>
                <button onClick={e => { e.stopPropagation(); setActionObj({ id: obj.id, type: "alimenter" }); setMontantAction(""); }}
                  style={G.btnSm("var(--green)")}>💰 Alimenter</button>
                {obj.epargne > 0 && (
                  <button onClick={e => { e.stopPropagation(); setActionObj({ id: obj.id, type: "retirer" }); setMontantAction(""); }}
                    style={G.btnSm("var(--surface)")}>↩ Retirer</button>
                )}
              </div>
            )}

            {isAction && (
              <div style={{ marginTop: 12, padding: 12, background: "var(--surface)", borderRadius: 8 }} onClick={e => e.stopPropagation()}>
                <label style={G.label}>
                  {actionObj.type === "alimenter" ? `Montant (max ${fmt(solde)} FCFA)` : `Montant (max ${fmt(obj.epargne)} FCFA)`}
                </label>
                <div style={G.row}>
                  <input style={{ ...G.input, flex: 1 }} type="number" value={montantAction} onChange={e => setMontantAction(e.target.value)} />
                  <button onClick={e => { e.stopPropagation(); actionObj.type === "alimenter" ? alimenter(obj.id) : retirer(obj.id); }}
                    style={G.btnSm("var(--gold)")}>✓</button>
                  <button onClick={e => { e.stopPropagation(); setActionObj(null); }}
                    style={G.btnSm("var(--surface)")}>✗</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
// ─── ONGLET INVESTIR ─────────────────────────────────────────────────────────────
function TabInvestir({ data, setData, mois }) {
  const isMobile = useMobile();
  const [expanded, setExpanded] = useState(null);
  const [montants, setMontants] = useState({});
  const [noms, setNoms] = useState({});
  const [selectedPcts, setSelectedPcts] = useState({});
  const [confirmAnnuler, setConfirmAnnuler] = useState(null);
  const [filtreHistorique, setFiltreHistorique] = useState("tout");
  const [showHistorique, setShowHistorique] = useState(false);

  const solde = getSolde(data, mois);
  const totalInvesti = getTotalInvesti(data);
  const revenu = data.profil.revenuMensuel || 1;
  const tauxInvesti = Math.min(100, Math.round((totalInvesti / (revenu || 1)) * 100));

  // Couleurs par type
  const TYPE_COLORS = {
    urgence: "#10B981", projet: "#3B82F6", fcp: "#8B5CF6",
    brvm: "#C9A84C", crypto: "#F59E0B", terrain: "#84CC16",
    immobilier: "#06B6D4", or: "#F97316", vehicule: "#EC4899", autre: "#6B7280",
  };

  const investir = (type) => {
    const m = parseFloat(montants[type.id] || "0");
    if (isNaN(m) || m <= 0 || m > solde) return;
    const nom = noms[type.id] || type.label;
    const date = new Date().toISOString().split("T")[0];
    const existingActif = data.patrimoine.find(p => p.type === type.assetType && p.nom === nom && p.source === "app");
    let patrimoine, patrimoineId;
    if (existingActif) {
      patrimoineId = existingActif.id;
      patrimoine = data.patrimoine.map(p =>
        p.id === existingActif.id
          ? { ...p, valeurInitiale: p.valeurInitiale + m, valeurActuelle: p.valeurActuelle + m }
          : p
      );
    } else {
      patrimoineId = genId();
      const newActif = { id: patrimoineId, type: type.assetType, nom, valeurInitiale: m, valeurActuelle: m, dateAchat: date, source: "app" };
      patrimoine = [...data.patrimoine, newActif];
    }
    const tx = { id: genId(), date, mois, type: "investissement", cible: type.id, montant: m, patrimoineId };
    setData({
      ...data, patrimoine,
      transactions: [...data.transactions, tx],
      periodes: { ...data.periodes, [mois]: { ...getPeriode(data, mois), allocations: (getPeriode(data, mois).allocations || 0) + m } }
    });
    setMontants(prev => ({ ...prev, [type.id]: "" }));
    setNoms(prev => ({ ...prev, [type.id]: "" }));
    setSelectedPcts(prev => ({ ...prev, [type.id]: null }));
    setExpanded(null);
  };

  const supprimerDepot = (txId) => {
    const tx = data.transactions.find(t => t.id === txId);
    if (!tx) return;
    const actif = data.patrimoine.find(p => p.id === tx.patrimoineId);
    let patrimoine = data.patrimoine;
    if (actif) {
      const newVal = Math.max(0, actif.valeurActuelle - tx.montant);
      const newInit = Math.max(0, actif.valeurInitiale - tx.montant);
      if (newVal <= 0 && newInit <= 0) {
        const otherTx = data.transactions.filter(t => t.patrimoineId === actif.id && t.id !== txId);
        patrimoine = otherTx.length === 0
          ? data.patrimoine.filter(p => p.id !== actif.id)
          : data.patrimoine.map(p => p.id === actif.id ? { ...p, valeurInitiale: newInit, valeurActuelle: newVal } : p);
      } else {
        patrimoine = data.patrimoine.map(p => p.id === actif.id ? { ...p, valeurInitiale: newInit, valeurActuelle: newVal } : p);

    }
    const periodes = { ...data.periodes };
    if (periodes[tx.mois]) periodes[tx.mois] = { ...periodes[tx.mois], allocations: Math.max(0, (periodes[tx.mois].allocations || 0) - tx.montant) };

                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                      <span style={{ color: tColor, fontWeight: 700, fontSize: 13 }}>{fmt(tx.montant)} <span style={{ fontSize: 10, color: "var(--muted)" }}>FCFA</span></span>
                      {!isConfirm && (

                  </div>
                  {isConfirm && (

                      <div style={{ fontSize: 12, color: "var(--text)", marginBottom: 8 }}>
                        Annuler ce dépôt de <strong style={{ color: "var(--red)" }}>{fmt(tx.montant)} FCFA</strong> ? Le solde sera restauré.
                      </div>
                      <div style={G.row}>
                        <button onClick={() => supprimerDepot(tx.id)} style={G.btnSm("var(--red)")}>Oui ✓</button>

                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Total filtré */}
            {txFiltrées.length > 0 && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--border)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 12, color: "var(--muted)" }}>Total {filtreHistorique !== "tout" ? INVEST_TYPES.find(t => t.id === filtreHistorique)?.label : "affiché"}</span>
                <span style={{ fontSize: 14, fontWeight: 700, color: "var(--gold)" }}>{fmt(txFiltrées.reduce((s, t) => s + t.montant, 0))} FCFA</span>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
// ─── ONGLET CONSEIL ──────────────────────────────────────────────────────────────
function TabConseil({ data, mois }) {
  const isMobile = useMobile();
  const solde = getSolde(data, mois);
  const { profilRisque } = data.profil;

  const [capital, setCapital] = useState("500000");
  const [versement, setVersement] = useState("50000");
  const [duree, setDuree] = useState("10");
  const [taux, setTaux] = useState("7");
  const [mode, setMode] = useState("composes");
  const [expandedPlacement, setExpandedPlacement] = useState(null);
  const [activePresetDuree, setActivePresetDuree] = useState("10");
  const [activePresetTaux, setActivePresetTaux] = useState(null);

  const P = parseFloat(capital) || 0;
  const V = parseFloat(versement) || 0;
  const n = parseFloat(duree) || 0;
  const r = (parseFloat(taux) || 0) / 100;

  let capitalFinal = 0;
  const totalVerse = P + V * n * 12;
  if (mode === "composes") {
    capitalFinal = r === 0 ? totalVerse : P * Math.pow(1 + r, n) + (V * 12) * (Math.pow(1 + r, n) - 1) / r;
  } else {
    capitalFinal = P * (1 + r * n) + V * n * 12;
  }
  const gain = capitalFinal - totalVerse;
  const multiplicateur = totalVerse > 0 ? (capitalFinal / totalVerse).toFixed(2) : "1.00";

  const projData = [];
  for (let y = 0; y <= n; y++) {
    let val = 0, paye = P + V * y * 12;
    if (mode === "composes") {
      val = r === 0 ? paye : P * Math.pow(1 + r, y) + (V * 12) * (r === 0 ? y : (Math.pow(1 + r, y) - 1) / r);
    } else {
      val = P * (1 + r * y) + V * y * 12;
    }
    projData.push({ an: `An ${y}`, Valeur: Math.round(val), Versé: Math.round(paye) });
  }

  const maxRisk = profilRisque === "prudent" ? 2 : profilRisque === "equilibre" ? 3 : 5;
  const placementsFiltrés = PLACEMENTS.filter(p => p.risk <= maxRisk);

  const strategies = {
    prudent:   [{ label: "Épargne sécurité", pct: 50, color: "#10B981", icon: "🛡️" }, { label: "FCP", pct: 40, color: "#3B82F6", icon: "📈" }, { label: "BRVM", pct: 10, color: "#C9A84C", icon: "📊" }],
    equilibre: [{ label: "Épargne sécurité", pct: 30, color: "#10B981", icon: "🛡️" }, { label: "FCP", pct: 30, color: "#3B82F6", icon: "📈" }, { label: "BRVM", pct: 30, color: "#C9A84C", icon: "📊" }, { label: "Terrain", pct: 10, color: "#8B5CF6", icon: "🌍" }],
    dynamique: [{ label: "Épargne sécurité", pct: 20, color: "#10B981", icon: "🛡️" }, { label: "BRVM", pct: 35, color: "#C9A84C", icon: "📊" }, { label: "Terrain/Immo", pct: 25, color: "#8B5CF6", icon: "🏗️" }, { label: "Crypto", pct: 20, color: "#F59E0B", icon: "₿" }],
  };
  const strategie = strategies[profilRisque] || strategies.equilibre;

  const RISK_COLORS = ["#10B981","#3B82F6","#F59E0B","#EF4444","#7C3AED"];

  // Presets durée et taux courants CI
  const PRESETS_DUREE = [{ v: "1", l: "1 an" }, { v: "3", l: "3 ans" }, { v: "5", l: "5 ans" }, { v: "10", l: "10 ans" }, { v: "20", l: "20 ans" }];
  const PRESETS_TAUX  = [{ v: "4", l: "4% Livret" }, { v: "6", l: "6% FCP" }, { v: "8", l: "8% BRVM" }, { v: "12", l: "12% Immo" }];

  return (
    <div>
      {/* ── Banner KPIs premium ── */}
      {(() => {
        const totalPatrimoine = data.patrimoine.reduce((a, p) => a + p.valeurActuelle, 0);

          { icon: "🏛️", label: "Total patrimoine", value: fmt(totalPatrimoine), sub: "FCFA", color: "#06B6D4", bg: "rgba(6,182,212,0.08)", border: "rgba(6,182,212,0.25)", glow: "#06B6D4" },
          { icon: "📊", label: "Placements actifs", value: data.patrimoine.length, sub: `actif${data.patrimoine.length !== 1 ? "s" : ""} enregistré${data.patrimoine.length !== 1 ? "s" : ""}`, color: "#8B5CF6", bg: "rgba(139,92,246,0.08)", border: "rgba(139,92,246,0.25)", glow: "#8B5CF6" },

      </div>

      {/* ── Placements recommandés ── */}
      <div style={G.card}>
        <SectionHeader title="💡 Placements recommandés" color="var(--gold)" />
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>

          @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
          * { box-sizing: border-box; }
          body { margin: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
          :root { ${Object.entries(THEMES.dark).map(([k,v])=>`${k}:${v}`).join(';')} }
        `}</style>
        <Onboarding onDone={(profil) => setData({ ...data, profil })} />
      </>
    );
  }

  const TABS = [
    { id: "accueil",    label: "Accueil"    },
    { id: "budget",     label: "Budget"     },
    { id: "graphiques", label: "Analyses"   },
    { id: "objectifs",  label: "Objectifs"  },
    { id: "investir",   label: "Investir"   },
    { id: "conseil",    label: "Conseil"    },
    { id: "patrimoine", label: "Patrimoine" },
    { id: "formation",  label: "Formation"  },
    { id: "profil",     label: "Profil"     },
  ];

  const solde = getSolde(data, mois);
  const soldePos = solde >= 0;
  const soldeCouleur = soldePos ? "var(--cyan)" : "var(--red)";

  return (
    <MobileContext.Provider value={isMobile}>
    <>
      <style>{`
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Space Grotesk','Segoe UI',sans-serif; background: var(--bg); color: var(--text); }
        :root { ${Object.entries(THEMES.dark).map(([k,v])=>`${k}:${v}`).join(';')} }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.2); border-radius: 99px; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        a { color: var(--cyan); }
        @media (max-width: 640px) {
          button { min-height: 36px; }
          .rw .dl { opacity: 1 !important; }
          nav::-webkit-scrollbar { display: none; }
          main { overflow-x: hidden; }
          .stagger > * { min-width: 0; overflow: hidden; }
        }
      `}</style>

      {/* Header sticky — 1 ligne desktop, 2 lignes mobile */}
      <header style={{
        position: "sticky", top: 0, zIndex: 100,
        background: "rgba(5,9,19,0.92)", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)",
        borderBottom: "1px solid rgba(0,200,255,0.08)",
        padding: isMobile ? "10px 14px" : "14px 24px",
        display: isMobile ? "grid" : "flex",
        gridTemplateColumns: isMobile ? "1fr auto" : undefined,
        rowGap: isMobile ? 8 : undefined,
        columnGap: isMobile ? 10 : undefined,
        flexWrap: "nowrap",
        alignItems: "center", gap: isMobile ? 0 : 12,
      }}>
        {/* Logo futuriste — mobile: row1 col1 | desktop: order 1 */}
        <div style={{ whiteSpace: "nowrap", lineHeight: 1, display:"flex", alignItems:"center", gap:6, gridRow: isMobile ? 1 : undefined, gridColumn: isMobile ? 1 : undefined, order: isMobile ? undefined : 1 }}>
          <div style={{ width:6, height:6, background:"var(--cyan)", borderRadius:"50%", boxShadow:"0 0 8px var(--cyan)", animation:"pulse 2s ease-in-out infinite" }} />
          <span className="mono" style={{ fontWeight: 700, color: "var(--cyan)", fontSize: isMobile ? 14 : 17, letterSpacing:"0.04em" }}>
            PATRIMOINE
          </span>
          <span className="mono" style={{ fontWeight: 400, color: "var(--muted)", fontSize: isMobile ? 11 : 13, letterSpacing:"0.04em" }}>
            /CI
          </span>
        </div>

        {/* Contrôles — mobile: row1 col2 | desktop: order 4 */}
        <div style={{ display:"flex", alignItems:"center", gap:isMobile?6:8, marginLeft: isMobile ? undefined : "auto", justifyContent: isMobile ? "flex-end" : undefined, gridRow: isMobile ? 1 : undefined, gridColumn: isMobile ? 2 : undefined, order: isMobile ? undefined : 4 }}>
          {saveStatus === "saving" && <span className="mono" style={{ color:"var(--muted)", fontSize:10, letterSpacing:"0.08em" }}>SYNC…</span>}
          {saveStatus === "ok"      && <span className="mono" style={{ color:"var(--green)", fontSize:10, letterSpacing:"0.08em" }}>✓ OK</span>}
          {saveStatus === "error"   && <span className="mono" style={{ color:"var(--red)",   fontSize:10, letterSpacing:"0.08em" }}>✗ ERR</span>}
          <button onClick={toggleTheme} style={{ background:"transparent", border:"1px solid rgba(0,200,255,0.2)", borderRadius:4, color:"var(--muted)", fontSize:14, cursor:"pointer", padding:"5px 8px", lineHeight:1 }}>
            {theme === "dark" ? "○" : "◑"}
          </button>
          {authUser && (
            <button onClick={handleLogout} style={{ background:"transparent", border:"1px solid rgba(255,59,107,0.3)", borderRadius:4, color:"var(--red)", fontSize:13, cursor:"pointer", padding:"5px 8px", lineHeight:1 }}>⏻</button>
          )}
        </div>

        {/* Sélecteur de mois — mobile: row2 col1 | desktop: order 3 */}
        <div style={{ display:"flex", alignItems:"center", gap:4, gridRow: isMobile ? 2 : undefined, gridColumn: isMobile ? 1 : undefined, order: isMobile ? undefined : 3 }}>
          <button onClick={() => naviguerMois(prevMois(mois))} style={{ ...G.btn("var(--muted)"), padding:"6px 10px", fontSize:14, lineHeight:1 }}>‹</button>
          <span className="mono" style={{ color:"var(--text)", fontSize:isMobile?11:12, fontWeight:600, letterSpacing:"0.06em", whiteSpace:"nowrap", minWidth:isMobile?64:80, textAlign:"center" }}>{mois}</span>
          <button onClick={() => naviguerMois(nextMois(mois))} style={{ ...G.btn("var(--muted)"), padding:"6px 10px", fontSize:14, lineHeight:1 }}>›</button>
        </div>

        {/* Solde disponible — mobile: row2 col2 | desktop: order 2, flex 1, centered */}
        <div style={{ flex: isMobile ? undefined : 1, textAlign: isMobile ? "right" : "center", minWidth: 0, gridRow: isMobile ? 2 : undefined, gridColumn: isMobile ? 2 : undefined, order: isMobile ? undefined : 2 }}>
          <div className="label-cyber" style={{ marginBottom:3, fontSize:9, color:"rgba(0,200,255,0.6)" }}>SOLDE DISPONIBLE</div>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent: isMobile ? "flex-end" : "center", gap:3 }}>
            <AnimatedNum value={solde} className="mono neon-text" style={{ color: soldeCouleur, fontWeight: 700, fontSize: isMobile ? 14 : 16, whiteSpace: "nowrap" }} />
            <span className="mono" style={{ color: soldeCouleur, fontSize: isMobile ? 10 : 11 }}>FCFA</span>
          </div>
        </div>
      </header>

      <nav style={{
        position:"sticky", top: isMobile ? 88 : 62, zIndex:99,
        background:"rgba(5,9,19,0.95)", backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)",
        borderBottom:"1px solid rgba(0,200,255,0.08)",
        display:"flex", overflowX:"auto", gap:0, padding:"0 8px",
      }}>
        {TABS.map(t => (
          <button key={t.id} className={"nav-tab" + (activeTab === t.id ? " active" : "")} onClick={() => setActiveTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>

      <main style={{ padding: isMobile ? "16px 12px" : "28px 20px", maxWidth:920, margin:"0 auto" }}>
        <div key={activeTab} className="tab-content">
          {activeTab === "accueil"    && <TabAccueil    data={data} setData={setData} mois={mois} />}
          {activeTab === "budget"     && <TabBudget     data={data} setData={setData} mois={mois} />}
          {activeTab === "graphiques" && <TabGraphiques data={data} mois={mois} />}
          {activeTab === "objectifs"  && <TabObjectifs  data={data} setData={setData} mois={mois} />}
          {activeTab === "investir"   && <TabInvestir   data={data} setData={setData} mois={mois} />}
          {activeTab === "conseil"    && <TabConseil    data={data} mois={mois} />}
          {activeTab === "patrimoine" && <TabPatrimoine data={data} setData={setData} mois={mois} />}
          {activeTab === "formation"  && <TabFormation />}
          {activeTab === "profil"     && <TabProfil     data={data} setData={setData} />}
        </div>
      </main>

      {pendingMois && (
        <ModalNouveauMois
          moisPrecedent={mois} moisCible={pendingMois} data={data}
          onChoix={handleChoixMois} onAnnuler={() => setPendingMois(null)}
        />
      )}
    </>
    </MobileContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>

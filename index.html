                <div style={{ width:26, height:26, borderRadius:6, background:`${mod.couleur}20`, border:`1px solid ${mod.couleur}33`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, color:mod.couleur, fontWeight:800, flexShrink:0 }}>{idx+1}</div>
                <span style={{ flex:1, fontSize:isMobile?13:14, fontWeight:600, color:"var(--text)" }}>{sec.titre}</span>
                <span style={{ color: isOpen ? mod.couleur : "var(--muted)", fontSize:12 }}>{isOpen?"▲":"▼"}</span>
              </div>
              {isOpen && (
                <div style={{ padding:"0 16px 16px" }}>
                  <div style={{ height:1, background:`${mod.couleur}20`, marginBottom:12 }} />
                  <p style={{ fontSize:isMobile?12:13, color:"var(--text)", lineHeight:1.8, margin:0 }}>{sec.contenu}</p>
                </div>
              )}
            </div>
          );
        })}

        {/* Ressources */}
        <div style={{ ...G.card, marginTop:8 }}>
          <div style={{ fontSize:11, fontWeight:700, color:"var(--gold)", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:10 }}>📎 Ressources officielles</div>
          {[
            { label:"BRVM — Cours officiels",         url:"https://brvm.org",                   desc:"Cours des actions, rapports annuels" },
            { label:"AMF-UMOA — Vérifier un agrément", url:"https://amf-umoa.org",               desc:"Liste des acteurs agréés" },
            { label:"Djamo Invest",                    url:"https://djamo.ci",                   desc:"Ouvrir un compte FCP" },
            { label:"NSIA Asset Management",           url:"https://nsiaassetsmanagement.com",   desc:"FCP et gestion de patrimoine" },
            { label:"Daba Finance — Actualités UEMOA", url:"https://dabafinance.com",            desc:"News, cours BRVM, analyses" },
            { label:"BCEAO — Statistiques monétaires", url:"https://bceao.int",                 desc:"Données économiques UEMOA" },
          ].map((r, i) => (
            <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom: i < 5 ? "1px solid rgba(0,200,255,0.06)" : "none" }}>
              <div>
                <div style={{ fontSize:12, color:"var(--cyan)", fontWeight:600 }}>{r.label}</div>
                <div style={{ fontSize:10, color:"var(--muted)", marginTop:1 }}>{r.desc}</div>
              </div>
              <span style={{ fontSize:10, color:"var(--muted)" }}>↗</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Liste des modules
  return (
    <div>
      {/* Header */}
      <div style={{
        borderRadius:14, padding:"18px 20px", marginBottom:16,
        background:"linear-gradient(135deg,rgba(0,200,255,0.08) 0%,rgba(139,92,246,0.06) 100%)",
        border:"1px solid rgba(0,200,255,0.2)",
        transform: mounted ? "translateY(0)" : "translateY(8px)",
        opacity: mounted ? 1 : 0, transition:"transform 0.45s ease, opacity 0.45s ease",
      }}>
        <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:12 }}>
          <div style={{ fontSize:28 }}>🎓</div>
          <div>
            <div style={{ fontSize:isMobile?16:18, fontWeight:800, color:"var(--text)" }}>Formation financière</div>
            <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>{FORMATION_MODULES.length} modules · BRVM · S&P 500 · CAC 40 · Crypto · CI</div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
          {[
            { icon:"📚", label:"Modules",    val: FORMATION_MODULES.length },
            { icon:"✅", label:"Lus",        val: totalRead },
            { icon:"⏱",  label:"Durée tot.", val:"~84 min" },
          ].map((s, i) => (
            <div key={i} style={{ background:"rgba(0,0,0,0.2)", borderRadius:8, padding:"8px", textAlign:"center" }}>
              <div style={{ fontSize:14 }}>{s.icon}</div>
              <div style={{ fontSize:isMobile?13:15, fontWeight:800, color:"var(--gold)", fontFamily:"Space Mono,monospace" }}>{s.val}</div>
              <div style={{ fontSize:9, color:"var(--muted)", marginTop:1 }}>{s.label}</div>
            </div>
          ))}
        </div>
        {totalRead > 0 && (
          <div style={{ marginTop:12 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--muted)", marginBottom:4 }}>
              <span>Progression</span>
              <span>{totalRead}/{FORMATION_MODULES.length}</span>
            </div>
            <div style={{ height:4, background:"rgba(0,200,255,0.1)", borderRadius:99, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${(totalRead/FORMATION_MODULES.length)*100}%`, background:"linear-gradient(90deg,var(--cyan),var(--accent))", borderRadius:99, transition:"width 0.5s" }} />
            </div>
          </div>
        )}
      </div>

      {/* Filtres catégories */}
      <div style={{ display:"flex", gap:8, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {cats.map(c => (
          <button key={c.id} onClick={() => setActiveCat(c.id)} style={{
            padding:"7px 14px", borderRadius:20, fontSize:11, fontWeight:600, cursor:"pointer", flexShrink:0,
            fontFamily:"'Space Grotesk',sans-serif", transition:"all 0.2s",
            background: activeCat === c.id ? "var(--gold)" : "var(--surface)",
            border:`1px solid ${activeCat === c.id ? "var(--gold)" : "var(--border)"}`,
            color: activeCat === c.id ? "#0A0F1A" : "var(--muted)",
            boxShadow: activeCat === c.id ? "0 0 12px rgba(201,168,76,0.3)" : "none",
          }}>{c.icon} {c.label}</button>
        ))}
      </div>

      {/* Module cards */}
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {filtered.map((mod, i) => {
          const isRead = !!readModules[mod.id];
          return (
            <div key={mod.id}
              onClick={() => openModule(mod)}
              style={{
                borderRadius:12, padding:"14px 16px", cursor:"pointer",
                background:"var(--card)", display:"flex", alignItems:"center", gap:14,
                border:`1px solid ${isRead ? mod.couleur+"33" : "rgba(0,200,255,0.1)"}`,
                transform: mounted ? "translateX(0)" : "translateX(-16px)",
                opacity: mounted ? 1 : 0,
                transition:`transform 0.4s ease ${i*0.06}s, opacity 0.4s ease ${i*0.06}s, border-color 0.2s, box-shadow 0.2s`,
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor=mod.couleur+"55"; e.currentTarget.style.boxShadow=`0 4px 20px ${mod.couleur}18`; e.currentTarget.style.transform="translateX(4px)"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor=isRead?mod.couleur+"33":"rgba(0,200,255,0.1)"; e.currentTarget.style.boxShadow="none"; e.currentTarget.style.transform="translateX(0)"; }}
            >
              <div style={{ width:48, height:48, borderRadius:12, background:`${mod.couleur}18`, border:`1px solid ${mod.couleur}33`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0, position:"relative" }}>
                {mod.icon}
                {isRead && <div style={{ position:"absolute", top:-5, right:-5, width:16, height:16, borderRadius:"50%", background:"#10B981", border:"2px solid var(--bg)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:8, color:"#fff", fontWeight:800 }}>✓</div>}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:isMobile?13:14, fontWeight:700, color:"var(--text)", marginBottom:3 }}>{mod.titre}</div>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
                  <span style={{ fontSize:9, fontWeight:700, padding:"2px 7px", borderRadius:20, background:`${niveauColor[mod.niveau]}18`, color:niveauColor[mod.niveau] }}>{mod.niveau}</span>
                  <span style={{ fontSize:10, color:"var(--muted)" }}>⏱ {mod.duree}</span>
                  <span style={{ fontSize:10, color:"var(--muted)" }}>{mod.sections.length} sections</span>
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  {(mod.stats||[]).slice(0,2).map((s,j) => (
                    <span key={j} style={{ fontSize:9, background:`${mod.couleur}10`, color:mod.couleur, padding:"2px 7px", borderRadius:4, fontFamily:"Space Mono,monospace" }}>{s.v}</span>
                  ))}
                </div>
              </div>
              <span style={{ color:"var(--muted)", fontSize:14 }}>›</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// onReset n'est PAS destructure des props : le composant definit sa propre
// version plus bas (reset + persistance + reload). Le declarer ici provoquait
// un "Identifier 'onReset' has already been declared" qui bloquait tout le rendu.
function TabProfil({ data, setData, mois, userPlan, onUpgrade }) {
  const isMobile = useMobile();
  const [editMode, setEditMode] = useState(false);
  const [nom, setNom] = useState(data.profil.nom);
  const [revenu, setRevenu] = useState(String(data.profil.revenuMensuel));
  const [risque, setRisque] = useState(data.profil.profilRisque);
  const [resetConfirm, setResetConfirm] = React.useState(false);

  const sauvegarder = () => {
    const r = parseFloat(revenu) || data.profil.revenuMensuel;
    setData({ ...data, profil: { ...data.profil, nom: nom.trim() || data.profil.nom, revenuMensuel: r, profilRisque: risque } });
    setEditMode(false);
  };

  const totalInvesti = getTotalInvesti(data);
  const patrimoineNet = getPatrimoineNet(data, mois);
  const nbMois = Object.keys(data.periodes).length;
  const solde = getSolde(data, mois);
  const tauxEpargne = data.profil.revenuMensuel > 0 ? Math.round((totalInvesti / data.profil.revenuMensuel) * 100) : 0;

  const onReset = () => {
    saveData({ ...DEFAULT_STATE, profil: { ...DEFAULT_STATE.profil } });
    window.location.reload();
  };

  const PROFIL_META = {
    prudent:   { icon: "🛡️", color: "#10B981", bg: "rgba(16,185,129,0.1)",  border: "rgba(16,185,129,0.3)",  label: "Prudent",   desc: "Priorité à la sécurité" },
    equilibre: { icon: "⚖️", color: "#3B82F6", bg: "rgba(59,130,246,0.1)",  border: "rgba(59,130,246,0.3)",  label: "Équilibré", desc: "Risque modéré" },
    dynamique: { icon: "🚀", color: "#C9A84C", bg: "rgba(201,168,76,0.1)", border: "rgba(201,168,76,0.3)", label: "Dynamique", desc: "Performance maximale" },
  };
  const pm = PROFIL_META[data.profil.profilRisque] || PROFIL_META.equilibre;

  // Initiales du nom
  const initiales = data.profil.nom.split(" ").map(w => w[0]).join("").slice(0, 3).toUpperCase();

  const stats = [
    { label: "Revenu mensuel",  value: fmt(data.profil.revenuMensuel), sub: "FCFA",   icon: "💵", color: "#10B981" },
    { label: "Patrimoine net",  value: fmt(patrimoineNet),             sub: "FCFA",   icon: "💎", color: "#C9A84C" },
    { label: "Total investi",   value: fmt(totalInvesti),              sub: "FCFA",   icon: "📈", color: "#3B82F6" },
    { label: "Mois suivis",     value: nbMois,                         sub: "mois",   icon: "📅", color: "#06B6D4" },
    { label: "Actifs",          value: data.patrimoine.length,         sub: "actifs", icon: "🏦", color: "#8B5CF6" },
    { label: "Transactions",    value: data.transactions.length,       sub: "ops",    icon: "🔄", color: "#F59E0B" },
  ];

  return (
    <div>
      {/* ── Hero card ── */}
      <div style={{
        borderRadius: 16, border: `1px solid ${pm.border}`,
        background: `linear-gradient(135deg, ${pm.color}10 0%, var(--card) 60%, var(--bg) 100%)`,
        position: "relative", overflow: "hidden", marginBottom: 16,
      }}>
        {/* Barre couleur profil en haut */}
        <div style={{ height: 3, background: `linear-gradient(90deg, transparent, ${pm.color}, transparent)` }} />

        {/* Halo décoratif */}
        <div style={{ position: "absolute", top: -40, right: -40, width: 160, height: 160, borderRadius: "50%", background: pm.color, opacity: 0.06, pointerEvents: "none" }} />
        <div style={{ position: "absolute", bottom: -30, left: -30, width: 120, height: 120, borderRadius: "50%", background: "#06B6D4", opacity: 0.04, pointerEvents: "none" }} />

        <div style={{ padding: isMobile ? "24px 16px 20px" : "32px 24px 24px", textAlign: "center" }}>
          {/* Avatar avec initiales */}
          <div style={{ position: "relative", display: "inline-block", marginBottom: 16 }}>
            <div style={{
              width: 80, height: 80, borderRadius: "50%", margin: "0 auto",
              background: `linear-gradient(135deg, ${pm.color}33, ${pm.color}11)`,
              border: `2px solid ${pm.color}66`,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 24, fontWeight: 800, color: pm.color,
              fontFamily: "'Space Grotesk', sans-serif", letterSpacing: "0.05em",
              boxShadow: `0 0 24px ${pm.color}33`,
            }}>
              {initiales}
            </div>
            {/* Badge profil */}
            <div style={{
              position: "absolute", bottom: -2, right: -4,
              padding: "2px 8px", borderRadius: 12,
              background: pm.color, color: "#0A0F1A",
              fontSize: 10, fontWeight: 800,
              fontFamily: "'Space Grotesk', sans-serif",
              letterSpacing: "0.05em",
            }}>
              {pm.icon} {pm.label.toUpperCase()}
            </div>
          </div>

          <div style={{ fontSize: isMobile ? 18 : 24, fontWeight: 800, color: "var(--text)", letterSpacing: "0.02em", marginBottom: 4, fontFamily: "'Space Grotesk', sans-serif" }}>
            {data.profil.nom}
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 20 }}>{pm.desc}</div>

          {/* Barre de progression taux d'épargne */}
          <div style={{ maxWidth: 320, margin: "0 auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "var(--muted)", marginBottom: 5 }}>
              <span>Taux d'investissement</span>
              <span style={{ color: tauxEpargne >= 20 ? "#10B981" : "#C9A84C", fontWeight: 700 }}>{tauxEpargne}% {tauxEpargne >= 20 ? "✓" : ""}</span>
            </div>
            <div style={{ height: 5, background: "rgba(255,255,255,0.06)", borderRadius: 4, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${Math.min(100, tauxEpargne)}%`, background: tauxEpargne >= 20 ? "#10B981" : "#C9A84C", borderRadius: 4, transition: "width 0.6s ease" }} />
            </div>
            <div style={{ fontSize: 10, color: "var(--muted)", marginTop: 4 }}>Objectif : ≥ 20% du revenu</div>
          </div>
        </div>

        {/* Footer avec solde dispo */}
        <div style={{ borderTop: `1px solid ${pm.border}`, padding: "12px 24px", display: "flex", justifyContent: "center", gap: 32, background: `${pm.bg}` }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 9, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.07em" }}>Solde ce mois</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: solde >= 0 ? "#10B981" : "#EF4444" }}>{fmt(solde)} FCFA</div>
          </div>
          <div style={{ width: 1, background: pm.border }} />
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 9, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.07em" }}>Membre depuis</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: "var(--cyan)" }}>{nbMois} mois</div>
          </div>
          <div style={{ width: 1, background: pm.border }} />
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 9, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.07em" }}>Actifs</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: pm.color }}>{data.patrimoine.length}</div>
          </div>
        </div>
      </div>

      {/* ── Stats grid ── */}
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(3,1fr)", gap: isMobile ? 8 : 12, marginBottom: 16 }}>
        {stats.map((s, i) => (
          <div key={i} style={{ borderRadius: 12, border: `1px solid ${s.color}22`, background: `${s.color}08`, padding: "14px 12px", position: "relative", overflow: "hidden" }}>
            <div style={{ position: "absolute", top: -12, right: -12, width: 44, height: 44, borderRadius: "50%", background: s.color, opacity: 0.08 }} />
            <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
              <span style={{ fontSize: 16 }}>{s.icon}</span>
              <span style={{ fontSize: 9, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{s.label}</span>
            </div>
            <div style={{ fontSize: isMobile ? 14 : 17, fontWeight: 800, color: s.color, fontFamily: "'Space Grotesk', sans-serif" }}>{s.value}</div>
            <div style={{ fontSize: 9, color: "var(--muted)", marginTop: 2 }}>{s.sub}</div>
            <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: 2, background: `linear-gradient(90deg, ${s.color}66, transparent)` }} />
          </div>
        ))}
      </div>

      {/* ── Édition profil ── */}
      <div style={{ ...G.card, marginBottom: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 700, color: "var(--text)", fontSize: 14 }}>✏️ Modifier le profil</div>
          <button onClick={() => { setEditMode(!editMode); setNom(data.profil.nom); setRevenu(String(data.profil.revenuMensuel)); setRisque(data.profil.profilRisque); }}
            style={{ ...G.btnSm(editMode ? "var(--surface)" : "var(--gold)"), color: "#ffffff" }}>
            {editMode ? "✕ Annuler" : "✏️ Modifier"}
          </button>
        </div>

        {editMode ? (
          <div>
            <label style={G.label}>Prénom / Nom</label>
            <div style={{ position: "relative", marginBottom: 12 }}>
              <input style={{ ...G.input, paddingLeft: 14 }} value={nom} onChange={e => setNom(e.target.value)} placeholder="Votre nom complet" />
              {nom && <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: "var(--green)" }}>✓</span>}
            </div>

            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <label style={{ ...G.label, margin: 0 }}>Revenu mensuel</label>
              <span style={{ fontSize: 12, color: "var(--gold)", fontWeight: 700 }}>{fmt(parseFloat(revenu) || 0)} FCFA</span>
            </div>
            <input type="range" min="0" max="5000000" step="10000" value={revenu} onChange={e => setRevenu(e.target.value)}
              style={{ width: "100%", accentColor: "var(--gold)", marginBottom: 6 }} />
            <div style={{ position: "relative", marginBottom: 16 }}>
              <input style={{ ...G.input, paddingRight: 55 }} type="number" value={revenu} onChange={e => setRevenu(e.target.value)} placeholder="0" />
              <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", fontSize: 10, color: "var(--muted)", pointerEvents: "none" }}>FCFA</span>
            </div>

            <label style={{ ...G.label, marginBottom: 10 }}>Profil investisseur</label>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginBottom: 16 }}>
              {Object.entries(PROFIL_META).map(([id, meta]) => {
                const isA = risque === id;
                return (
                  <button key={id} onClick={() => setRisque(id)} style={{
                    padding: "10px 6px", borderRadius: 10, border: `1.5px solid ${isA ? meta.color : "rgba(0,200,255,0.15)"}`,
                    background: isA ? meta.bg : "rgba(15,30,56,0.5)", color: "#ffffff",
                    cursor: "pointer", textAlign: "center", transition: "all 0.2s",
                    fontFamily: "'Space Grotesk', sans-serif",
                    boxShadow: isA ? `0 0 12px ${meta.color}44` : "none",
                  }}>
                    <div style={{ fontSize: 20, marginBottom: 4 }}>{meta.icon}</div>
                    <div style={{ fontSize: 11, fontWeight: isA ? 700 : 500, color: isA ? meta.color : "var(--muted)" }}>{meta.label}</div>
                    <div style={{ fontSize: 9, color: "var(--muted)", marginTop: 2 }}>{meta.desc}</div>
                  </button>
                );
              })}
            </div>

            <button onClick={sauvegarder} style={{ width: "100%", borderRadius: 8, border: "1px solid var(--gold)", background: "var(--gold)", color: "#0A0F1A", fontWeight: 800, fontSize: 14, padding: "12px 16px", cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif", letterSpacing: "0.06em", textTransform: "uppercase", boxShadow: "0 0 16px rgba(201,168,76,0.4)", transition: "all 0.2s" }}>
              💾 Sauvegarder les modifications
            </button>
          </div>
        ) : (
          <div>
            {[
              { label: "Prénom / Nom",       val: data.profil.nom,                                                        icon: "👤" },
              { label: "Revenu mensuel",      val: `${fmt(data.profil.revenuMensuel)} FCFA`,                               icon: "💵" },
              { label: "Profil investisseur", val: `${pm.icon} ${pm.label}`,                                              icon: "📊" },
            ].map(({ label, val, icon }) => (
              <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: "1px solid var(--border)" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 14 }}>{icon}</span>
                  <span style={{ fontSize: 13, color: "var(--muted)" }}>{label}</span>
                </div>
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text)" }}>{val}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ── Reset inline ── */}
      {!resetConfirm ? (
        <button onClick={() => setResetConfirm(true)} style={{
          width:"100%", borderRadius:8, padding:"11px 16px", marginTop:8,
          background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.25)",
          color:"#EF4444", fontWeight:600, fontSize:12, cursor:"pointer",
          fontFamily:"'Space Grotesk',sans-serif", transition:"all 0.2s",
        }}>🗑️ Réinitialiser toutes les données</button>
      ) : (
        <div style={{ borderRadius:10, border:"1px solid rgba(239,68,68,0.35)", background:"rgba(239,68,68,0.06)", padding:"14px 16px", marginTop:8 }}>
          <div style={{ fontSize:13, fontWeight:700, color:"#EF4444", marginBottom:4 }}>⚠️ Confirmer la réinitialisation</div>
          <div style={{ fontSize:11, color:"var(--muted)", marginBottom:12 }}>Toutes vos données (revenus, dépenses, objectifs, actifs, transactions) seront effacées définitivement.</div>
          <div style={{ display:"flex", gap:10 }}>
            <button style={{ ...G.btn("var(--surface)"), flex:1, color:"#fff" }} onClick={() => setResetConfirm(false)}>Annuler</button>
            <button onClick={() => { onReset(); setResetConfirm(false); }} style={{ flex:1, borderRadius:6, padding:"10px", background:"rgba(239,68,68,0.2)", border:"1px solid rgba(239,68,68,0.5)", color:"#EF4444", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Space Grotesk',sans-serif" }}>
              Oui, tout effacer ✕
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
// ─── MODAL CHANGEMENT DE MOIS ────────────────────────────────────────────────────
function ModalNouveauMois({ moisPrecedent, moisCible, data, onChoix, onAnnuler }) {
  const prevPeriode = getPeriode(data, moisPrecedent);
  const soldePrev = getSolde(data, moisPrecedent);
  const hasRecurrents = prevPeriode.revenus.some(r => r.recurrent) || prevPeriode.depenses.some(d => d.recurrent);

  return (
    <Modal title={`Nouveau mois : ${moisLabel(moisCible)}`} onClose={onAnnuler}>
      <p style={{ color: "var(--muted)", fontSize: 13, marginBottom: 20 }}>
        Ce mois n'a pas encore de données. Comment souhaitez-vous commencer ?
      </p>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <button
          onClick={() => onChoix("recurrents")}
          style={{ ...G.btn("var(--surface)"), textAlign: "left", padding: 14 }}
          disabled={!hasRecurrents}
        >
          <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: 4 }}>
            🔄 Reporter les éléments récurrents
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)" }}>
            Copie les revenus/dépenses récurrents du mois précédent.
            {!hasRecurrents && " (Aucun élément récurrent disponible)"}
          </div>
        </button>
        <button
          onClick={() => onChoix("recurrents+solde")}
          style={{ ...G.btn("var(--surface)"), textAlign: "left", padding: 14 }}
          disabled={!hasRecurrents}
        >
          <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: 4 }}>
            💰 Reporter récurrents + solde restant
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)" }}>
            Idem + ajoute un revenu "Report solde {moisLabel(moisPrecedent)}" de {fmt(soldePrev)} FCFA.
            {!hasRecurrents && " (Aucun récurrent disponible)"}
          </div>
        </button>
        <button
          onClick={() => onChoix("zero")}
          style={{ ...G.btn("var(--gold)"), textAlign: "left", padding: 14 }}
        >
          <div style={{ fontWeight: 700, color: "#ffffff", marginBottom: 4 }}>
            ✨ Repartir de zéro
          </div>
          <div style={{ fontSize: 12, color: "rgba(255,255,255,0.8)" }}>
            Nouvelle période vierge sans données précédentes.
          </div>
        </button>
      </div>
    </Modal>
  );
}

const ALL_TABS_META = [
  { id:"accueil",    label:"Accueil",    icon:"🏠" },
  { id:"budget",     label:"Budget",     icon:"💵" },
  { id:"graphiques", label:"Analyses",   icon:"📊" },
  { id:"objectifs",  label:"Objectifs",  icon:"🎯" },
  { id:"investir",   label:"Investir",   icon:"💸" },
  { id:"conseil",    label:"Conseil",    icon:"🌱" },
  { id:"patrimoine", label:"Patrimoine", icon:"💎" },
  { id:"marches",    label:"Marchés",    icon:"📈" },
  { id:"wallet",     label:"Wallet",     icon:"₿"  },
  { id:"formation",  label:"Formation",  icon:"📚" },
  { id:"profil",     label:"Profil",     icon:"👤" },
];

function AdminPanel({ authUser, onHiddenTabsChange }) {
  const isMobile = useMobile();
  const api = (url, opts={}) => apiFetch(url, opts);

  const [tab, setTab]         = React.useState("stats");
  const [loading, setLoading] = React.useState(true);
  const [stats, setStats]     = React.useState(null);
  const [users, setUsers]     = React.useState([]);
  const [search, setSearch]   = React.useState("");
  const [hiddenTabs, setHiddenTabs] = React.useState([]);
  const [menuSaving, setMenuSaving] = React.useState(false);
  const [menuMsg, setMenuMsg] = React.useState("");

  // per-user expanded state
  const [expanded, setExpanded]   = React.useState(null);
  const [userData, setUserData]   = React.useState({});
  const [userMois, setUserMois]   = React.useState({});
  const [userSubTab, setUserSubTab] = React.useState({});
  const [actionMsg, setActionMsg] = React.useState({});
  const [filterRole, setFilterRole] = React.useState("all");
  const [sortBy, setSortBy] = React.useState("date");
  const [viewMode, setViewMode] = React.useState("cards");

  const reload = () => {
    setLoading(true);
    Promise.allSettled([
      api("/api/admin/stats").then(r=>r.json()),
      api("/api/admin/users").then(r=>r.json()),
      api("/api/admin/settings").then(r=>r.json()),
    ]).then(([s,u,cfg]) => {
      if (s.status==="fulfilled") setStats(s.value);
      const userList = u.status==="fulfilled" ? (u.value.users||[]) : [];
      if (u.status==="fulfilled") setUsers(userList);
      if (cfg.status==="fulfilled") setHiddenTabs(cfg.value.hidden_tabs||[]);
      setLoading(false);
      userList.forEach(usr => {
        api(`/api/admin/user/${usr.id}/data`).then(r=>r.json()).then(d => {
          setUserData(prev => ({...prev, [usr.id]: d}));
          const months = d.periodes ? Object.keys(d.periodes).sort().reverse() : [];
          setUserMois(prev => ({...prev, [usr.id]: months[0]||todayMois()}));
        }).catch(() => setUserData(prev => ({...prev, [usr.id]: {}})));
      });
    });
  };
  React.useEffect(reload, []);

  const loadUserData = (uid) => {
    if (userData[uid]) return;
    api(`/api/admin/user/${uid}/data`).then(r=>r.json()).then(d => {
      setUserData(prev => ({...prev, [uid]: d}));
      const months = d.periodes ? Object.keys(d.periodes).sort().reverse() : [];
      setUserMois(prev => ({...prev, [uid]: months[0]||todayMois()}));
    }).catch(err => {
      console.warn('loadUserData error:', err);
      setUserData(prev => ({...prev, [uid]: {}}));
    });
  };

  const toggleExpand = (uid) => {
    if (expanded===uid) { setExpanded(null); return; }
    setExpanded(uid);
    loadUserData(uid);
  };

  const setPlan = (uid, plan, months=1) => {
    api(`/api/admin/user/${uid}/set-plan`, { method:"POST", body:JSON.stringify({plan, months}) })
      .then(r => {
        if (r.ok) { setUsers(us => us.map(u => u.id===uid ? {...u, plan} : u)); setActionMsg(p=>({...p,[uid]:`✓ Plan → ${plan}`})); }
        else setActionMsg(p=>({...p,[uid]:"✗ Erreur plan"}));
      });
  };

  const promote = (uid, makeAdmin) => {
    api(`/api/admin/user/${uid}/promote`, { method:"POST", body:JSON.stringify({is_admin:makeAdmin}) })
      .then(r => {
        if (r.ok) { setUsers(us => us.map(u => u.id===uid ? {...u, is_admin:makeAdmin} : u)); setActionMsg(p=>({...p,[uid]:"✓ Modifié"})); }
        else setActionMsg(p=>({...p,[uid]:"✗ Erreur"}));
      });
  };

  const resetData = (uid) => {
    if (!confirm("Effacer toutes les données de cet utilisateur ?")) return;
    api(`/api/admin/user/${uid}/reset`, { method:"POST" })
      .then(r => {
        if (r.ok) { setUserData(p=>({...p,[uid]:{}})); setActionMsg(p=>({...p,[uid]:"✓ Données effacées"})); }
        else setActionMsg(p=>({...p,[uid]:"✗ Erreur"}));
      });
  };

  const deleteUser = (uid, email) => {
    if (!confirm(`Supprimer définitivement ${email} ?`)) return;
    api(`/api/admin/user/${uid}`, { method:"DELETE" })
      .then(r => {
        if (r.ok) { setUsers(us => us.filter(u=>u.id!==uid)); if (expanded===uid) setExpanded(null); }
        else setActionMsg(p=>({...p,[uid]:"✗ Erreur suppression"}));
      });
  };

  const saveMenus = () => {
    setMenuSaving(true);
    api("/api/admin/settings", { method:"POST", body:JSON.stringify({hidden_tabs:hiddenTabs}) })
      .then(r => {
        if (r.ok) {
          setMenuMsg("✓ Sauvegardé");
          if (typeof onHiddenTabsChange === "function") onHiddenTabsChange(hiddenTabs);
        } else {
          setMenuMsg("✗ Erreur");
        }
      })
      .catch(() => setMenuMsg("✗ Erreur réseau"))
      .finally(() => setMenuSaving(false));
  };

  const card = (label, val, color="var(--cyan)") => (
    <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:"14px 18px", textAlign:"center" }}>
      <div style={{ fontSize:24, fontWeight:700, color, fontFamily:"'Space Mono',monospace" }}>{val??0}</div>
      <div style={{ fontSize:11, color:"var(--muted)", marginTop:4 }}>{label}</div>
    </div>
  );

  const btn = (label, onClick, color="var(--cyan)", bg="transparent") => (
    <button onClick={onClick} style={{ background:bg, border:`1px solid ${color}`, borderRadius:6, color, padding:"5px 12px", fontSize:12, cursor:"pointer", fontWeight:600 }}>{label}</button>
  );

  const filteredUsers = users
    .filter(u => {
      if (filterRole==="admin") return u.is_admin;
      if (filterRole==="user") return !u.is_admin;
      if (filterRole==="data") return userData[u.id] && Object.keys(userData[u.id].periodes||{}).length>0;
      return true;
    })
    .filter(u => !search || u.email.toLowerCase().includes(search.toLowerCase()) || (u.nom||"").toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => {
      if (sortBy==="nom") return (a.nom||a.email).localeCompare(b.nom||b.email);
      if (sortBy==="revenu") {
        const ra = Object.values(userData[a.id]?.periodes||{}).flatMap(p=>p.revenus||[]).reduce((s,r)=>s+(r.montant||0),0);
        const rb = Object.values(userData[b.id]?.periodes||{}).flatMap(p=>p.revenus||[]).reduce((s,r)=>s+(r.montant||0),0);
        return rb - ra;
      }
      if (sortBy==="patrimoine") {
        const pa = (userData[a.id]?.patrimoine||[]).reduce((s,x)=>s+(x.valeurActuelle||x.valeur||0),0);
        const pb = (userData[b.id]?.patrimoine||[]).reduce((s,x)=>s+(x.valeurActuelle||x.valeur||0),0);
        return pb - pa;
      }
      return 0; // date: server order
    });

  if (loading) return <div style={{ padding:40, textAlign:"center", color:"var(--muted)" }}>Chargement...</div>;

  return (
    <div style={{ animation:"tabEnter 0.3s ease" }}>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ fontSize:18, fontWeight:700, color:"#F59E0B" }}>⚙ Panel Administration</div>
          <div style={{ fontSize:12, color:"var(--muted)" }}>{authUser?.email}</div>
        </div>
        <button onClick={reload} style={{ background:"rgba(245,158,11,0.1)", border:"1px solid #F59E0B", borderRadius:8, color:"#F59E0B", padding:"8px 16px", cursor:"pointer", fontSize:13, fontWeight:600 }}>⟳ Actualiser</button>
      </div>

      {/* Sub-nav */}
      <div style={{ display:"flex", gap:8, marginBottom:20, flexWrap:"wrap" }}>
        {[["stats","Statistiques"],["users","Utilisateurs"],["menus","Menus"]].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)} style={{
            background: tab===id ? "rgba(245,158,11,0.1)" : "transparent",
            border: `1px solid ${tab===id ? "#F59E0B" : "var(--border)"}`,
            borderRadius:8, color: tab===id ? "#F59E0B" : "var(--muted)",
            padding:"6px 16px", cursor:"pointer", fontSize:13, fontWeight: tab===id ? 700 : 400,
          }}>{label}</button>
        ))}
      </div>

      {/* STATS */}
      {tab==="stats" && (() => {
        if (!stats) return <div style={{textAlign:"center",color:"var(--muted)",padding:40}}>Chargement...</div>;

        // Calculs agrégés depuis userData
        const allUsers = users;
        const totalRevenu = Object.values(userData).reduce((s,ud)=> {
          return s + Object.values(ud.periodes||{}).reduce((s2,p)=>(p.revenus||[]).reduce((s3,r)=>s3+(r.montant||0),s2),0);
        }, 0);
        const totalPatrimoine = Object.values(userData).reduce((s,ud)=>
          s+(ud.patrimoine||[]).reduce((s2,a)=>s2+(a.valeurActuelle||a.valeur||0),0),0);
        const usersAvecData = allUsers.filter(u=>userData[u.id]&&Object.keys(userData[u.id].periodes||{}).length>0).length;
        const tauxEngagement = allUsers.length>0 ? Math.round(usersAvecData/allUsers.length*100) : 0;

        // Répartition actifs par type
        const patrimoineByType = {};
        Object.values(userData).forEach(ud=>(ud.patrimoine||[]).forEach(a=>{
          patrimoineByType[a.type||"autre"]=(patrimoineByType[a.type||"autre"]||0)+(a.valeurActuelle||a.valeur||0);
        }));
        const patTypes = Object.entries(patrimoineByType).sort((a,b)=>b[1]-a[1]);
        const maxPat = patTypes[0]?.[1]||1;

        // Activité : users actifs par période
        const actRings = [
          { label:"7j",  val:stats.active_7j,  total:stats.total_users, color:"var(--cyan)" },
          { label:"30j", val:stats.active_users,total:stats.total_users, color:"var(--green)" },
        ];

        // Top utilisateurs par patrimoine
        const topUsers = allUsers
          .map(u=>({ ...u, pat:(userData[u.id]?.patrimoine||[]).reduce((s,a)=>s+(a.valeurActuelle||a.valeur||0),0) }))
          .filter(u=>u.pat>0).sort((a,b)=>b.pat-a.pat).slice(0,5);

        // Dernières inscriptions
        const recentUsers = [...allUsers].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5);

        const KPI = ({label,value,sub,color="var(--cyan)",icon}) => (
          <div style={{background:"var(--surface)",borderRadius:12,padding:"16px 18px",border:`1px solid ${color}22`,position:"relative",overflow:"hidden",transition:"transform 0.2s",cursor:"default"}}
            onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"}
            onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
            <div style={{position:"absolute",right:14,top:14,fontSize:26,opacity:0.1,color}}>{icon}</div>
            <div style={{fontSize:10,color:"var(--muted)",letterSpacing:"0.08em",marginBottom:6}}>{label}</div>
            <div style={{fontSize:28,fontWeight:800,color,fontFamily:"'Space Mono',monospace",lineHeight:1}}>{value}</div>
            {sub && <div style={{fontSize:11,color:"var(--muted)",marginTop:5}}>{sub}</div>}
          </div>
        );

        const Ring = ({val,total,label,color}) => {
          const pct = total>0?Math.round(val/total*100):0;
          const r=30, circ=2*Math.PI*r;
          return (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
              <svg width="80" height="80" style={{transform:"rotate(-90deg)"}}>
                <circle cx="40" cy="40" r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="8"/>
                <circle cx="40" cy="40" r={r} fill="none" stroke={color} strokeWidth="8"
                  strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round"
                  style={{transition:"stroke-dashoffset 1s ease"}}/>
              </svg>
              <div style={{textAlign:"center",marginTop:-72}}>
                <div style={{fontSize:16,fontWeight:800,color,fontFamily:"'Space Mono',monospace"}}>{pct}%</div>
              </div>
              <div style={{marginTop:30,textAlign:"center"}}>
                <div style={{fontSize:13,fontWeight:700,color}}>{val}</div>
                <div style={{fontSize:10,color:"var(--muted)"}}>actifs {label}</div>
              </div>
            </div>
          );
        };

        return (
          <div style={{animation:"fadeIn 0.3s ease"}}>

            {/* KPI principaux */}
            <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"repeat(4,1fr)",gap:12,marginBottom:20}}>
              <KPI label="TOTAL UTILISATEURS" value={stats.total_users} sub={`dont ${stats.total_admins} admin${stats.total_admins>1?"s":""}`} color="var(--cyan)" icon="👥"/>
              <KPI label="ENGAGEMENT" value={`${tauxEngagement}%`} sub={`${usersAvecData} avec données`} color={tauxEngagement>=60?"var(--green)":"#F59E0B"} icon="📊"/>
              <KPI label="NOUVEAUX (30j)" value={stats.new_30j} sub="nouvelles inscriptions" color="#F59E0B" icon="✨"/>
              <KPI label="ADMINS" value={stats.total_admins} sub={`sur ${stats.total_users} users`} color="var(--red)" icon="👑"/>
            </div>

            {/* Ligne 2 : Activité + Patrimoine total + Revenus */}
            <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr 1fr",gap:12,marginBottom:20}}>

              {/* Activité — anneaux */}
              <div style={{background:"var(--surface)",borderRadius:12,padding:"16px 18px",border:"1px solid var(--border)"}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:16,color:"var(--text)"}}>⚡ Activité utilisateurs</div>
                <div style={{display:"flex",justifyContent:"space-around",alignItems:"flex-start"}}>
                  {actRings.map(r=><Ring key={r.label} {...r}/>)}
                </div>
                <div style={{marginTop:12,fontSize:11,color:"var(--muted)",textAlign:"center"}}>
                  {stats.active_7j} connectés cette semaine · {stats.active_users} ce mois
                </div>
              </div>

              {/* Patrimoine total */}
              <div style={{background:"var(--surface)",borderRadius:12,padding:"16px 18px",border:"1px solid #F59E0B22"}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:12,color:"var(--text)"}}>💎 Patrimoine global</div>
                <div style={{fontSize:28,fontWeight:800,color:"#F59E0B",fontFamily:"'Space Mono',monospace",marginBottom:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {fmtFcfa(totalPatrimoine)}
                </div>
                {patTypes.slice(0,4).map(([type,amt])=>(
                  <div key={type} style={{marginBottom:7}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                      <span style={{color:"var(--muted)",textTransform:"capitalize"}}>{type}</span>
                      <span style={{color:"#F59E0B",fontFamily:"'Space Mono',monospace",fontSize:10}}>{fmtFcfa(amt)}</span>
                    </div>
                    <div style={{height:3,background:"rgba(255,255,255,0.05)",borderRadius:2}}>
                      <div style={{height:"100%",width:`${amt/maxPat*100}%`,background:"#F59E0B",borderRadius:2,opacity:0.7,transition:"width 0.8s ease"}}/>
                    </div>
                  </div>
                ))}
              </div>

              {/* Revenus plateforme */}
              <div style={{background:"var(--surface)",borderRadius:12,padding:"16px 18px",border:"1px solid var(--green)22"}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:12,color:"var(--text)"}}>💰 Revenus cumulés</div>
                <div style={{fontSize:24,fontWeight:800,color:"var(--green)",fontFamily:"'Space Mono',monospace",marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {fmtFcfa(totalRevenu)}
                </div>
                <div style={{fontSize:11,color:"var(--muted)",marginBottom:16}}>tous utilisateurs confondus</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                    <span style={{color:"var(--muted)"}}>Revenu moyen/user</span>
                    <span style={{color:"var(--green)",fontWeight:700,fontFamily:"'Space Mono',monospace"}}>{usersAvecData>0?fmtFcfa(Math.round(totalRevenu/usersAvecData)):"—"}</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                    <span style={{color:"var(--muted)"}}>Users avec revenus</span>
                    <span style={{color:"var(--green)",fontWeight:700}}>{usersAvecData}</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                    <span style={{color:"var(--muted)"}}>Patrimoine moyen</span>
                    <span style={{color:"#F59E0B",fontWeight:700,fontFamily:"'Space Mono',monospace"}}>{usersAvecData>0?fmtFcfa(Math.round(totalPatrimoine/usersAvecData)):"—"}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Ligne 3 : Top users + Inscriptions récentes */}
            <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:12}}>

              {/* Top patrimoine */}
              <div style={{background:"var(--surface)",borderRadius:12,padding:"16px 18px",border:"1px solid var(--border)"}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:14,color:"var(--text)"}}>🏆 Top patrimoine</div>
                {topUsers.length===0
                  ? <div style={{color:"var(--muted)",fontSize:12}}>Aucune donnée</div>
                  : topUsers.map((u,i)=>{
                    const hue=(u.id*67)%360;
                    const medals=["🥇","🥈","🥉"];
                    return (
                      <div key={u.id} onClick={()=>{setTab("users");setExpanded(u.id);}}
                        style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,marginBottom:4,cursor:"pointer",background:"rgba(0,0,0,0.15)",transition:"background 0.15s"}}
                        onMouseEnter={e=>e.currentTarget.style.background="rgba(0,200,255,0.06)"}
                        onMouseLeave={e=>e.currentTarget.style.background="rgba(0,0,0,0.15)"}>
                        <span style={{fontSize:14,width:20,textAlign:"center"}}>{medals[i]||`${i+1}.`}</span>
                        <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,hsl(${hue},65%,45%),hsl(${(hue+50)%360},55%,32%))`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,flexShrink:0}}>
                          {(u.nom||u.email)[0].toUpperCase()}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.nom||"(sans nom)"}</div>
                          <div style={{fontSize:10,color:"var(--muted)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.email}</div>
                        </div>
                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:11,fontWeight:700,color:"#F59E0B",flexShrink:0}}>{fmtFcfa(u.pat)}</div>
                      </div>
                    );
                  })
                }
              </div>

              {/* Inscriptions récentes */}
              <div style={{background:"var(--surface)",borderRadius:12,padding:"16px 18px",border:"1px solid var(--border)"}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:14,color:"var(--text)"}}>🆕 Inscriptions récentes</div>
                {recentUsers.map((u,i)=>{
                  const hue=(u.id*67)%360;
                  const ll = u.last_login && u.last_login!=="None" ? new Date(u.last_login) : null;
                  const isOnline = ll && (Date.now()-ll.getTime())<30*60*1000;
                  return (
                    <div key={u.id} onClick={()=>{setTab("users");setExpanded(u.id);}}
                      style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,marginBottom:4,cursor:"pointer",background:"rgba(0,0,0,0.15)",transition:"background 0.15s"}}
                      onMouseEnter={e=>e.currentTarget.style.background="rgba(0,200,255,0.06)"}
                      onMouseLeave={e=>e.currentTarget.style.background="rgba(0,0,0,0.15)"}>
                      <div style={{position:"relative",flexShrink:0}}>
                        <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,hsl(${hue},65%,45%),hsl(${(hue+50)%360},55%,32%))`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>
                          {(u.nom||u.email)[0].toUpperCase()}
                        </div>
                        <div style={{position:"absolute",bottom:0,right:0,width:7,height:7,borderRadius:"50%",background:isOnline?"var(--green)":"rgba(255,255,255,0.15)",border:"1px solid var(--surface)",boxShadow:isOnline?"0 0 5px var(--green)":"none"}}/>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.nom||"(sans nom)"} {u.is_admin&&<span style={{fontSize:9}}>👑</span>}</div>
                        <div style={{fontSize:10,color:"var(--muted)"}}>{u.created_at&&u.created_at!=="None"?new Date(u.created_at).toLocaleDateString("fr-FR"):""}</div>
                      </div>
                      <div style={{fontSize:10,color:isOnline?"var(--green)":"var(--muted)",fontWeight:isOnline?700:400}}>{isOnline?"● En ligne":"○ Hors ligne"}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* USERS */}
      {tab==="users" && (() => {
        const sel = expanded;
        const selUser = sel ? users.find(u=>u.id===sel) : null;
        const selUd = sel ? (userData[sel]||{}) : {};
        const selMois = sel ? (userMois[sel]||todayMois()) : todayMois();
        const selPeriodes = selUd.periodes||{};
        const selMoisData = selPeriodes[selMois]||{};
        const selRev = (selMoisData.revenus||[]).reduce((s,r)=>s+(r.montant||0),0);
        const selDep = (selMoisData.depenses||[]).reduce((s,r)=>s+(r.montant||0),0);
        const selPat = (selUd.patrimoine||[]).reduce((s,a)=>s+(a.valeurActuelle||a.valeur||0),0);
        const selScore = selRev>0 ? Math.min(100,Math.round(
          (Math.min(1,(selRev-selDep)/selRev)*40) +
          (Math.min(1,selPat/selRev)*30) +
          (Math.min(1,Object.keys(selPeriodes).length/6)*30)
        )) : 0;
        const scoreColor = selScore>=70?"var(--green)":selScore>=40?"#F59E0B":"var(--red)";

        const histData = Object.keys(selPeriodes).sort().slice(-6).map(m=>{
          const md = selPeriodes[m];
          const r = (md.revenus||[]).reduce((s,x)=>s+(x.montant||0),0);
          const d = (md.depenses||[]).reduce((s,x)=>s+(x.montant||0),0);
          return { mois:m.slice(5), rev:r, dep:d, sol:r-d };
        });
        const maxHist = Math.max(...histData.map(h=>Math.max(h.rev,h.dep)),1);

        const depBycat = {};
        (selMoisData.depenses||[]).forEach(d=>{ depBycat[d.categorie||"autre"]=(depBycat[d.categorie||"autre"]||0)+(d.montant||0); });
        const depCatList = Object.entries(depBycat).sort((a,b)=>b[1]-a[1]);
        const maxDep = depCatList[0]?.[1]||1;

        return (
        <div style={{ display:"grid", gridTemplateColumns:isMobile?"1fr":"300px 1fr", gap:0, minHeight:500, border:"1px solid var(--border)", borderRadius:14, overflow:"hidden" }}>

          {/* ── SIDEBAR LISTE ── */}
          <div style={{ borderRight:"1px solid var(--border)", background:"rgba(5,9,19,0.6)", display:"flex", flexDirection:"column" }}>
            {/* Search */}
            <div style={{ padding:"12px 12px 8px", borderBottom:"1px solid var(--border)" }}>
              <div style={{ position:"relative" }}>
                <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"var(--muted)",fontSize:12 }}>🔍</span>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..."
                  style={{ width:"100%",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:7,padding:"7px 10px 7px 28px",color:"var(--text)",fontSize:12,boxSizing:"border-box" }} />
              </div>
              <div style={{ display:"flex", gap:4, marginTop:8 }}>
                {[["all","Tous"],["admin","👑"],["data","📊"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setFilterRole(v)} style={{ flex:1,background:filterRole===v?"rgba(0,200,255,0.12)":"transparent",border:`1px solid ${filterRole===v?"var(--cyan)":"var(--border)"}`,borderRadius:5,color:filterRole===v?"var(--cyan)":"var(--muted)",padding:"4px 0",cursor:"pointer",fontSize:11,fontWeight:filterRole===v?700:400 }}>{l}</button>
                ))}
              </div>
            </div>

            {/* Liste scrollable */}
            <div style={{ flex:1, overflowY:"auto", padding:"6px" }}>
              {filteredUsers.map(u=>{
                const ud = userData[u.id]||{};
                const hue = (u.id*67)%360;
                const isActive = sel===u.id;
                const hasDat = Object.keys(ud.periodes||{}).length>0;
                const lastMoisKey = hasDat ? Object.keys(ud.periodes).sort().pop() : null;
                const lastRev = lastMoisKey ? (ud.periodes[lastMoisKey].revenus||[]).reduce((s,r)=>s+(r.montant||0),0) : 0;
                return (
                  <div key={u.id} onClick={()=>{ setExpanded(isActive?null:u.id); if(!isActive) loadUserData(u.id); }}
                    style={{ display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,cursor:"pointer",marginBottom:2,
                      background:isActive?"rgba(0,200,255,0.08)":"transparent",
                      border:`1px solid ${isActive?"rgba(0,200,255,0.25)":"transparent"}`,
                      transition:"all 0.15s"
                    }}>
                    <div style={{ width:36,height:36,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,
                      background:`linear-gradient(135deg,hsl(${hue},65%,45%),hsl(${(hue+50)%360},55%,32%))`,
                      boxShadow:isActive?`0 0 10px hsl(${hue},60%,40%,0.5)`:"none" }}>
                      {(u.nom||u.email)[0].toUpperCase()}
                    </div>
                    <div style={{ flex:1,minWidth:0 }}>
                      <div style={{ fontWeight:isActive?700:500,fontSize:13,color:isActive?"var(--text)":"var(--text)",display:"flex",alignItems:"center",gap:5 }}>
                        <span style={{ overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{u.nom||"(sans nom)"}</span>
                        {u.is_admin && <span style={{ fontSize:9,flexShrink:0 }}>👑</span>}
                        {u.plan==="premium" && <span style={{ fontSize:9,flexShrink:0,color:"var(--cyan)" }}>⭐</span>}
                      </div>
                      <div style={{ fontSize:10,color:"var(--muted)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{u.email}</div>
                    </div>
                    <div style={{ textAlign:"right",flexShrink:0 }}>
                      {hasDat ? <div style={{ fontSize:10,color:"var(--green)",fontFamily:"'Space Mono',monospace",fontWeight:700 }}>{(lastRev/1000).toFixed(0)}k</div>
                               : <div style={{ fontSize:10,color:"var(--muted)" }}>—</div>}
                      {(() => {
                        const ll = u.last_login && u.last_login !== "None" ? new Date(u.last_login) : null;
                        const isOnline = ll && (Date.now() - ll.getTime()) < 30*60*1000;
                        return <div title={isOnline?"En ligne":"Hors ligne"} style={{ width:7,height:7,borderRadius:"50%",background:isOnline?"var(--green)":"rgba(255,255,255,0.15)",margin:"3px auto 0",boxShadow:isOnline?"0 0 6px var(--green)":"none",transition:"all 0.3s" }} />;
                      })()}
                    </div>
                  </div>
                );
              })}
              {filteredUsers.length===0 && <div style={{ textAlign:"center",color:"var(--muted)",fontSize:12,padding:20 }}>Aucun résultat</div>}
            </div>

            {/* Footer sidebar */}
            <div style={{ padding:"8px 12px",borderTop:"1px solid var(--border)",fontSize:11,color:"var(--muted)",display:"flex",justifyContent:"space-between" }}>
              <span>{filteredUsers.length} utilisateurs</span>
              <span style={{ color:"var(--green)" }}>{users.filter(u=>userData[u.id]&&Object.keys(userData[u.id].periodes||{}).length>0).length} actifs</span>
            </div>
          </div>

          {/* ── PANNEAU DÉTAIL ── */}
          {!selUser ? (
            <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"var(--muted)",gap:12,padding:40 }}>
              <div style={{ fontSize:48,opacity:0.3 }}>👤</div>
              <div style={{ fontSize:14 }}>Sélectionne un utilisateur</div>
              <div style={{ fontSize:11 }}>Clique sur un nom à gauche pour voir le détail</div>
            </div>
          ) : (
            <div style={{ overflowY:"auto", padding:"20px 22px", animation:"fadeIn 0.25s ease" }}>

              {/* Header user */}
              <div style={{ display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12 }}>
                <div style={{ display:"flex",alignItems:"center",gap:14 }}>
                  <div style={{ width:52,height:52,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:22,flexShrink:0,
                    background:`linear-gradient(135deg,hsl(${(selUser.id*67)%360},65%,45%),hsl(${((selUser.id*67)+50)%360},55%,32%))`,
                    boxShadow:`0 0 20px hsl(${(selUser.id*67)%360},60%,40%,0.4)` }}>
                    {(selUser.nom||selUser.email)[0].toUpperCase()}
                  </div>
                  <div>
                    <div style={{ fontSize:18,fontWeight:800,display:"flex",alignItems:"center",gap:8 }}>
                      {selUser.nom||"(sans nom)"}
                      {selUser.is_admin && <span style={{ fontSize:11,color:"#F59E0B",border:"1px solid #F59E0B",borderRadius:4,padding:"2px 7px",fontWeight:700 }}>ADMIN</span>}
                    </div>
                    <div style={{ fontSize:12,color:"var(--cyan)" }}>{selUser.email}</div>
                    <div style={{ fontSize:11,color:"var(--muted)",marginTop:2 }}>
                      Inscrit le {selUser.created_at&&selUser.created_at!=="None" ? new Date(selUser.created_at).toLocaleDateString("fr-FR") : "—"} ·{" "}
                      {selUser.last_login&&selUser.last_login!=="None" ? `Vu le ${new Date(selUser.last_login).toLocaleDateString("fr-FR")}` : "Jamais connecté"}
                    </div>
                  </div>
                </div>

                {/* Score santé financière */}
                <div style={{ textAlign:"center",background:"var(--surface)",borderRadius:12,padding:"12px 18px",border:`1px solid ${scoreColor}33` }}>
                  <div style={{ fontSize:10,color:"var(--muted)",marginBottom:4,letterSpacing:"0.08em" }}>SANTÉ FINANCIÈRE</div>
                  <div style={{ fontSize:32,fontWeight:800,color:scoreColor,fontFamily:"'Space Mono',monospace",lineHeight:1 }}>{selScore}</div>
                  <div style={{ fontSize:10,color:scoreColor,marginTop:2 }}>{selScore>=70?"Excellente":selScore>=40?"Correcte":"À améliorer"}</div>
                </div>
              </div>

              {/* Actions rapides */}
              <div style={{ display:"flex",gap:8,marginBottom:20,flexWrap:"wrap" }}>
                <button onClick={()=>promote(selUser.id,!selUser.is_admin)} style={{ display:"flex",alignItems:"center",gap:6,background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:8,color:"#F59E0B",padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600 }}>
                  {selUser.is_admin?"👑 Révoquer admin":"👑 Promouvoir admin"}
                </button>
                  <button onClick={()=>setPlan(selUser.id, selUser.plan==="premium" ? "free" : "premium")} style={{ display:"flex",alignItems:"center",gap:6,background:selUser.plan==="premium"?"rgba(0,200,255,0.08)":"rgba(76,175,80,0.08)",border:selUser.plan==="premium"?"1px solid rgba(0,200,255,0.3)":"1px solid rgba(76,175,80,0.3)",borderRadius:8,color:selUser.plan==="premium"?"var(--cyan)":"#4caf50",padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600 }}>
                    {selUser.plan==="premium" ? "⬇ Rétrograder Free" : "⭐ Passer Premium"}
                  </button>
                <button onClick={()=>resetData(selUser.id)} style={{ display:"flex",alignItems:"center",gap:6,background:"rgba(100,150,255,0.08)",border:"1px solid rgba(100,150,255,0.3)",borderRadius:8,color:"var(--accent)",padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600 }}>
                  🗑 Reset données
                </button>
                <button onClick={()=>deleteUser(selUser.id,selUser.email)} style={{ display:"flex",alignItems:"center",gap:6,background:"rgba(255,59,107,0.08)",border:"1px solid rgba(255,59,107,0.3)",borderRadius:8,color:"var(--red)",padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600 }}>
                  ✕ Supprimer
                </button>
                {actionMsg[selUser.id] && <span style={{ alignSelf:"center",fontSize:12,color:actionMsg[selUser.id].startsWith("✓")?"var(--green)":"var(--red)",fontWeight:600 }}>{actionMsg[selUser.id]}</span>}
              </div>

              {/* Sélecteur mois */}
              {Object.keys(selPeriodes).length>0 && (
                <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:16,flexWrap:"wrap" }}>
                  <span style={{ fontSize:11,color:"var(--muted)" }}>Mois analysé :</span>
                  <div style={{ display:"flex",gap:4,flexWrap:"wrap" }}>
                    {Object.keys(selPeriodes).sort().reverse().map(m=>(
                      <button key={m} onClick={()=>setUserMois(p=>({...p,[selUser.id]:m}))} style={{
                        background:selMois===m?"rgba(0,200,255,0.15)":"rgba(0,0,0,0.2)",
                        border:`1px solid ${selMois===m?"var(--cyan)":"var(--border)"}`,
                        borderRadius:6,color:selMois===m?"var(--cyan)":"var(--muted)",
                        padding:"4px 10px",cursor:"pointer",fontSize:11,fontWeight:selMois===m?700:400,
                        transition:"all 0.15s"
                      }}>{m}</button>
                    ))}
                  </div>
                </div>
              )}

              {Object.keys(selPeriodes).length===0 ? (
                <div style={{ textAlign:"center",color:"var(--muted)",padding:"40px 0",fontSize:13 }}>
                  {userData[selUser.id] ? "Aucune donnée budgétaire enregistrée" : "⏳ Chargement des données..."}
                </div>
              ) : (
                <div>
                  {/* KPI row */}
                  <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18 }}>
                    {[
                      ["Revenus",selRev,"var(--green)","↑"],
                      ["Dépenses",selDep,"var(--red)","↓"],
                      ["Solde",selRev-selDep,selRev-selDep>=0?"var(--cyan)":"var(--red)","="],
                      ["Patrimoine",selPat,"#F59E0B","◆"],
                    ].map(([l,v,c,ic])=>(
                      <div key={l} style={{ background:"var(--surface)",borderRadius:10,padding:"12px 14px",border:`1px solid ${c}22`,position:"relative",overflow:"hidden" }}>
                        <div style={{ position:"absolute",top:8,right:10,fontSize:18,opacity:0.12,color:c,fontWeight:800 }}>{ic}</div>
                        <div style={{ fontSize:10,color:"var(--muted)",marginBottom:4,letterSpacing:"0.06em" }}>{l.toUpperCase()}</div>
                        <div style={{ fontSize:14,fontWeight:800,color:c,fontFamily:"'Space Mono',monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{fmtFcfa(v)}</div>
                      </div>
                    ))}
                  </div>

                  {/* Graphique historique SVG inline */}
                  {histData.length>0 && (
                    <div style={{ background:"var(--surface)",borderRadius:12,padding:"16px 16px 12px",marginBottom:18,border:"1px solid var(--border)" }}>
                      <div style={{ fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:12 }}>📊 Historique budgétaire</div>
                      <div style={{ display:"flex",gap:2,alignItems:"flex-end",height:80 }}>
                        {histData.map((h,i)=>(
                          <div key={i} style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2 }}>
                            <div style={{ width:"100%",display:"flex",gap:1,alignItems:"flex-end",height:64 }}>
                              <div title={`Revenus: ${fmtFcfa(h.rev)}`} style={{ flex:1,background:"var(--green)",borderRadius:"3px 3px 0 0",height:`${Math.max(4,h.rev/maxHist*64)}px`,opacity:0.7,cursor:"pointer",transition:"opacity 0.2s" }} />
                              <div title={`Dépenses: ${fmtFcfa(h.dep)}`} style={{ flex:1,background:"var(--red)",borderRadius:"3px 3px 0 0",height:`${Math.max(4,h.dep/maxHist*64)}px`,opacity:0.7,cursor:"pointer",transition:"opacity 0.2s" }} />
                            </div>
                            <div style={{ fontSize:9,color:selMois===Object.keys(selPeriodes).sort().slice(-6)[i]?"var(--cyan)":"var(--muted)",fontFamily:"'Space Mono',monospace",textAlign:"center",whiteSpace:"nowrap" }}>{h.mois}</div>
                          </div>
                        ))}
                      </div>
                      <div style={{ display:"flex",gap:12,marginTop:8,fontSize:10,color:"var(--muted)" }}>
                        <span><span style={{ display:"inline-block",width:8,height:8,background:"var(--green)",borderRadius:1,marginRight:4,opacity:0.7 }}/>Revenus</span>
                        <span><span style={{ display:"inline-block",width:8,height:8,background:"var(--red)",borderRadius:1,marginRight:4,opacity:0.7 }}/>Dépenses</span>
                      </div>
                    </div>
                  )}

                  {/* Deux colonnes: dépenses par catégorie + patrimoine */}
                  <div style={{ display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:14,marginBottom:18 }}>

                    {/* Dépenses par catégorie */}
                    <div style={{ background:"var(--surface)",borderRadius:12,padding:"14px 16px",border:"1px solid var(--border)" }}>
                      <div style={{ fontSize:12,fontWeight:700,marginBottom:12 }}>💸 Dépenses — {selMois}</div>
                      {depCatList.length===0 ? <div style={{color:"var(--muted)",fontSize:12}}>Aucune dépense</div> : depCatList.map(([cat,amt],i)=>(
                        <div key={cat} style={{ marginBottom:8 }}>
                          <div style={{ display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3 }}>
                            <span style={{color:"var(--muted)",textTransform:"capitalize"}}>{cat}</span>
                            <span style={{color:"var(--red)",fontWeight:600,fontFamily:"'Space Mono',monospace"}}>{fmtFcfa(amt)}</span>
                          </div>
                          <div style={{ height:4,background:"rgba(255,255,255,0.05)",borderRadius:2 }}>
                            <div style={{ height:"100%",width:`${amt/maxDep*100}%`,background:`hsl(${0+i*25},70%,55%)`,borderRadius:2,transition:"width 0.6s ease" }} />
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Patrimoine */}
                    <div style={{ background:"var(--surface)",borderRadius:12,padding:"14px 16px",border:"1px solid var(--border)" }}>
                      <div style={{ fontSize:12,fontWeight:700,marginBottom:12 }}>💎 Patrimoine — {fmtFcfa(selPat)}</div>
                      {(selUd.patrimoine||[]).length===0 ? <div style={{color:"var(--muted)",fontSize:12}}>Aucun actif</div> :
                        (selUd.patrimoine||[]).map((a,i)=>{
                          const pct = selPat>0?Math.round((a.valeurActuelle||a.valeur||0)/selPat*100):0;
                          const hue2 = [200,150,280,45,170,320][i%6];
                          return (
                            <div key={a.id||i} style={{ marginBottom:8 }}>
                              <div style={{ display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3 }}>
                                <span style={{color:"var(--muted)"}}>{a.nom||"—"} <span style={{fontSize:9,opacity:0.6}}>{a.type}</span></span>
                                <span style={{color:`hsl(${hue2},70%,60%)`,fontWeight:600,fontFamily:"'Space Mono',monospace"}}>{pct}%</span>
                              </div>
                              <div style={{ height:4,background:"rgba(255,255,255,0.05)",borderRadius:2 }}>
                                <div style={{ height:"100%",width:`${pct}%`,background:`hsl(${hue2},65%,50%)`,borderRadius:2,transition:"width 0.6s ease" }} />
                              </div>
                            </div>
                          );
                        })
                      }
                    </div>
                  </div>

                  {/* Objectifs */}
                  {(selUd.objectifs||[]).length>0 && (
                    <div style={{ background:"var(--surface)",borderRadius:12,padding:"14px 16px",marginBottom:18,border:"1px solid var(--border)" }}>
                      <div style={{ fontSize:12,fontWeight:700,marginBottom:12 }}>🎯 Objectifs ({selUd.objectifs.length})</div>
                      <div style={{ display:"grid",gridTemplateColumns:isMobile?"1fr":"repeat(auto-fill,minmax(200px,1fr))",gap:10 }}>
                        {selUd.objectifs.map((o,i)=>{
                          const pct = o.cible>0?Math.min(100,Math.round((o.epargne||0)/o.cible*100)):0;
                          return (
                            <div key={i} style={{ background:"rgba(0,0,0,0.2)",borderRadius:8,padding:"10px 12px" }}>
                              <div style={{ fontSize:11,fontWeight:600,marginBottom:6 }}>{o.nom||o.label||"—"}</div>
                              <div style={{ display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--muted)",marginBottom:4 }}>
                                <span>{fmtFcfa(o.epargne||0)}</span>
                                <span style={{color:pct>=100?"var(--green)":"var(--cyan)",fontWeight:700}}>{pct}%</span>
                              </div>
                              <div style={{ height:5,background:"rgba(255,255,255,0.06)",borderRadius:3 }}>
                                <div style={{ height:"100%",width:`${pct}%`,background:pct>=100?"var(--green)":"var(--cyan)",borderRadius:3,transition:"width 0.8s ease",boxShadow:pct>=100?"0 0 6px var(--green)":"none" }} />
                              </div>
                              <div style={{ fontSize:10,color:"var(--muted)",marginTop:4 }}>Cible : {fmtFcfa(o.cible||0)}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Transactions récentes */}
                  <div style={{ background:"var(--surface)",borderRadius:12,padding:"14px 16px",border:"1px solid var(--border)" }}>
                    <div style={{ fontSize:12,fontWeight:700,marginBottom:10 }}>🔄 Transactions — {selMois}</div>
                    {((selUd.transactions||[]).filter(t=>t.mois===selMois)).length===0
                      ? <div style={{color:"var(--muted)",fontSize:12}}>Aucune transaction ce mois</div>
                      : (selUd.transactions||[]).filter(t=>t.mois===selMois).map((t,i)=>(
                        <div key={i} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid var(--border)" }}>
                          <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                            <span style={{ width:6,height:6,borderRadius:"50%",background:t.type==="investissement"?"var(--cyan)":t.type==="depense"?"var(--red)":"var(--green)",flexShrink:0,display:"inline-block" }} />
                            <span style={{ fontSize:12,color:"var(--muted)" }}>{t.description||t.label||t.cible||"—"}</span>
                            <span style={{ fontSize:10,color:"var(--muted)",background:"rgba(255,255,255,0.05)",padding:"1px 5px",borderRadius:3 }}>{t.type}</span>
                          </div>
                          <span style={{ fontSize:12,fontWeight:700,fontFamily:"'Space Mono',monospace",color:t.type==="depense"?"var(--red)":t.type==="investissement"?"var(--cyan)":"var(--green)" }}>
                            {t.type==="depense"?"-":""}{fmtFcfa(t.montant||0)}
                          </span>
                        </div>
                      ))
                    }
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        );
      })()}

      {/* MENUS */}
      {tab==="menus" && (
        <div style={{ maxWidth:480 }}>
          <div style={{ fontSize:12, color:"var(--muted)", marginBottom:16 }}>
            Activez ou désactivez les onglets visibles par tous les utilisateurs. L'onglet Admin reste toujours visible pour les admins.
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {ALL_TABS_META.map(t => {
              const hidden = hiddenTabs.includes(t.id);
              return (
                <div key={t.id} onClick={()=>setHiddenTabs(prev=>prev.includes(t.id)?prev.filter(x=>x!==t.id):[...prev,t.id])} style={{
                  display:"flex",alignItems:"center",justifyContent:"space-between",
                  background:"var(--card)",border:`1px solid ${hidden?"var(--border)":"rgba(0,200,255,0.25)"}`,
                  borderRadius:10,padding:"12px 16px",cursor:"pointer",
                  opacity:hidden?0.5:1,transition:"all 0.2s",
                }}>
                  <div style={{ display:"flex",alignItems:"center",gap:10 }}>
                    <span style={{ fontSize:18 }}>{t.icon}</span>
                    <span style={{ fontWeight:600,fontSize:14 }}>{t.label}</span>
                  </div>
                  <div style={{ width:42,height:24,borderRadius:12,background:hidden?"rgba(255,255,255,0.1)":"var(--cyan)",position:"relative",transition:"background 0.2s",boxShadow:hidden?"none":"0 0 8px rgba(0,200,255,0.4)" }}>
                    <div style={{ position:"absolute",top:3,left:hidden?3:21,width:18,height:18,borderRadius:9,background:"white",transition:"left 0.2s" }} />
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ display:"flex",alignItems:"center",gap:12,marginTop:20 }}>
            <button onClick={saveMenus} disabled={menuSaving} style={{ background:"var(--cyan)",color:"#000",border:"none",borderRadius:8,padding:"10px 24px",fontWeight:700,fontSize:14,cursor:"pointer" }}>
              {menuSaving?"Sauvegarde...":"Enregistrer"}
            </button>
            {menuMsg && <span style={{ fontSize:13,color:menuMsg.startsWith("✓")?"var(--green)":"var(--red)" }}>{menuMsg}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

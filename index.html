function App() {
  const isMobile = useIsMobile();
  const [authUser, setAuthUser]   = React.useState(null);
  const [authReady, setAuthReady] = React.useState(false);
  const [authMode, setAuthMode]   = React.useState("login");
  const [authForm, setAuthForm]   = React.useState({ email:"", password:"", nom:"" });
  const [authError, setAuthError] = React.useState("");
  const [authLoading, setAuthLoading] = React.useState(false);

  const [userPlan, setUserPlan] = React.useState({ plan:"free", is_premium:false, ia_calls_remaining:3, ia_calls_limit:3, max_objectifs:2, can_export:false });
  const [upgradeModal, setUpgradeModal] = React.useState(null);

  const [data, setDataRaw]   = React.useState({ ...DEFAULT_STATE });
  const [mois, setMois]      = React.useState(todayMois());
  const [activeTab, setActiveTab] = React.useState("accueil");
  const [theme, setTheme]    = React.useState("dark");
  const [saveStatus, setSaveStatus] = React.useState("idle");
  const [pendingMois, setPendingMois] = React.useState(null);
  const [hiddenTabs, setHiddenTabs] = React.useState([]);
  const saveTimer = React.useRef(null);

  const setData = (newData) => {
    setDataRaw(newData);
    setSaveStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      if (!getToken()) return;
      apiFetch("/api/save", { method: "POST", body: JSON.stringify(newData) })
        .then(r => {
          if (r.status === 401) return;  // logout deja declenche par apiFetch
          setSaveStatus(r.ok ? "ok" : "error");
        })
        .catch(() => setSaveStatus("error"));
    }, 1200);
  };

  const toggleTheme = () => {
    setTheme(t => {
      const next = t === "dark" ? "light" : "dark";
      applyTheme(next);
      return next;
    });
  };

  React.useEffect(() => { applyTheme(theme); }, []);

  // Enregistrer le callback global pour forcer la déconnexion sur token expiré
  React.useEffect(() => {
    _setAuthUser = setAuthUser;
    _setSaveStatus = setSaveStatus;
    return () => { _setAuthUser = null; _setSaveStatus = null; };
  }, []);

  React.useEffect(() => {
    fetch("/api/settings").then(r => r.json()).then(cfg => setHiddenTabs(cfg.hidden_tabs || [])).catch(() => {});
    const tok = getToken();
    if (!tok) { setAuthReady(true); return; }
    apiFetch("/api/me")
      .then(r => r.ok ? r.json() : null)
      .then(u => {
        if (u) {
          setAuthUser(u);
          setUserPlan({ plan:u.plan||"free", is_premium:u.is_premium||false, ia_calls_remaining:u.ia_calls_remaining, ia_calls_limit:u.ia_calls_limit, max_objectifs:u.max_objectifs, can_export:u.can_export||false, plan_expires_at:u.plan_expires_at });
        } else clearToken();
        setAuthReady(true);
      })
      .catch(() => setAuthReady(true));
  }, []);

  React.useEffect(() => {
    if (!authUser) return;
    apiFetch("/api/load")
      .then(r => r.json())
      .then(d => { if (d && Object.keys(d).length > 0) setDataRaw({ ...DEFAULT_STATE, ...d }); })
      .catch(() => {});
  }, [authUser]);

  const handleLogin = async () => {
    setAuthLoading(true); setAuthError("");
    try {
      const r = await fetch("/api/login", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ email: authForm.email.trim().toLowerCase(), password: authForm.password }),
      });
      const d = await r.json();
      if (!r.ok) setAuthError(d.error || "Erreur connexion");
      else {
        setToken(d.token);
        setAuthUser({ email: d.email, nom: d.nom, is_admin: d.is_admin });
        fetch("/api/me", { headers: { Authorization: "Bearer " + d.token } })
          .then(r => r.ok ? r.json() : null)
          .then(u => { if (u) setUserPlan({ plan:u.plan||"free", is_premium:u.is_premium||false, ia_calls_remaining:u.ia_calls_remaining, ia_calls_limit:u.ia_calls_limit, max_objectifs:u.max_objectifs, can_export:u.can_export||false, plan_expires_at:u.plan_expires_at }); })
          .catch(() => {});
      }
    } catch(e) { setAuthError("Erreur réseau"); }
    setAuthLoading(false);
  };

  const handleRegister = async () => {
    setAuthLoading(true); setAuthError("");
    try {
      const r = await fetch("/api/register", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ email: authForm.email.trim().toLowerCase(), password: authForm.password, nom: authForm.nom }),
      });
      const d = await r.json();
      if (!r.ok) setAuthError(d.error || "Erreur inscription");
      else { setToken(d.token); setAuthUser({ email: d.email, nom: d.nom, is_admin: false }); setUserPlan({ plan:"free", is_premium:false, ia_calls_remaining:3, ia_calls_limit:3, max_objectifs:2, can_export:false }); }
    } catch(e) { setAuthError("Erreur réseau"); }
    setAuthLoading(false);
  };

  const handleLogout = () => { clearToken(); setAuthUser(null); setDataRaw({ ...DEFAULT_STATE }); };

  const naviguerMois = (cible) => {
    if (data.mois && data.mois[cible]) { setMois(cible); return; }
    setPendingMois(cible);
  };

  const handleNouveauMois = (choix) => {
    if (!pendingMois) return;
    const prevPeriode = getPeriode(data, mois);
    let newMoisData = { revenus:[], depenses:[], epargne:0, allocations:0, notes:"" };
    if (choix === "recurrents" || choix === "recurrents+solde") {
      newMoisData.revenus  = prevPeriode.revenus.filter(r => r.recurrent).map(r => ({...r, id: Date.now()+Math.random()}));
      newMoisData.depenses = prevPeriode.depenses.filter(d => d.recurrent).map(d => ({...d, id: Date.now()+Math.random()}));
    }
    if (choix === "recurrents+solde") {
      const s = getSolde(data, mois);
      if (s > 0) newMoisData.revenus.push({ id: Date.now(), label: `Report ${moisLabel(mois)}`, montant: s, recurrent: false });
    }
    const newData = { ...data, mois: { ...(data.mois||{}), [pendingMois]: newMoisData } };
    setData(newData);
    setMois(pendingMois);
    setPendingMois(null);
  };

  if (!authReady) return (
    <>
      <style>{`:root{${Object.entries(THEMES.dark).map(([k,v])=>`${k}:${v}`).join(';')}} body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Space Grotesk',sans-serif;color:var(--muted);}`}</style>

        <div style={{ width:32,height:32,border:"2px solid var(--cyan)",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 12px" }} />
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
        Chargement...
      </div>
    </>
  );

  if (!authUser) return (
    <>
      <style>{`
        @keyframes lgnFade { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        @keyframes lgnSlideL { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
        @keyframes lgnSlideR { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
        @keyframes lgnOrb { 0%,100%{transform:scale(1) translate(0,0)} 33%{transform:scale(1.08) translate(6px,-8px)} 66%{transform:scale(0.95) translate(-4px,5px)} }

                color: authMode===m ? "#00c8ff" : "rgba(255,255,255,0.35)",
                letterSpacing:"0.02em",
              }}>{l}</button>
            ))}
          </div>

          {/* Champs */}
          <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
            {authMode === "register" && (
              <div style={{ position:"relative" }}>
                <svg style={{ position:"absolute",left:15,top:"50%",transform:"translateY(-50%)",opacity:0.35 }} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input className="lgn-input" placeholder="Nom complet" value={authForm.nom}
                  onChange={e => setAuthForm(f => ({...f, nom: e.target.value}))} />
              </div>
            )}
            <div style={{ position:"relative" }}>
              <svg style={{ position:"absolute",left:15,top:"50%",transform:"translateY(-50%)",opacity:0.35 }} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input className="lgn-input" type="email" placeholder="Adresse email" value={authForm.email}
                onChange={e => setAuthForm(f => ({...f, email: e.target.value}))}
                onKeyDown={e => e.key==="Enter" && (authMode==="login" ? handleLogin() : handleRegister())} />
            </div>
            <div style={{ position:"relative" }}>
              <svg style={{ position:"absolute",left:15,top:"50%",transform:"translateY(-50%)",opacity:0.35 }} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input className="lgn-input" type="password" placeholder="Mot de passe" value={authForm.password}
                onChange={e => setAuthForm(f => ({...f, password: e.target.value}))}
                onKeyDown={e => e.key==="Enter" && (authMode==="login" ? handleLogin() : handleRegister())} />
            </div>

            {authError && (
              <div style={{ background:"rgba(255,59,107,0.07)",border:"1px solid rgba(255,59,107,0.18)",borderRadius:10,padding:"10px 14px",color:"#ff6b8a",fontSize:12,display:"flex",alignItems:"center",gap:8 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                {authError}
              </div>
            )}

            <button className="lgn-submit" onClick={authMode==="login" ? handleLogin : handleRegister} disabled={authLoading} style={{
              marginTop:6, padding:"15px 0", borderRadius:12, cursor: authLoading?"not-allowed":"pointer",
              fontWeight:700, fontSize:15, fontFamily:"'Space Grotesk',sans-serif",
              background: authLoading ? "rgba(0,200,255,0.06)" : "linear-gradient(135deg,#00c8ff,#7b5fff)",
              border:"none",
              color: authLoading ? "rgba(255,255,255,0.3)" : "#fff",
              boxShadow: authLoading ? "none" : "0 4px 20px rgba(0,200,255,0.25)",
              transition:"all 0.25s",
              letterSpacing:"0.04em",
              width:"100%",
            }}>
              {authLoading ? "Vérification…" : authMode==="login" ? "Se connecter →" : "Créer mon compte ✦"}
            </button>

            {/* Switch mode */}
            <div style={{ textAlign:"center",marginTop:8,fontSize:13,color:"rgba(255,255,255,0.3)" }}>
              {authMode==="login" ? "Pas encore de compte ? " : "Déjà inscrit ? "}
              <span onClick={() => { setAuthMode(authMode==="login"?"register":"login"); setAuthError(""); }}
                style={{ color:"#00c8ff",cursor:"pointer",fontWeight:600,textDecoration:"underline",textUnderlineOffset:3 }}>
                {authMode==="login" ? "S'inscrire" : "Se connecter"}
              </span>
            </div>
          </div>
        </div>
      </div>
    </>
  );

  const isAdmin = !!(authUser && authUser.is_admin);
  const TABS = [
    ...ALL_TABS_META.filter(t => !hiddenTabs.includes(t.id)),
    ...(isAdmin ? [{ id:"admin", label:"Admin", icon:"⚙️" }] : []),
  ];

  const solde = getSolde(data, mois);
  const soldeCouleur = solde >= 0 ? "var(--cyan)" : "var(--red)";

  return (
    <MobileContext.Provider value={isMobile}>
    <>
      <style>{`
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        * { box-sizing:border-box; }
        body { margin:0; font-family:'Space Grotesk','Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
        :root { ${Object.entries(THEMES.dark).map(([k,v])=>`${k}:${v}`).join(';') } }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(0,200,255,0.2); border-radius:99px; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
        a { color:var(--cyan); }
        @media (max-width:640px) { button { min-height:36px; } nav::-webkit-scrollbar { display:none; } main { overflow-x:hidden; } }
      `}</style>

      <header style={{
        position:"sticky", top:0, zIndex:100,
        background:"rgba(5,9,19,0.92)", backdropFilter:"blur(20px)",
        borderBottom:"1px solid rgba(0,200,255,0.08)",
        padding:isMobile?"10px 14px":"14px 24px",
        display:isMobile?"grid":"flex",
        gridTemplateColumns:isMobile?"1fr auto":undefined,
        rowGap:isMobile?8:undefined, columnGap:isMobile?10:undefined,
        alignItems:"center", gap:isMobile?0:12,
      }}>
        <div style={{ whiteSpace:"nowrap", display:"flex", alignItems:"center", gap:6, gridRow:isMobile?1:undefined, gridColumn:isMobile?1:undefined, order:isMobile?undefined:1 }}>
          <div style={{ width:6,height:6,background:"var(--cyan)",borderRadius:"50%",boxShadow:"0 0 8px var(--cyan)",animation:"pulse 2s ease-in-out infinite" }} />
          <span style={{ fontWeight:700,color:"var(--cyan)",fontSize:isMobile?14:17,letterSpacing:"0.04em",fontFamily:"'Space Mono',monospace" }}>PATRIMOINE</span>
          <span style={{ fontWeight:400,color:"var(--muted)",fontSize:isMobile?11:13,letterSpacing:"0.04em",fontFamily:"'Space Mono',monospace" }}>/CI</span>
        </div>
        <div style={{ display:"flex",alignItems:"center",gap:isMobile?6:8,marginLeft:isMobile?undefined:"auto",justifyContent:isMobile?"flex-end":undefined,gridRow:isMobile?1:undefined,gridColumn:isMobile?2:undefined,order:isMobile?undefined:4 }}>
          {saveStatus==="saving" && <span style={{ color:"var(--muted)",fontSize:10,fontFamily:"'Space Mono',monospace" }}>SYNC…</span>}
          {saveStatus==="ok"     && <span style={{ color:"var(--green)",fontSize:10,fontFamily:"'Space Mono',monospace" }}>✓ OK</span>}
          {saveStatus==="error"  && <span style={{ color:"var(--red)",fontSize:10,fontFamily:"'Space Mono',monospace" }}>✗ ERR</span>}
          {userPlan && userPlan.is_premium
            ? <span style={{ fontSize:10,fontWeight:700,color:"var(--cyan)",border:"1px solid rgba(0,200,255,0.4)",borderRadius:4,padding:"2px 7px",fontFamily:"'Space Mono',monospace",letterSpacing:"0.05em" }}>⭐ PREMIUM</span>
            : <span onClick={() => setUpgradeModal("limit_export")} style={{ fontSize:10,fontWeight:700,color:"var(--muted)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:4,padding:"2px 7px",fontFamily:"'Space Mono',monospace",cursor:"pointer",letterSpacing:"0.05em" }}>FREE</span>
          }
                    {userPlan && userPlan.is_premium
            ? <span style={{ fontSize:10,fontWeight:700,color:"var(--cyan)",border:"1px solid rgba(0,200,255,0.4)",borderRadius:4,padding:"2px 7px",fontFamily:"'Space Mono',monospace",letterSpacing:"0.05em" }}>⭐ PREMIUM</span>
            : <span onClick={() => setUpgradeModal("limit_export")} style={{ fontSize:10,fontWeight:700,color:"var(--muted)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:4,padding:"2px 7px",fontFamily:"'Space Mono',monospace",cursor:"pointer",letterSpacing:"0.05em" }}>FREE</span>
          }
<button onClick={toggleTheme} style={{ background:"transparent",border:"1px solid rgba(0,200,255,0.2)",borderRadius:4,color:"var(--muted)",fontSize:14,cursor:"pointer",padding:"5px 8px" }}>
            {theme==="dark" ? "○" : "◑"}
          </button>
          <button onClick={handleLogout} style={{ background:"transparent",border:"1px solid rgba(255,59,107,0.3)",borderRadius:4,color:"var(--red)",fontSize:13,cursor:"pointer",padding:"5px 8px" }}>⏻</button>
        </div>
        <div style={{ display:"flex",alignItems:"center",gap:4,gridRow:isMobile?2:undefined,gridColumn:isMobile?1:undefined,order:isMobile?undefined:3 }}>
          <button onClick={() => naviguerMois(prevMois(mois))} style={{ ...G.btn("var(--muted)"),padding:"6px 10px",fontSize:14 }}>‹</button>
          <span style={{ color:"var(--text)",fontSize:isMobile?11:12,fontWeight:600,letterSpacing:"0.06em",whiteSpace:"nowrap",minWidth:isMobile?64:80,textAlign:"center",fontFamily:"'Space Mono',monospace" }}>{mois}</span>
          <button onClick={() => naviguerMois(nextMois(mois))} style={{ ...G.btn("var(--muted)"),padding:"6px 10px",fontSize:14 }}>›</button>
        </div>
        <div style={{ flex:isMobile?undefined:1,textAlign:isMobile?"right":"center",minWidth:0,gridRow:isMobile?2:undefined,gridColumn:isMobile?2:undefined,order:isMobile?undefined:2 }}>
          <div style={{ marginBottom:3,fontSize:9,color:"rgba(0,200,255,0.6)",letterSpacing:"0.08em" }}>SOLDE DISPONIBLE</div>
          <div style={{ display:"flex",alignItems:"baseline",justifyContent:isMobile?"flex-end":"center",gap:3 }}>
            <span style={{ color:soldeCouleur,fontWeight:700,fontSize:isMobile?14:16,fontFamily:"'Space Mono',monospace" }}>{fmt(solde)}</span>
            <span style={{ color:soldeCouleur,fontSize:isMobile?10:11,fontFamily:"'Space Mono',monospace" }}>FCFA</span>
          </div>
        </div>
      </header>

      <nav style={{
        position:"sticky",top:isMobile?88:62,zIndex:99,
        background:"rgba(5,9,19,0.95)",backdropFilter:"blur(12px)",
        borderBottom:"1px solid rgba(0,200,255,0.08)",
        display:"flex",overflowX:"scroll",gap:0,padding:"0 4px",
        flexWrap:"nowrap",WebkitOverflowScrolling:"touch",
        scrollbarWidth:"none",msOverflowStyle:"none",
      }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)} style={{
            background:"none",border:"none",
            borderBottom:activeTab===t.id?`2px solid ${t.id==="admin"?"#F59E0B":"var(--cyan)"}`:"2px solid transparent",
            padding:isMobile?"11px 13px":"12px 16px",
            cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,
            color:t.id==="admin"?(activeTab===t.id?"#F59E0B":"rgba(245,158,11,0.6)"):(activeTab===t.id?"var(--cyan)":"var(--muted)"),
            fontWeight:activeTab===t.id?700:400,
            fontSize:isMobile?11:13,
            fontFamily:"'Space Grotesk','Segoe UI',sans-serif",
            transition:"color 0.2s",
          }}>{t.label}</button>
        ))}
      </nav>

      <main style={{ paddingTop:isMobile?"12px":"20px",paddingLeft:isMobile?"12px":"20px",paddingRight:isMobile?"12px":"20px",paddingBottom:60,maxWidth:860,margin:"0 auto" }}>
        {activeTab==="accueil"    && <TabAccueil    data={data} mois={mois} />}
        {activeTab==="budget"     && <TabBudget     data={data} setData={setData} mois={mois} />}
        {activeTab==="graphiques" && <TabGraphiques data={data} mois={mois} />}
        {activeTab==="objectifs"  && <TabObjectifs  data={data} setData={setData} mois={mois} userPlan={userPlan} onUpgrade={setUpgradeModal} />}
        {activeTab==="investir"   && <TabInvestir   data={data} setData={setData} mois={mois} />}
        {activeTab==="conseil"    && <TabConseil    data={data} mois={mois} userPlan={userPlan} setUserPlan={setUserPlan} onUpgrade={setUpgradeModal} />}
        {activeTab==="patrimoine" && <TabPatrimoine data={data} setData={setData} mois={mois} />}
        {activeTab==="marches"    && <TabMarches    />}
        {activeTab==="wallet"     && <TabWallet     />}
        {activeTab==="formation"  && <TabFormation  />}
        {activeTab==="profil"     && <TabProfil     data={data} setData={setData} mois={mois} onReset={() => setData({...DEFAULT_STATE})} userPlan={userPlan} onUpgrade={setUpgradeModal} />}
        {activeTab==="admin"      && isAdmin && <AdminPanel authUser={authUser} onHiddenTabsChange={setHiddenTabs} />}
      </main>

      {upgradeModal && <UpgradeModal reason={upgradeModal} onClose={() => setUpgradeModal(null)} />}

      {pendingMois && (
        <ModalNouveauMois
          moisPrecedent={mois}
          moisCible={pendingMois}
          data={data}
          onChoix={handleNouveauMois}
          onAnnuler={() => setPendingMois(null)}
        />
      )}
    </>
    </MobileContext.Provider>
  );
}

const _root = ReactDOM.createRoot(document.getElementById("root"));
_root.render(<App />);
</script>
</body>
</html>

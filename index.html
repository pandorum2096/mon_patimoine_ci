              </div>
              <div style={{ textAlign:"right", flexShrink:0 }}>
                <div style={{ fontSize:14, fontWeight:800, color: ok ? color : "#EF4444" }}>{pct.toFixed(0)}%</div>
                <div style={{ fontSize:10, color: ok ? color : "#EF4444" }}>{ok ? "✓" : "⚠"} objectif {op} {limit}%</div>
              </div>
            </div>
            {/* Barre avec marqueur limite */}
            <div style={{ position:"relative", height:8, background:"rgba(255,255,255,0.05)", borderRadius:5, overflow:"visible" }}>
              <div style={{ height:"100%", width:`${Math.min(100, pct)}%`, background: ok ? color : "#EF4444", borderRadius:5, transition:"width 0.8s ease", position:"relative" }}>
                <div style={{ position:"absolute", right:-1, top:-2, width:4, height:12, borderRadius:2, background: ok ? color : "#EF4444", boxShadow: ok ? `0 0 6px ${color}` : "0 0 6px #EF4444" }} />
              </div>
              {/* Marqueur limite */}
              <div style={{ position:"absolute", top:-3, left:`${limit}%`, width:2, height:14, background:"rgba(255,255,255,0.3)", borderRadius:1 }} />
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--muted)", marginTop:4 }}>
              <span>0%</span>
              <span style={{ color:"rgba(255,255,255,0.3)" }}>limite {limit}%</span>
              <span>100%</span>
            </div>
          </div>
        ))}

        {/* Score global */}
        {revenus > 0 && (() => {
          const score = [pctBesoins<=50, pctEnvies<=30, pctEpargne>=20].filter(Boolean).length;
          const colors = ["#EF4444","#F59E0B","#10B981"];
          const labels = ["À améliorer","En progrès","Objectif atteint"];
          return (
            <div style={{ marginTop:4, padding:"10px 14px", borderRadius:10, background: `${colors[score-1] || "#EF4444"}12`, border:`1px solid ${colors[score-1] || "#EF4444"}30`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <span style={{ fontSize:12, color:"var(--muted)" }}>Score 50/30/20</span>
              <div style={{ display:"flex", gap:5 }}>
                {[0,1,2].map(i => (
                  <div key={i} style={{ width:24, height:24, borderRadius:6, background: i < score ? (colors[score-1]||"#EF4444") : "rgba(255,255,255,0.05)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11 }}>
                    {i < score ? "✓" : ""}
                  </div>
                ))}
                <span style={{ fontSize:12, color: colors[score-1]||"#EF4444", fontWeight:700, marginLeft:4 }}>{labels[score-1] || "Non calculé"}</span>
              </div>
            </div>
          );
        })()}
      </div>

      {/* ── Objectifs en cours ── */}
      {data.objectifs.length > 0 && (
        <div style={{ ...G.card, marginBottom: 16, maxWidth:600, margin:"0 auto 16px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
            <SectionHeader title="Objectifs en cours" color="var(--accent)" />
            <span style={{ fontSize:11, color:"var(--muted)" }}>{data.objectifs.filter(o=>o.epargne>=o.cible).length}/{data.objectifs.length} atteint{data.objectifs.filter(o=>o.epargne>=o.cible).length>1?"s":""}</span>
          </div>
          {data.objectifs.slice(0, 3).map(obj => {
            const pct = obj.cible > 0 ? Math.min(100, (obj.epargne / obj.cible) * 100) : 0;
            const done = pct >= 100;
            return (
              <div key={obj.id} style={{ marginBottom:14, padding:"12px 14px", borderRadius:10, border:`1px solid ${done?"rgba(16,185,129,0.3)":"rgba(0,200,255,0.1)"}`, background: done?"rgba(16,185,129,0.06)":"rgba(0,200,255,0.03)", position:"relative", overflow:"hidden" }}>
                {done && <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:"linear-gradient(90deg,#10B981,transparent)" }} />}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:20 }}>{obj.icon}</span>
                    <div>
                      <div style={{ fontSize:13, fontWeight:600, color:"var(--text)" }}>{obj.nom}</div>
                      <div style={{ fontSize:10, color:"var(--muted)" }}>{fmt(obj.epargne)} / {fmt(obj.cible)} FCFA</div>
                    </div>
                  </div>
                  <div style={{ fontSize:16, fontWeight:800, color: done?"#10B981":"var(--gold)", textAlign:"right" }}>
                    {pct.toFixed(0)}%
                    {done && <div style={{ fontSize:10, color:"#10B981" }}>🎉 Atteint</div>}
                  </div>
                </div>
                <div style={{ height:6, background:"rgba(255,255,255,0.05)", borderRadius:4, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${pct}%`, background: done?"#10B981":"linear-gradient(90deg,var(--accent),var(--gold))", borderRadius:4, transition:"width 0.8s ease" }} />
                </div>
                {!done && obj.cible > 0 && obj.epargne > 0 && (
                  <div style={{ fontSize:10, color:"var(--muted)", marginTop:5 }}>
                    Il reste <strong style={{ color:"var(--gold)" }}>{fmt(obj.cible - obj.epargne)} FCFA</strong> à épargner
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── Conseil du jour automatique ── */}
      <div
        onMouseEnter={() => setTipPaused(true)}
        onMouseLeave={() => setTipPaused(false)}
        style={{ borderRadius:14, border:"1px solid rgba(201,168,76,0.3)", background:"linear-gradient(135deg,rgba(201,168,76,0.07),rgba(0,0,0,0))", overflow:"hidden", maxWidth:600, margin:"0 auto" }}
      >
        {/* Barre de progression temporelle */}
        <div style={{ height:3, background:"rgba(255,255,255,0.05)" }}>
          <div style={{ height:"100%", width:`${tipProgress}%`, background:"linear-gradient(90deg,var(--gold),#F59E0B)", transition: tipProgress === 0 ? "none" : "width 0.05s linear", boxShadow:"0 0 6px rgba(201,168,76,0.6)" }} />
        </div>

        <div style={{ padding:"14px 16px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <div style={{ width:28, height:28, borderRadius:8, background:"rgba(201,168,76,0.15)", border:"1px solid rgba(201,168,76,0.3)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 }}>💡</div>
              <div>
                <div style={{ fontSize:11, color:"var(--gold)", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em" }}>Conseil du jour</div>
                <div style={{ fontSize:9, color:"var(--muted)" }}>{tipPaused ? "⏸ En pause" : "▶ Défilement auto"}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <button onClick={prevTip} style={{ width:26, height:26, borderRadius:7, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.08)", color:"var(--gold)", cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" }}>‹</button>
              <span style={{ fontSize:10, color:"var(--muted)", minWidth:32, textAlign:"center" }}>{tipIdx+1} / {TIPS.length}</span>
              <button onClick={nextTip} style={{ width:26, height:26, borderRadius:7, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.08)", color:"var(--gold)", cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" }}>›</button>
            </div>
          </div>

          <div style={{ opacity: tipFade ? 1 : 0, transition:"opacity 0.28s ease", borderLeft:"2px solid var(--gold)", paddingLeft:12 }}>
            <div style={{ fontSize: 14, color:"var(--text)", lineHeight:1.7, fontStyle:"italic" }}>
              🎯 {TIPS[tipIdx]}
            </div>
          </div>

          {/* Indicateurs de position (points) */}
          <div style={{ display:"flex", justifyContent:"center", gap:4, marginTop:12 }}>
            {TIPS.map((_, i) => (
              <div key={i} onClick={() => { setTipFade(false); setTipProgress(0); setTimeout(() => { setTipIdx(i); setTipFade(true); }, 280); }}
                style={{ width: i === tipIdx ? 16 : 6, height:6, borderRadius:3, background: i === tipIdx ? "var(--gold)" : "rgba(255,255,255,0.12)", cursor:"pointer", transition:"all 0.3s ease" }} />
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ONGLET BUDGET ──────────────────────────────────────────────────────────────
function TabBudget({ data, setData, mois }) {
  const isMobile = useMobile();
  const [tab, setTab] = useState("depenses");
  const [filtreCat, setFiltreCat] = useState(null);
  const [hover, setHover] = useState(null);

  // Formulaire revenu
  const [rLib, setRLib] = useState("");
  const [rMont, setRMont] = useState("");
  const [rRec, setRRec] = useState(false);

  // Formulaire dépense
  const [dLib, setDLib] = useState("");
  const [dMont, setDMont] = useState("");
  const [dCat, setDCat] = useState("autre");
  const [dRec, setDRec] = useState(false);

  const periode = getPeriode(data, mois);

  const addRevenu = () => {
    const m = parseFloat(rMont);
    if (!rLib.trim() || isNaN(m) || m <= 0) return;
    const newR = { id: genId(), label: rLib.trim(), montant: m, recurrent: rRec };
    const newData = {
      ...data,
      periodes: {
        ...data.periodes,
        [mois]: {
          ...getPeriode(data, mois),
          revenus: [...getPeriode(data, mois).revenus, newR],
        }
      }
    };
    setData(newData);
    setRLib(""); setRMont(""); setRRec(false);
  };

  const addDepense = () => {
    const m = parseFloat(dMont);
    if (!dLib.trim() || isNaN(m) || m <= 0) return;
    const newD = { id: genId(), label: dLib.trim(), montant: m, categorie: dCat, recurrent: dRec };
    const newData = {
      ...data,
      periodes: {
        ...data.periodes,
        [mois]: {
          ...getPeriode(data, mois),
          depenses: [...getPeriode(data, mois).depenses, newD],
        }
      }
    };
    setData(newData);
    setDLib(""); setDMont(""); setDRec(false);
  };

  const delRevenu = (id) => {
    const newData = { ...data, periodes: { ...data.periodes, [mois]: { ...getPeriode(data, mois), revenus: getPeriode(data, mois).revenus.filter(r => r.id !== id) } } };
    setData(newData);
  };

  const delDepense = (id) => {
    const newData = { ...data, periodes: { ...data.periodes, [mois]: { ...getPeriode(data, mois), depenses: getPeriode(data, mois).depenses.filter(d => d.id !== id) } } };
    setData(newData);
  };

  const depFiltrees = filtreCat
    ? periode.depenses.filter(d => d.categorie === filtreCat)
    : periode.depenses;

  const fixes = depFiltrees.filter(d => {
    const cat = CATEGORIES.find(c => c.id === d.categorie);
    return cat?.type === "fixe";
  });
  const variables = depFiltrees.filter(d => {
    const cat = CATEGORIES.find(c => c.id === d.categorie);
    return cat?.type !== "fixe";
  });

  const ItemRow = ({ item, onDelete, isHovered, onMouseEnter, onMouseLeave }) => (
    <div
      className="rw"
      onMouseEnter={onMouseEnter}
      onMouseLeave={onMouseLeave}
      style={{
        ...G.row, justifyContent: "space-between", padding: "10px 0",
        borderBottom: "1px solid var(--border)", position: "relative",
      }}
    >
      <div>
        <span style={{ fontSize: 13, color: "var(--text)" }}>
          {item.recurrent && <span style={{ color: "var(--gold)", marginRight: 4 }}>🔄</span>}
          {item.label}
          {item.categorie && (
            <span style={{ marginLeft: 6, fontSize: 11, color: "var(--muted)" }}>
              {CATEGORIES.find(c => c.id === item.categorie)?.icon}
            </span>
          )}
        </span>
      </div>
      <div style={G.row}>
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text)" }}>{fmt(item.montant)} FCFA</span>
        <button
          onClick={e => { e.stopPropagation(); onDelete(item.id); }}
          className="dl"
          style={{
            background: "var(--red)", border: "none", borderRadius: "50%",
            width: 22, height: 22, color: "#fff", cursor: "pointer", fontSize: 12,
            display: "flex", alignItems: "center", justifyContent: "center",
            opacity: (isHovered || isMobile) ? 1 : 0, transition: "opacity 0.2s", padding: 0, marginLeft: 6,
          }}
        >×</button>
      </div>
    </div>
  );

  return (
    <div>
      {/* Tabs revenus / dépenses */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {["revenus","depenses"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            ...G.btn(tab === t ? "var(--gold)" : "var(--surface)"),
            flex: 1, color: "#ffffff",
          }}>
            {t === "revenus" ? "💵 Revenus" : "💸 Dépenses"}
          </button>
        ))}
      </div>

      {tab === "revenus" && (
        <>
          <div style={G.card}>
            <SectionHeader title="Ajouter un revenu" color="var(--green)" />
            <label style={G.label}>Libellé</label>
            <input style={{ ...G.input, marginBottom: 10 }} value={rLib} onChange={e => setRLib(e.target.value)} placeholder="Ex: Salaire, Freelance..." />
            <label style={G.label}>Montant (FCFA)</label>
            <input style={{ ...G.input, marginBottom: 10 }} type="number" value={rMont} onChange={e => setRMont(e.target.value)} placeholder="Ex: 350000" />
            <div style={{ ...G.row, marginBottom: 14 }}>
              <input type="checkbox" id="rrec" checked={rRec} onChange={e => setRRec(e.target.checked)} />
              <label htmlFor="rrec" style={{ ...G.label, margin: 0, cursor: "pointer" }}>🔄 Récurrent</label>
            </div>
            <button style={{ ...G.btn(), width: "100%" }} onClick={addRevenu}>+ Ajouter</button>
          </div>

          <div style={G.card}>
            <SectionHeader title="Revenus du mois" color="var(--green)" />
            {periode.revenus.length === 0 && <div style={{ color: "var(--muted)", fontSize: 13 }}>Aucun revenu saisi.</div>}
            {periode.revenus.map(r => (
              <ItemRow key={r.id} item={r} onDelete={delRevenu}
                isHovered={hover === r.id}
                onMouseEnter={() => setHover(r.id)}
                onMouseLeave={() => setHover(null)}
              />
            ))}
          </div>
        </>
      )}

      {tab === "depenses" && (
        <>
          <div style={G.card}>
            <SectionHeader title="Ajouter une dépense" color="var(--red)" />
            <div style={G.grid2}>
              <div>
                <label style={G.label}>Libellé</label>
                <input style={G.input} value={dLib} onChange={e => setDLib(e.target.value)} placeholder="Ex: Loyer, Courses..." />
              </div>
              <div>
                <label style={G.label}>Montant (FCFA)</label>
                <input style={G.input} type="number" value={dMont} onChange={e => setDMont(e.target.value)} placeholder="Ex: 120000" />
              </div>
            </div>
            <label style={{ ...G.label, marginTop: 10 }}>Catégorie</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
              {CATEGORIES.map(cat => (
                <button key={cat.id} onClick={() => setDCat(cat.id)} style={{
                  background: dCat === cat.id ? "var(--gold)" : "var(--surface)",
                  border: `1px solid ${dCat === cat.id ? "var(--gold)" : "var(--border)"}`,
                  borderRadius: 6, padding: "4px 10px", cursor: "pointer",
                  color: dCat === cat.id ? "#0A0F1A" : "var(--text)", fontSize: 12,
                  fontFamily: "'Space Grotesk', sans-serif",
                }}>
                  {cat.icon} {cat.label}
                </button>
              ))}
            </div>
            <div style={{ ...G.row, marginBottom: 14 }}>
              <input type="checkbox" id="drec" checked={dRec} onChange={e => setDRec(e.target.checked)} />
              <label htmlFor="drec" style={{ ...G.label, margin: 0, cursor: "pointer" }}>🔄 Récurrent</label>
            </div>
            <button style={{ ...G.btn(), width: "100%" }} onClick={addDepense}>+ Ajouter</button>
          </div>

          {/* Filtre catégorie */}
          <div style={{ ...G.row, flexWrap: "wrap", gap: 6, marginBottom: 12, marginTop: 20 }}>
            <button onClick={() => setFiltreCat(null)} style={{
              ...G.btnSm(filtreCat === null ? "var(--gold)" : "var(--surface)"),
              color: "#ffffff",
            }}>Tout</button>
            {CATEGORIES.map(cat => (
              <button key={cat.id} onClick={() => setFiltreCat(filtreCat === cat.id ? null : cat.id)} style={{
                ...G.btnSm(filtreCat === cat.id ? "var(--gold)" : "var(--surface)"),
                color: filtreCat === cat.id ? "#0A0F1A" : "var(--text)",
                fontSize: 16, padding: "4px 8px",
              }}>{cat.icon}</button>
            ))}
          </div>

          {[
            { label: "Charges fixes",     icon: "🔒", color: "#EF4444", items: fixes     },
            { label: "Dépenses variables", icon: "🌊", color: "#F59E0B", items: variables },
          ].map(({ label, icon, color, items }) => {
            const total    = items.reduce((a,d) => a+d.montant, 0);
            const totalDep = periode.depenses.reduce((a,d) => a+d.montant, 0);
            const pct      = totalDep > 0 ? Math.round((total/totalDep)*100) : 0;
            const sorted   = [...items].sort((a,b) => b.montant - a.montant);
            const maxItem  = sorted[0]?.montant || 1;

            return (
              <div key={label} style={{ ...G.card, padding:0, overflow:"hidden", marginTop:16 }}>

                {/* En-tête groupe */}
                <div style={{ padding:"14px 18px 10px", borderBottom:"1px solid rgba(0,200,255,0.08)" }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:16 }}>{icon}</span>
                      <span style={{ fontSize:isMobile?11:12, fontWeight:700, color:"var(--text)", textTransform:"uppercase", letterSpacing:"0.08em" }}>{label}</span>
                      <span style={{ background:"rgba(255,59,107,0.1)", color, border:`1px solid ${color}33`, borderRadius:99, padding:"1px 8px", fontSize:10, fontWeight:700, fontFamily:"Space Mono,monospace" }}>
                        {items.length}
                      </span>
                    </div>
                    <span className="mono" style={{ fontSize:isMobile?13:15, fontWeight:800, color }}>{fmt(total)} <span style={{fontSize:10,color:"var(--muted)"}}>FCFA</span></span>
                  </div>
                  {/* Barre % du total dépenses */}
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <div style={{ flex:1, height:4, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                      <div className="pb-fill" style={{ height:"100%", width:pct+"%", background:color, borderRadius:99 }} />
                    </div>
                    <span style={{ fontSize:10, color:"var(--muted)", fontFamily:"Space Mono,monospace", flexShrink:0 }}>{pct}% du total</span>
                  </div>
                </div>

                {/* Liste des dépenses */}
                <div style={{ padding:"4px 0" }}>
                  {items.length === 0 && (
                    <div style={{ padding:"16px 18px", color:"var(--muted)", fontSize:12, textAlign:"center" }}>Aucune dépense dans cette catégorie.</div>
                  )}
                  {sorted.map((d, idx) => {
                    const cat    = CATEGORIES.find(c => c.id === d.categorie);
                    const barPct = Math.round((d.montant / maxItem) * 100);
                    const isHov  = hover === d.id;
                    return (
                      <div key={d.id}
                        className="rw"
                        onMouseEnter={() => setHover(d.id)}
                        onMouseLeave={() => setHover(null)}
                        style={{
                          padding:"10px 18px",
                          borderBottom: idx < sorted.length-1 ? "1px solid rgba(0,200,255,0.05)" : "none",
                          background: isHov ? "rgba(0,200,255,0.03)" : "transparent",
                          transition:"background 0.15s",
                          position:"relative",
                        }}
                      >
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          {/* Rang */}
                          <span style={{ fontSize:10, color:"var(--muted)", fontFamily:"Space Mono,monospace", minWidth:16, textAlign:"right", flexShrink:0 }}>#{idx+1}</span>
                          {/* Icône catégorie */}
                          <span style={{ fontSize:18, flexShrink:0 }}>{cat?.icon || "📦"}</span>
                          {/* Label + badges */}
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
                              <span style={{ fontSize:isMobile?12:13, color:"var(--text)", fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                                {d.label}
                              </span>
                              {d.recurrent && (
                                <span style={{ fontSize:9, background:"rgba(201,168,76,0.15)", color:"var(--gold)", border:"1px solid rgba(201,168,76,0.3)", borderRadius:3, padding:"1px 5px", fontWeight:700, flexShrink:0 }}>
                                  RÉC
                                </span>
                              )}
                            </div>
                            {/* Mini barre proportionnelle */}
                            <div style={{ height:2, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                              <div className="pb-fill" style={{ height:"100%", width:barPct+"%", background:color, borderRadius:99, opacity:0.7 }} />
                            </div>
                          </div>
                          {/* Montant */}
                          <span className="mono" style={{ fontSize:isMobile?12:13, fontWeight:700, color:"var(--text)", flexShrink:0 }}>
                            {fmt(d.montant)}
                          </span>
                          {/* Bouton suppression */}
                          <button
                            className="dl"
                            onClick={e => { e.stopPropagation(); delDepense(d.id); }}
                            style={{ opacity: isHov ? 1 : 0, transition:"opacity 0.15s", background:"transparent", border:"none", color:"var(--red)", fontSize:16, cursor:"pointer", padding:"0 0 0 4px", flexShrink:0 }}
                          >×</button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Pied de groupe */}
                {items.length > 0 && (
                  <div style={{ padding:"8px 18px", borderTop:"1px solid rgba(0,200,255,0.05)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <span style={{ fontSize:10, color:"var(--muted)" }}>Moyenne : <span className="mono" style={{color:"var(--text)"}}>{fmt(Math.round(total/items.length))} FCFA</span></span>
                    <span style={{ fontSize:10, color:"var(--muted)" }}>Max : <span className="mono" style={{color}}>{fmt(maxItem)} FCFA</span></span>
                  </div>
                )}
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}
// ─── ONGLET GRAPHIQUES ──────────────────────────────────────────────────────────
function TabGraphiques({ data, mois }) {
  const isMobile = useMobile();
  const periode = getPeriode(data, mois);
  const revenus = periode.revenus.reduce((a,r)=>a+r.montant,0);
  const depenses = periode.depenses.reduce((a,d)=>a+d.montant,0);
  const solde = getSolde(data, mois);
  const investi = data.transactions.filter(t=>t.mois===mois&&t.type==="investissement").reduce((a,t)=>a+t.montant,0);
  const epargneObj = data.transactions.filter(t=>t.mois===mois&&t.type==="objectif").reduce((a,t)=>a+t.montant,0);
  const totalEpargne = investi + epargneObj;

  const tauxEpargne = revenus > 0 ? (totalEpargne / revenus) * 100 : 0;
  const tauxEpargneColor = tauxEpargne >= 20 ? "var(--green)" : "var(--red)";
  const depJour = depenses / 30;
  const autonomie = depJour > 0 ? solde / depJour : 0;
  const autonomieColor = autonomie >= 30 ? "var(--green)" : "var(--red)";

  // Fonds d'urgence (actifs de type urgence)
  const fondsUrgence = data.patrimoine.filter(p=>p.type==="urgence").reduce((a,p)=>a+p.valeurActuelle,0);
  const objectifUrgence = depenses * 3;

  // PieChart dépenses par catégorie
  const catData = CATEGORIES.map(cat => ({
    name: `${cat.icon} ${cat.label}`,
    value: periode.depenses.filter(d=>d.categorie===cat.id).reduce((a,d)=>a+d.montant,0),
  })).filter(d=>d.value>0);

  // Répartition fixes/envies/épargne
  const besoinsTotal = periode.depenses.filter(d=>["loyer","electricite","eau","gaz","transport","sante","internet","credit","assurance"].includes(d.categorie)).reduce((a,d)=>a+d.montant,0);
  const enviesTotal = depenses - besoinsTotal;
  const pieData = [
    { name: "Besoins", value: besoinsTotal, color: "#3B82F6" },
    { name: "Envies", value: enviesTotal, color: "#8B5CF6" },
    { name: "Épargne", value: totalEpargne, color: "#10B981" },
  ].filter(d=>d.value>0);

  // Multi-mois
  const allMois = Object.keys(data.periodes).sort();
  const multiData = allMois.map(m => {
    const p = data.periodes[m];
    const rev = p.revenus.reduce((a,r)=>a+r.montant,0);
    const dep = p.depenses.reduce((a,d)=>a+d.montant,0);
    const sol = getSolde(data, m);
    return { mois: moisLabel(m), Revenus: rev, Dépenses: dep, Solde: sol };
  });

  // Top 5 dépenses
  const top5 = [...periode.depenses].sort((a,b)=>b.montant-a.montant).slice(0,5);
  const maxDep = top5[0]?.montant || 1;

  const COLORS = ["#C9A84C","#3B82F6","#10B981","#8B5CF6","#EF4444","#F59E0B","#06B6D4","#EC4899"];

  const [hovKpi, setHovKpi] = React.useState(null);
  const ratioID = depenses > 0 ? (investi/depenses*100).toFixed(0) : null;
  const moisCouverts = depenses > 0 ? fondsUrgence / depenses : 0;
  const pctUrgence = objectifUrgence > 0 ? Math.min(100, (fondsUrgence / objectifUrgence) * 100) : 0;

  return (
    <div>
      {/* ── KPI Rangée 1 — métriques clés ── */}
      <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(3,1fr)", gap: isMobile?10:14, marginBottom:12 }}>
        {[
          {
            id:"taux", label:"Taux d'épargne", value:`${tauxEpargne.toFixed(1)}%`, icon:"💰",
            color: tauxEpargne>=20?"#10B981":"#EF4444",
            bg: tauxEpargne>=20?"rgba(16,185,129,0.08)":"rgba(239,68,68,0.08)",
            border: tauxEpargne>=20?"rgba(16,185,129,0.25)":"rgba(239,68,68,0.25)",
            sub: tauxEpargne>=20?"✓ Objectif atteint":"⚠ Objectif : ≥ 20%",
            bar: Math.min(100, tauxEpargne), barColor: tauxEpargne>=20?"#10B981":"#EF4444",
          },
          {
            id:"jour", label:"Dépense / jour", value:`${fmt(Math.round(depJour))}`, icon:"📅",
            color:"#06B6D4", bg:"rgba(6,182,212,0.08)", border:"rgba(6,182,212,0.25)",
            sub:"FCFA par jour ce mois",
            bar: depenses>0 ? Math.min(100,(depJour/5000)*100) : 0, barColor:"#06B6D4",
          },
          {
            id:"auto", label:"Autonomie", value:`${Math.round(autonomie)} j`, icon:"🗓️",
            color: autonomie>=30?"#10B981":"#EF4444",
            bg: autonomie>=30?"rgba(16,185,129,0.08)":"rgba(239,68,68,0.08)",
            border: autonomie>=30?"rgba(16,185,129,0.25)":"rgba(239,68,68,0.25)",
            sub: autonomie>=30?"✓ Bonne liquidité":"⚠ Objectif : ≥ 30 jours",
            bar: Math.min(100,(autonomie/90)*100), barColor: autonomie>=30?"#10B981":"#EF4444",
          },
        ].map(k => {
          const isH = hovKpi === k.id;
          return (
            <div key={k.id} onMouseEnter={()=>setHovKpi(k.id)} onMouseLeave={()=>setHovKpi(null)}
              style={{ borderRadius:12, border:`1px solid ${isH?k.color:k.border}`, background: isH?k.bg:`${k.color}06`, padding: isMobile?"14px 12px":"18px 16px", position:"relative", overflow:"hidden", cursor:"default", transform: isH?"translateY(-2px)":"translateY(0)", boxShadow: isH?`0 6px 22px ${k.color}33`:"none", transition:"all 0.2s ease" }}>
              <div style={{ position:"absolute", top:-20, right:-20, width:70, height:70, borderRadius:"50%", background:k.color, opacity: isH?0.12:0.06, transition:"opacity 0.2s", pointerEvents:"none" }} />
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                <div style={{ width:32, height:32, borderRadius:9, background:`${k.color}22`, border:`1px solid ${k.color}44`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flexShrink:0 }}>{k.icon}</div>
                <span style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.08em" }}>{k.label}</span>
              </div>
              <div style={{ fontSize: isMobile?22:28, fontWeight:800, color:k.color, fontFamily:"'Space Grotesk',sans-serif", lineHeight:1, marginBottom:4 }}>{k.value}</div>
              <div style={{ fontSize:10, color: k.sub.startsWith("✓")?"#10B981": k.sub.startsWith("⚠")?"#EF4444":"var(--muted)", marginBottom:10 }}>{k.sub}</div>
              <div style={{ height:4, background:"rgba(255,255,255,0.05)", borderRadius:3, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${k.bar}%`, background:k.barColor, borderRadius:3, transition:"width 0.8s ease", boxShadow:`0 0 6px ${k.barColor}66` }} />
              </div>
              <div style={{ position:"absolute", bottom:0, left:0, right:0, height:2, background:`linear-gradient(90deg,${k.color}88,transparent)` }} />
            </div>
          );
        })}
      </div>

      {/* ── KPI Rangée 2 — épargne détaillée ── */}
      <div style={{ display:"grid", gridTemplateColumns: isMobile?"1fr 1fr":"repeat(4,1fr)", gap: isMobile?10:14, marginBottom:18 }}>
        {[
          { id:"ep",  label:"Épargne ce mois", value:fmt(totalEpargne), sub:"FCFA",            icon:"📊", color:"#8B5CF6", pct: revenus>0?Math.min(100,(totalEpargne/revenus)*100):0 },
          { id:"inv", label:"Investi",          value:fmt(investi),      sub:"FCFA",            icon:"📈", color:"#3B82F6", pct: revenus>0?Math.min(100,(investi/revenus)*100):0 },
          { id:"obj", label:"Objectifs",        value:fmt(epargneObj),   sub:"FCFA",            icon:"🎯", color:"#C9A84C", pct: revenus>0?Math.min(100,(epargneObj/revenus)*100):0 },
          { id:"rat", label:"Ratio I/D",        value: ratioID ? ratioID+"%" : "—", sub:"investi/dépenses", icon:"⚖️", color: ratioID && parseInt(ratioID)>=20?"#10B981":"#F59E0B", pct: ratioID ? Math.min(100,parseInt(ratioID)) : 0 },
        ].map(k => {
          const isH = hovKpi === k.id;
          return (
            <div key={k.id} onMouseEnter={()=>setHovKpi(k.id)} onMouseLeave={()=>setHovKpi(null)}
              style={{ borderRadius:10, border:`1px solid ${isH?k.color:`${k.color}30`}`, background:`${k.color}07`, padding: isMobile?"12px 10px":"14px 12px", position:"relative", overflow:"hidden", cursor:"default", transform: isH?"translateY(-2px)":"translateY(0)", boxShadow: isH?`0 4px 16px ${k.color}33`:"none", transition:"all 0.2s ease" }}>
              <div style={{ position:"absolute", top:-14, right:-14, width:50, height:50, borderRadius:"50%", background:k.color, opacity: isH?0.1:0.05, transition:"opacity 0.2s", pointerEvents:"none" }} />
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8 }}>
                <span style={{ fontSize:14 }}>{k.icon}</span>
                <span style={{ fontSize:8, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.07em" }}>{k.label}</span>
              </div>
              <div style={{ fontSize: isMobile?14:17, fontWeight:800, color:k.color, fontFamily:"'Space Grotesk',sans-serif", marginBottom:2 }}>{k.value}</div>
              <div style={{ fontSize:9, color:"var(--muted)", marginBottom:8 }}>{k.sub}</div>
              <div style={{ height:3, background:"rgba(255,255,255,0.05)", borderRadius:2, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${k.pct}%`, background:k.color, borderRadius:2, transition:"width 0.8s ease" }} />
              </div>
              <div style={{ position:"absolute", bottom:0, left:0, right:0, height:2, background:`linear-gradient(90deg,${k.color}55,transparent)` }} />
            </div>
          );
        })}
      </div>

      {/* ── Fonds d'urgence ── */}
      <div style={{ borderRadius:14, border:`1px solid ${pctUrgence>=100?"rgba(16,185,129,0.35)":"rgba(0,200,255,0.15)"}`, background: pctUrgence>=100?"rgba(16,185,129,0.06)":"rgba(0,200,255,0.03)", overflow:"hidden", marginBottom:16 }}>
        {/* Barre de progression en haut */}
        <div style={{ height:4, background:"rgba(255,255,255,0.04)" }}>
          <div style={{ height:"100%", width:`${pctUrgence}%`, background: pctUrgence>=100?"linear-gradient(90deg,#10B981,#06D6A0)":"linear-gradient(90deg,#06B6D4,#3B82F6)", transition:"width 1s ease", boxShadow: pctUrgence>=100?"0 0 8px #10B98199":"0 0 8px #06B6D499" }} />
        </div>
        <div style={{ padding: isMobile?"16px 14px":"20px 20px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:38, height:38, borderRadius:10, background: pctUrgence>=100?"rgba(16,185,129,0.2)":"rgba(6,182,212,0.15)", border:`1px solid ${pctUrgence>=100?"rgba(16,185,129,0.4)":"rgba(6,182,212,0.3)"}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>🛡️</div>
              <div>
                <div style={{ fontSize:13, fontWeight:700, color:"var(--text)" }}>Fonds d'urgence</div>
                <div style={{ fontSize:10, color:"var(--muted)" }}>Objectif : 3 mois de dépenses</div>
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:20, fontWeight:800, color: pctUrgence>=100?"#10B981":"#06B6D4" }}>{pctUrgence.toFixed(0)}%</div>
              <div style={{ fontSize:10, color: pctUrgence>=100?"#10B981":"var(--muted)" }}>{pctUrgence>=100?"✓ Objectif atteint":"en cours"}</div>
            </div>
          </div>

          {/* 3 stats horizontales */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:0, borderRadius:10, border:"1px solid rgba(0,200,255,0.1)", overflow:"hidden", marginBottom:14 }}>
            {[
              { label:"Constitué",      value:`${fmt(fondsUrgence)}`, sub:"FCFA", color:"#10B981" },
              { label:"Objectif 3 mois",value:`${fmt(objectifUrgence)}`, sub:"FCFA", color:"#06B6D4" },
              { label:"Couvre",         value: depenses>0?`${moisCouverts.toFixed(1)} mois`:"—", sub: depenses>0?`/ 3 mois objectif`:"", color: moisCouverts>=3?"#10B981":moisCouverts>=1?"#F59E0B":"#EF4444" },
            ].map((s,i)=>(
              <div key={i} style={{ padding:"12px 8px", textAlign:"center", borderRight: i<2?"1px solid rgba(0,200,255,0.1)":"none", background:"rgba(0,0,0,0.15)" }}>
                <div style={{ fontSize:9, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:5 }}>{s.label}</div>
                <div style={{ fontSize: isMobile?12:14, fontWeight:800, color:s.color }}>{s.value}</div>
                {s.sub && <div style={{ fontSize:9, color:"var(--muted)", marginTop:2 }}>{s.sub}</div>}
              </div>
            ))}
          </div>

          {/* Barre segmentée 3 mois */}
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--muted)", marginBottom:4 }}>
              <span>0</span><span>1 mois</span><span>2 mois</span><span>3 mois ✓</span>
            </div>
            <div style={{ height:8, background:"rgba(255,255,255,0.05)", borderRadius:6, overflow:"hidden", position:"relative" }}>
              <div style={{ height:"100%", width:`${pctUrgence}%`, background: pctUrgence>=100?"linear-gradient(90deg,#10B981,#06D6A0)":"linear-gradient(90deg,#06B6D4,#3B82F6)", borderRadius:6, transition:"width 1s ease", boxShadow: pctUrgence>=100?"0 0 8px #10B98155":"0 0 8px #06B6D455" }} />
              {/* Marqueurs 1 mois, 2 mois */}
              {[33.3,66.6].map((p,i)=>(
                <div key={i} style={{ position:"absolute", top:0, left:`${p}%`, width:1, height:"100%", background:"rgba(255,255,255,0.2)" }} />
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Répartition budget — RadialBar (jauge circulaire) */}
      {pieData.length > 0 && revenus > 0 && (
        <div style={G.card}>
          <SectionHeader title="Répartition budget" color="var(--gold)" />
          {/* Données normalisées 0-100 pour les jauges */}
          {(() => {
            const radialData = pieData.map(d => ({
              ...d,
              fill: d.color,
              pct: Math.round((d.value / revenus) * 100),
            }));
            return (
              <div style={{ display: "flex", alignItems: "center", gap: isMobile ? 12 : 24 }}>
                {/* Graphique RadialBar */}
                <ResponsiveContainer width={isMobile ? 160 : 200} height={isMobile ? 160 : 200}>
                  <RadialBarChart
                    cx="50%" cy="50%"
                    innerRadius={isMobile ? 24 : 30}
                    outerRadius={isMobile ? 72 : 88}
                    barSize={isMobile ? 14 : 18}
                    data={radialData}
                    startAngle={90} endAngle={-270}
                  >
                    <RadialBar
                      dataKey="pct"
                      cornerRadius={6}
                      background={{ fill: "rgba(0,200,255,0.04)" }}
                    >
                      {radialData.map((e, i) => <Cell key={i} fill={e.color} />)}
                    </RadialBar>
                    <Tooltip
                      formatter={(v, name, props) => [`${props.payload.pct}% — ${fmt(props.payload.value)} FCFA`, props.payload.name]}
                      contentStyle={{ background:"rgba(11,22,40,0.95)", border:"1px solid rgba(0,200,255,0.2)", borderRadius:4, fontFamily:"Space Mono,monospace", fontSize:11 }}
                    />
                  </RadialBarChart>
                </ResponsiveContainer>
                {/* Légende détaillée */}
                <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 10 }}>
                  {radialData.map((d, i) => (
                    <div key={i}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom: 4 }}>
                        <div style={{ display:"flex", alignItems:"center", gap: 6 }}>
                          <div style={{ width:8, height:8, borderRadius:2, background:d.color, flexShrink:0 }} />
                          <span style={{ fontSize: isMobile ? 11 : 12, color:"var(--muted)", fontWeight:600, letterSpacing:"0.04em", textTransform:"uppercase" }}>{d.name}</span>
                        </div>
                        <span className="mono" style={{ fontSize: isMobile ? 11 : 13, fontWeight:700, color:d.color }}>{d.pct}%</span>
                      </div>
                      <div style={{ height: 3, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                        <div className="pb-fill" style={{ height:"100%", width:`${d.pct}%`, background:d.color, borderRadius:99, boxShadow:`0 0 6px ${d.color}66` }} />
                      </div>
                      <div style={{ fontSize: isMobile ? 9 : 10, color:"var(--muted)", marginTop:2, fontFamily:"Space Mono,monospace" }}>{fmt(d.value)} FCFA</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* Évolution multi-mois */}
      {multiData.length > 1 && (
        <div style={G.card}>
          <SectionHeader title="Évolution multi-mois" color="var(--blue)" />
          <ResponsiveContainer width="100%" height={isMobile ? 160 : 220}>
            <LineChart data={multiData}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(0,200,255,0.06)" />
              <XAxis dataKey="mois" tick={{fill:"#8BBAD8",fontSize:isMobile?9:11}} />
              <YAxis tick={{fill:"#8BBAD8",fontSize:isMobile?9:11}} tickFormatter={v=>fmt(v/1000)+"k"} width={isMobile?38:50} />
              <Tooltip formatter={v=>`${fmt(v)} FCFA`} contentStyle={{background:"rgba(11,22,40,0.95)",border:"1px solid rgba(0,200,255,0.2)",borderRadius:4,fontFamily:"Space Mono,monospace",fontSize:11,boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}} />
              <Legend wrapperStyle={{fontSize: isMobile ? 10 : 12, color:"#8BBAD8"}} />
              <Line type="monotone" dataKey="Revenus" stroke="var(--green)" strokeWidth={2} dot={false} />
              <Line type="monotone" dataKey="Dépenses" stroke="var(--red)" strokeWidth={2} dot={false} />
              <Line type="monotone" dataKey="Solde" stroke="var(--gold)" strokeWidth={2} dot={false} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      )}

      {/* BarChart Revenus vs Dépenses */}
      {multiData.length > 0 && (
        <div style={G.card}>
          <SectionHeader title="Revenus vs Dépenses" color="var(--accent)" />
          <ResponsiveContainer width="100%" height={isMobile ? 150 : 200}>
            <BarChart data={multiData}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(0,200,255,0.06)" />
              <XAxis dataKey="mois" tick={{fill:"#8BBAD8",fontSize:11}} />
              <YAxis tick={{fill:"#8BBAD8",fontSize:11}} tickFormatter={v=>fmt(v/1000)+"k"} />
              <Tooltip formatter={v=>`${fmt(v)} FCFA`} contentStyle={{background:"rgba(11,22,40,0.95)",border:"1px solid rgba(0,200,255,0.2)",borderRadius:4,fontFamily:"Space Mono,monospace",fontSize:11,boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}} />
              <Legend />
              <Bar dataKey="Revenus" fill="var(--green)" radius={[4,4,0,0]} />
              <Bar dataKey="Dépenses" fill="var(--red)" radius={[4,4,0,0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}

      {/* BarChart horizontal — Dépenses par catégorie */}
      {catData.length > 0 && (
        <div style={G.card}>
          <SectionHeader title="Dépenses par catégorie" color="var(--gold)" />
          {(() => {
            const total = catData.reduce((a,d) => a+d.value, 0);
            const sorted = [...catData]
              .sort((a,b) => b.value - a.value)
              .map((d,i) => ({
                ...d,
                color: COLORS[i % COLORS.length],
                pct: total > 0 ? ((d.value/total)*100).toFixed(1) : "0",
              }));
            return (
              <div style={{ display:"flex", flexDirection:"column", gap: isMobile ? 8 : 10 }}>
                {sorted.map((d, i) => (
                  <div key={d.name}>
                    {/* Ligne label */}
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                      <span style={{ fontSize: isMobile ? 11 : 12, color:"var(--text)", fontWeight:500, display:"flex", alignItems:"center", gap:6 }}>
                        <span style={{ display:"inline-block", width:8, height:8, borderRadius:2, background:d.color, flexShrink:0 }} />
                        {d.name}
                      </span>
                      <div style={{ display:"flex", gap:8, alignItems:"baseline" }}>
                        <span className="mono" style={{ fontSize: isMobile ? 10 : 11, color:"var(--muted)" }}>{d.pct}%</span>
                        <span className="mono" style={{ fontSize: isMobile ? 11 : 12, color:d.color, fontWeight:700, minWidth: isMobile ? 80 : 110, textAlign:"right" }}>{fmt(d.value)}</span>
                      </div>
                    </div>
                    {/* Barre */}
                    <div style={{ height: isMobile ? 5 : 6, background:"rgba(0,200,255,0.06)", borderRadius:99, overflow:"hidden" }}>
                      <div className="pb-fill" style={{
                        height:"100%",
                        width: total > 0 ? ((d.value/total)*100)+"%" : "0%",
                        background: `linear-gradient(90deg, ${d.color}, ${d.color}99)`,
                        borderRadius:99,
                        boxShadow:`0 0 8px ${d.color}55`,
                      }} />
                    </div>
                  </div>
                ))}
                {/* Total */}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", paddingTop: isMobile ? 8 : 10, marginTop:4, borderTop:"1px solid rgba(0,200,255,0.1)" }}>
                  <span style={{ fontSize: isMobile ? 11 : 12, color:"var(--muted)", fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Total</span>
                  <span className="mono neon-text" style={{ fontSize: isMobile ? 13 : 15, color:"var(--gold)", fontWeight:800 }}>{fmt(total)} FCFA</span>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* Top 5 */}
      {top5.length > 0 && (
        <div style={G.card}>
          <SectionHeader title="Top 5 dépenses" color="var(--gold)" />
          {top5.map((d,i) => (
            <div key={d.id} style={{ marginBottom:10 }}>
              <div style={{ ...G.row, justifyContent:"space-between", marginBottom:4 }}>
                <span style={{ fontSize:13, color:"var(--text)" }}>
                  {CATEGORIES.find(c=>c.id===d.categorie)?.icon} {d.label}
                </span>
                <span style={{ fontSize:12, color:"var(--muted)" }}>
                  {fmt(d.montant)} FCFA ({revenus>0?(d.montant/revenus*100).toFixed(1):0}%)
                </span>
              </div>
              <div style={{ background:"var(--surface)", borderRadius:99, height:6, overflow:"hidden" }}>
                <div className="pb-fill" style={{ width:`${(d.montant/maxDep)*100}%`, height:"100%", background:COLORS[i], boxShadow:`0 0 6px ${COLORS[i]}88`, borderRadius:99 }}/>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── ONGLET OBJECTIFS ────────────────────────────────────────────────────────────
function TabObjectifs({ data, setData, mois, userPlan, onUpgrade }) {
  const isMobile = useMobile();
  const [showForm, setShowForm] = useState(false);
  const [nom, setNom] = useState("");
  const [cible, setCible] = useState("");
  const [icon, setIcon] = useState("🏠");

  const [actionObj, setActionObj] = useState(null); // { id, type: 'alimenter'|'retirer', montant }
  const [montantAction, setMontantAction] = useState("");

  const solde = getSolde(data, mois);

  const creerObjectif = () => {
    const c = parseFloat(cible);
    if (!nom.trim() || isNaN(c) || c <= 0) return;
    if (userPlan && !userPlan.is_premium && data.objectifs.length >= (userPlan.max_objectifs || 2)) {
      if (onUpgrade) onUpgrade("limit_objectifs");
      return;
    }
    const obj = { id: genId(), nom: nom.trim(), cible: c, epargne: 0, icon };
    setData({ ...data, objectifs: [...data.objectifs, obj] });
    setNom(""); setCible(""); setIcon("🏠"); setShowForm(false);
  };

  const alimenter = (objId) => {
    const m = parseFloat(montantAction);
    if (isNaN(m) || m <= 0 || m > solde) return;
    const tx = { id: genId(), date: new Date().toISOString().split("T")[0], mois, type: "objectif", cible: "objectif", montant: m, objectifId: objId };
    const newData = {
      ...data,
      objectifs: data.objectifs.map(o => o.id === objId ? { ...o, epargne: o.epargne + m } : o),
      transactions: [...data.transactions, tx],
      periodes: {
        ...data.periodes,
        [mois]: { ...getPeriode(data, mois), allocations: (getPeriode(data, mois).allocations || 0) + m }
      }
    };
    setData(newData);
    setActionObj(null); setMontantAction("");
  };

  const retirer = (objId) => {
    const m = parseFloat(montantAction);
    const obj = data.objectifs.find(o => o.id === objId);
    if (!obj || isNaN(m) || m <= 0 || m > obj.epargne) return;
    const tx = { id: genId(), date: new Date().toISOString().split("T")[0], mois, type: "retrait_objectif", cible: "objectif", montant: m, objectifId: objId };
    const newData = {
      ...data,
      objectifs: data.objectifs.map(o => o.id === objId ? { ...o, epargne: Math.max(0, o.epargne - m) } : o),
      transactions: [...data.transactions, tx],
      periodes: {
        ...data.periodes,
        [mois]: { ...getPeriode(data, mois), allocations: Math.max(0, (getPeriode(data, mois).allocations || 0) - m) }
      }
    };
    setData(newData);
    setActionObj(null); setMontantAction("");
  };

  const supprimerObjectif = (objId) => {
    const txs = data.transactions.filter(t => t.objectifId === objId);
    let periodes = { ...data.periodes };
    txs.forEach(tx => {
      if (tx.type === "objectif") {
        if (!periodes[tx.mois]) periodes[tx.mois] = DEFAULT_PERIODE();
        periodes[tx.mois] = { ...periodes[tx.mois], allocations: Math.max(0, (periodes[tx.mois].allocations || 0) - tx.montant) };
      }
    });
    setData({
      ...data,
      objectifs: data.objectifs.filter(o => o.id !== objId),
      transactions: data.transactions.filter(t => t.objectifId !== objId),
      periodes,
    });
  };

  return (
    <div>
      <div style={{ ...G.row, justifyContent: "space-between", marginBottom: 16 }}>
        <div style={{ color: "var(--muted)", fontSize: 13 }}>Solde disponible : <span style={{ color: "var(--gold)", fontWeight: 700 }}>{fmt(solde)} FCFA</span></div>
        <button style={G.btnSm()} onClick={() => setShowForm(!showForm)}>+ Nouvel objectif</button>
      </div>

      {showForm && (
        <div style={G.card}>
          <SectionHeader title="Créer un objectif" color="var(--accent)" />
          <label style={G.label}>Nom de l'objectif</label>
          <input style={{ ...G.input, marginBottom: 10 }} value={nom} onChange={e => setNom(e.target.value)} placeholder="Ex: Voiture, Vacances..." />
          <label style={G.label}>Montant cible (FCFA)</label>
          <input style={{ ...G.input, marginBottom: 10 }} type="number" value={cible} onChange={e => setCible(e.target.value)} placeholder="Ex: 2000000" />
          <label style={G.label}>Icône</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
            {ICONS_OBJECTIFS.map(ic => (
              <button key={ic} onClick={() => setIcon(ic)} style={{
                background: icon === ic ? "var(--gold)" : "var(--surface)",
                border: `1px solid ${icon === ic ? "var(--gold)" : "var(--border)"}`,
                borderRadius: 8, width: 40, height: 40, fontSize: 18, cursor: "pointer",
              }}>{ic}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button style={{ ...G.btn("var(--surface)"), flex: 1 }} onClick={() => setShowForm(false)}>Annuler</button>
            <button style={{ ...G.btn(), flex: 2 }} onClick={creerObjectif}>Créer</button>
          </div>
        </div>
      )}

      {data.objectifs.length === 0 && !showForm && (
        <div style={{ ...G.card, textAlign: "center", color: "var(--muted)" }}>
          <div style={{ fontSize: 40, marginBottom: 10 }}>🎯</div>
          <div>Aucun objectif défini. Créez votre premier objectif !</div>
        </div>
      )}

      {data.objectifs.map((obj, objIdx) => {
        const pct = obj.cible > 0 ? Math.min(100, (obj.epargne / obj.cible) * 100) : 0;
        const atteint = pct >= 100;
        const isAction = actionObj?.id === obj.id;
        return (
          <div key={obj.id} style={{ ...G.card, border: atteint ? "1px solid var(--green)" : "1px solid var(--border)" }}>
            <div style={{ ...G.row, justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ ...G.row }}>
                <span style={{ fontSize: 28 }}>{obj.icon}</span>
                <div>
                  <div style={{ fontWeight: 700, color: "var(--text)", fontSize: 15 }}>{obj.nom}</div>
                  <div style={{ fontSize: 12, color: "var(--muted)" }}>
                    {fmt(obj.epargne)} / {fmt(obj.cible)} FCFA ({pct.toFixed(0)}%)
                  </div>
                </div>
              </div>
              <button onClick={e => { e.stopPropagation(); supprimerObjectif(obj.id); }}
                style={{ background: "none", border: "none", color: "var(--red)", fontSize: 18, cursor: "pointer" }}>×</button>
            </div>
            <ProgressBar value={obj.epargne} max={obj.cible} color={atteint ? "var(--green)" : "var(--gold)"} height={10} />
            {atteint && <div style={{ textAlign: "center", marginTop: 8, fontSize: 14 }}>🎉 Objectif atteint !</div>}
            <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>
              Reste : {fmt(Math.max(0, obj.cible - obj.epargne))} FCFA
            </div>

            {!atteint && (
              <div style={{ ...G.row, marginTop: 10, gap: 8 }}>
                <button onClick={e => { e.stopPropagation(); setActionObj({ id: obj.id, type: "alimenter" }); setMontantAction(""); }}
                  style={G.btnSm("var(--green)")}>💰 Alimenter</button>
                {obj.epargne > 0 && (
                  <button onClick={e => { e.stopPropagation(); setActionObj({ id: obj.id, type: "retirer" }); setMontantAction(""); }}
                    style={G.btnSm("var(--surface)")}>↩ Retirer</button>
                )}
              </div>
            )}

            {isAction && (
              <div style={{ marginTop: 12, padding: 12, background: "var(--surface)", borderRadius: 8 }} onClick={e => e.stopPropagation()}>
                <label style={G.label}>
                  {actionObj.type === "alimenter" ? `Montant (max ${fmt(solde)} FCFA)` : `Montant (max ${fmt(obj.epargne)} FCFA)`}
                </label>
                <div style={G.row}>
                  <input style={{ ...G.input, flex: 1 }} type="number" value={montantAction} onChange={e => setMontantAction(e.target.value)} />
                  <button onClick={e => { e.stopPropagation(); actionObj.type === "alimenter" ? alimenter(obj.id) : retirer(obj.id); }}
                    style={G.btnSm("var(--gold)")}>✓</button>
                  <button onClick={e => { e.stopPropagation(); setActionObj(null); }}
                    style={G.btnSm("var(--surface)")}>✗</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
// ─── ONGLET INVESTIR ─────────────────────────────────────────────────────────────
function TabInvestir({ data, setData, mois }) {
  const isMobile = useMobile();
  const [expanded, setExpanded] = useState(null);
  const [montants, setMontants] = useState({});
  const [noms, setNoms] = useState({});
  const [selectedPcts, setSelectedPcts] = useState({});
  const [confirmAnnuler, setConfirmAnnuler] = useState(null);
  const [filtreHistorique, setFiltreHistorique] = useState("tout");
  const [showHistorique, setShowHistorique] = useState(false);

  const solde = getSolde(data, mois);
  const totalInvesti = getTotalInvesti(data);
  const revenu = data.profil.revenuMensuel || 1;
  const tauxInvesti = Math.min(100, Math.round((totalInvesti / (revenu || 1)) * 100));

  // Couleurs par type
  const TYPE_COLORS = {
    urgence: "#10B981", projet: "#3B82F6", fcp: "#8B5CF6",
    brvm: "#C9A84C", crypto: "#F59E0B", terrain: "#84CC16",
    immobilier: "#06B6D4", or: "#F97316", vehicule: "#EC4899", autre: "#6B7280",
  };

  const investir = (type) => {
    const m = parseFloat(montants[type.id] || "0");
    if (isNaN(m) || m <= 0 || m > solde) return;
    const nom = noms[type.id] || type.label;
    const date = new Date().toISOString().split("T")[0];
    const existingActif = data.patrimoine.find(p => p.type === type.assetType && p.nom === nom && p.source === "app");
    let patrimoine, patrimoineId;
    if (existingActif) {
      patrimoineId = existingActif.id;
      patrimoine = data.patrimoine.map(p =>
        p.id === existingActif.id
          ? { ...p, valeurInitiale: p.valeurInitiale + m, valeurActuelle: p.valeurActuelle + m }
          : p
      );
    } else {
      patrimoineId = genId();
      const newActif = { id: patrimoineId, type: type.assetType, nom, valeurInitiale: m, valeurActuelle: m, dateAchat: date, source: "app" };
      patrimoine = [...data.patrimoine, newActif];
    }
    const tx = { id: genId(), date, mois, type: "investissement", cible: type.id, montant: m, patrimoineId };
    setData({
      ...data, patrimoine,
      transactions: [...data.transactions, tx],
      periodes: { ...data.periodes, [mois]: { ...getPeriode(data, mois), allocations: (getPeriode(data, mois).allocations || 0) + m } }
    });
    setMontants(prev => ({ ...prev, [type.id]: "" }));
    setNoms(prev => ({ ...prev, [type.id]: "" }));
    setSelectedPcts(prev => ({ ...prev, [type.id]: null }));
    setExpanded(null);
  };

  const supprimerDepot = (txId) => {
    const tx = data.transactions.find(t => t.id === txId);
    if (!tx) return;
    const actif = data.patrimoine.find(p => p.id === tx.patrimoineId);
    let patrimoine = data.patrimoine;
    if (actif) {
      const newVal = Math.max(0, actif.valeurActuelle - tx.montant);
      const newInit = Math.max(0, actif.valeurInitiale - tx.montant);
      if (newVal <= 0 && newInit <= 0) {
        const otherTx = data.transactions.filter(t => t.patrimoineId === actif.id && t.id !== txId);
        patrimoine = otherTx.length === 0
          ? data.patrimoine.filter(p => p.id !== actif.id)
          : data.patrimoine.map(p => p.id === actif.id ? { ...p, valeurInitiale: newInit, valeurActuelle: newVal } : p);
      } else {
        patrimoine = data.patrimoine.map(p => p.id === actif.id ? { ...p, valeurInitiale: newInit, valeurActuelle: newVal } : p);
      }
    }
    const periodes = { ...data.periodes };
    if (periodes[tx.mois]) periodes[tx.mois] = { ...periodes[tx.mois], allocations: Math.max(0, (periodes[tx.mois].allocations || 0) - tx.montant) };
    setData({ ...data, patrimoine, transactions: data.transactions.filter(t => t.id !== txId), periodes });
    setConfirmAnnuler(null);
  };

  const txInvest = data.transactions.filter(t => t.type === "investissement").sort((a, b) => b.date.localeCompare(a.date));
  const txFiltrées = filtreHistorique === "tout" ? txInvest : txInvest.filter(t => t.cible === filtreHistorique);

  // Stats par type pour le mini-résumé
  const statsByType = INVEST_TYPES.reduce((acc, type) => {
    const actifs = data.patrimoine.filter(p => p.type === type.assetType && p.source === "app");
    const total = actifs.reduce((s, a) => s + a.valeurActuelle, 0);
    if (total > 0) acc[type.id] = { total, count: actifs.length, color: TYPE_COLORS[type.id] || "#6B7280" };
    return acc;
  }, {});

  const typesAvecInvest = Object.keys(statsByType).length;

  return (
    <div>
      {/* ── Banner amélioré ── */}
      <div style={{ ...G.card, borderColor: "var(--gold)", marginBottom: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 14 }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ color: "var(--muted)", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>Solde disponible</div>
            <div style={{ color: solde > 0 ? "var(--gold)" : "var(--red)", fontSize: isMobile ? 15 : 20, fontWeight: 800 }}>{fmt(solde)}</div>
            <div style={{ color: "var(--muted)", fontSize: 10 }}>FCFA</div>
          </div>
          <div style={{ textAlign: "center", borderLeft: "1px solid var(--border)", borderRight: "1px solid var(--border)" }}>
            <div style={{ color: "var(--muted)", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>Total investi</div>
            <div style={{ color: "var(--blue)", fontSize: isMobile ? 15 : 20, fontWeight: 800 }}>{fmt(totalInvesti)}</div>
            <div style={{ color: "var(--muted)", fontSize: 10 }}>FCFA</div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ color: "var(--muted)", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>Types actifs</div>
            <div style={{ color: "var(--cyan)", fontSize: isMobile ? 15 : 20, fontWeight: 800 }}>{typesAvecInvest}</div>
            <div style={{ color: "var(--muted)", fontSize: 10 }}>placements</div>
          </div>
        </div>
        {/* Barre taux d'investissement */}
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
            <span style={{ fontSize: 11, color: "var(--muted)" }}>Taux d'investissement global</span>
            <span style={{ fontSize: 11, color: tauxInvesti >= 20 ? "var(--green)" : "var(--gold)", fontWeight: 700 }}>{tauxInvesti}%</span>
          </div>
          <div style={{ height: 6, background: "var(--surface)", borderRadius: 4, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${Math.min(100, tauxInvesti)}%`, background: tauxInvesti >= 20 ? "var(--green)" : "var(--gold)", borderRadius: 4, transition: "width 0.4s ease" }} />
          </div>
          <div style={{ fontSize: 10, color: "var(--muted)", marginTop: 4 }}>Objectif recommandé : ≥ 20% du revenu mensuel</div>
        </div>
        {/* Mini chips par type investi */}
        {typesAvecInvest > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>
            {INVEST_TYPES.filter(t => statsByType[t.id]).map(t => (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "3px 10px", borderRadius: 20, background: `${statsByType[t.id].color}22`, border: `1px solid ${statsByType[t.id].color}55`, fontSize: 11 }}>

      {solde <= 0 && <Alert type="error">⚠️ Solde insuffisant pour investir ce mois.</Alert>}

      {/* ── Types d'investissement ── */}
      <div style={{ fontSize: 11, color: "var(--muted)", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.07em" }}>Choisir un placement</div>

                  <div style={{ borderRadius: 10, background: `${typeColor}12`, border: `1px solid ${typeColor}30`, overflow: "hidden", marginBottom: 14 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 0 }}>
                      {[

                    </div>
                  </div>
                )}

                  onClick={() => investir(type)} disabled={m <= 0 || m > solde}>
                  {type.icon} Investir {m > 0 && m <= solde ? `${fmt(m)} FCFA` : ""} ✓

          </div>

      })}

      {/* ── Historique ── */}
      <div style={{ marginTop: 20 }}>

                  Tous ({txInvest.length})

                    {t.icon} {txInvest.filter(tx => tx.cible === t.id).length}
                  </button>
                ))}
              </div>
            )}

            {txFiltrées.length === 0 && <div style={{ color: "var(--muted)", fontSize: 13, textAlign: "center", padding: 20 }}>Aucun investissement enregistré.</div>}

            {txFiltrées.map((tx, i) => {
              const actif = data.patrimoine.find(p => p.id === tx.patrimoineId);
              const typeInfo = INVEST_TYPES.find(t => t.id === tx.cible);
              const tColor = TYPE_COLORS[tx.cible] || "var(--gold)";
              const isConfirm = confirmAnnuler === tx.id;
              return (
                <div key={tx.id} style={{ borderBottom: i < txFiltrées.length - 1 ? "1px solid var(--border)" : "none", padding: "10px 0" }}>

                    <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                      <div style={{ width: 32, height: 32, borderRadius: 8, background: `${tColor}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>
                        {typeInfo?.icon || "💰"}
                      </div>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {actif?.nom || tx.cible}
                        </div>
                        <div style={{ fontSize: 10, color: "var(--muted)" }}>{tx.date} · {moisLabel(tx.mois)}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                      <span style={{ color: tColor, fontWeight: 700, fontSize: 13 }}>{fmt(tx.montant)} <span style={{ fontSize: 10, color: "var(--muted)" }}>FCFA</span></span>
                      {!isConfirm && (
                        <button onClick={e => { e.stopPropagation(); setConfirmAnnuler(tx.id); }}
                          style={{ ...G.btnSm("var(--surface)"), fontSize: 11 }}>↩</button>
                      )}
                    </div>
                  </div>
                  {isConfirm && (
                    <div style={{ marginTop: 8, padding: "10px 12px", background: "rgba(239,68,68,0.08)", border: "1px solid rgba(239,68,68,0.25)", borderRadius: 8 }}>
                      <div style={{ fontSize: 12, color: "var(--text)", marginBottom: 8 }}>
                        Annuler ce dépôt de <strong style={{ color: "var(--red)" }}>{fmt(tx.montant)} FCFA</strong> ? Le solde sera restauré.
                      </div>
                      <div style={G.row}>
                        <button onClick={() => supprimerDepot(tx.id)} style={G.btnSm("var(--red)")}>Oui ✓</button>
                        <button onClick={() => setConfirmAnnuler(null)} style={G.btnSm("var(--surface)")}>Non ✗</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Total filtré */}
            {txFiltrées.length > 0 && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--border)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 12, color: "var(--muted)" }}>Total {filtreHistorique !== "tout" ? INVEST_TYPES.find(t => t.id === filtreHistorique)?.label : "affiché"}</span>
                <span style={{ fontSize: 14, fontWeight: 700, color: "var(--gold)" }}>{fmt(txFiltrées.reduce((s, t) => s + t.montant, 0))} FCFA</span>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
// ─── ONGLET CONSEIL ──────────────────────────────────────────────────────────────
function TabConseil({ data, mois, userPlan, setUserPlan, onUpgrade }) {
  const isMobile = useMobile();
  const solde = getSolde(data, mois);
  const { profilRisque } = data.profil;

  const [capital, setCapital] = useState("500000");
  const [versement, setVersement] = useState("50000");
  const [duree, setDuree] = useState("10");
  const [taux, setTaux] = useState("7");
  const [mode, setMode] = useState("composes");
  const [expandedPlacement, setExpandedPlacement] = useState(null);
  const [activePresetDuree, setActivePresetDuree] = useState("10");
  const [activePresetTaux, setActivePresetTaux] = useState(null);

  const P = parseFloat(capital) || 0;
  const V = parseFloat(versement) || 0;
  const n = parseFloat(duree) || 0;
  const r = (parseFloat(taux) || 0) / 100;

  let capitalFinal = 0;
  const totalVerse = P + V * n * 12;
  if (mode === "composes") {
    capitalFinal = r === 0 ? totalVerse : P * Math.pow(1 + r, n) + (V * 12) * (Math.pow(1 + r, n) - 1) / r;
  } else {
    capitalFinal = P * (1 + r * n) + V * n * 12;
  }
  const gain = capitalFinal - totalVerse;
  const multiplicateur = totalVerse > 0 ? (capitalFinal / totalVerse).toFixed(2) : "1.00";

  const projData = [];
  for (let y = 0; y <= n; y++) {
    let val = 0, paye = P + V * y * 12;
    if (mode === "composes") {
      val = r === 0 ? paye : P * Math.pow(1 + r, y) + (V * 12) * (r === 0 ? y : (Math.pow(1 + r, y) - 1) / r);
    } else {
      val = P * (1 + r * y) + V * y * 12;
    }
    projData.push({ an: `An ${y}`, Valeur: Math.round(val), Versé: Math.round(paye) });
  }

  const maxRisk = profilRisque === "prudent" ? 2 : profilRisque === "equilibre" ? 3 : 5;
  const placementsFiltrés = PLACEMENTS.filter(p => p.risk <= maxRisk);

  const strategies = {
    prudent:   [{ label: "Épargne sécurité", pct: 50, color: "#10B981", icon: "🛡️" }, { label: "FCP", pct: 40, color: "#3B82F6", icon: "📈" }, { label: "BRVM", pct: 10, color: "#C9A84C", icon: "📊" }],
    equilibre: [{ label: "Épargne sécurité", pct: 30, color: "#10B981", icon: "🛡️" }, { label: "FCP", pct: 30, color: "#3B82F6", icon: "📈" }, { label: "BRVM", pct: 30, color: "#C9A84C", icon: "📊" }, { label: "Terrain", pct: 10, color: "#8B5CF6", icon: "🌍" }],
    dynamique: [{ label: "Épargne sécurité", pct: 20, color: "#10B981", icon: "🛡️" }, { label: "BRVM", pct: 35, color: "#C9A84C", icon: "📊" }, { label: "Terrain/Immo", pct: 25, color: "#8B5CF6", icon: "🏗️" }, { label: "Crypto", pct: 20, color: "#F59E0B", icon: "₿" }],
  };
  const strategie = strategies[profilRisque] || strategies.equilibre;

  const RISK_COLORS = ["#10B981","#3B82F6","#F59E0B","#EF4444","#7C3AED"];

  // Presets durée et taux courants CI
  const PRESETS_DUREE = [{ v: "1", l: "1 an" }, { v: "3", l: "3 ans" }, { v: "5", l: "5 ans" }, { v: "10", l: "10 ans" }, { v: "20", l: "20 ans" }];
  const PRESETS_TAUX  = [{ v: "4", l: "4% Livret" }, { v: "6", l: "6% FCP" }, { v: "8", l: "8% BRVM" }, { v: "12", l: "12% Immo" }];

  return (
    <div>

      {(() => {

        const profilMeta = { prudent: { icon: "🛡️", label: "PRUDENT", color: "#10B981", bg: "rgba(16,185,129,0.08)", border: "rgba(16,185,129,0.25)", desc: "Sécurité avant tout" }, equilibre: { icon: "⚖️", label: "ÉQUILIBRÉ", color: "#3B82F6", bg: "rgba(59,130,246,0.08)", border: "rgba(59,130,246,0.25)", desc: "Risque modéré" }, dynamique: { icon: "🚀", label: "DYNAMIQUE", color: "#C9A84C", bg: "rgba(201,168,76,0.08)", border: "rgba(201,168,76,0.25)", desc: "Performance max" } };
        const pm = profilMeta[profilRisque] || profilMeta.equilibre;
        const cards = [

              <CartesianGrid strokeDasharray="3 3" stroke="rgba(0,200,255,0.06)" />
              <XAxis dataKey="an" tick={{ fill: "var(--muted)", fontSize: 10 }} />

              <Tooltip formatter={v => `${fmt(v)} FCFA`} contentStyle={{ background: "rgba(11,22,40,0.95)", border: "1px solid rgba(0,200,255,0.2)", borderRadius: 6, fontFamily: "Space Mono,monospace", fontSize: 11 }} />
              <Legend />
